name: Cache BetterOffice WASM
description: Restore compiled WASM outputs for the fork's source and toolchain fingerprint, and the late merge's.

runs:
  using: composite
  steps:
    - name: Fingerprint BetterOffice WASM inputs
      id: wasm
      shell: bash
      working-directory: vendor/betteroffice
      run: |
        fingerprint=$(bun scripts/wasm-cache-key.ts)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor/betteroffice/target/wasm-pack
        key: betteroffice-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.wasm.outputs.fingerprint }}
    # The late merge's WASM (scripts/build-late-merge.mjs, run by
    # office:prepare); its own fingerprint decides whether the restore is used.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: collaboration-rs/target/late-merge-wasm
        key: late-merge-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('collaboration-rs/.cargo/config.toml', 'collaboration-rs/Cargo.toml', 'collaboration-rs/Cargo.lock', 'collaboration-rs/crates/late-merge/Cargo.toml', 'collaboration-rs/crates/late-merge/src/**', 'vendor/betteroffice/third_party/yrs/Cargo.toml', 'vendor/betteroffice/third_party/yrs/src/**', 'scripts/build-late-merge.mjs') }}
