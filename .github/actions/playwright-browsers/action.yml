name: Install Playwright browsers
description: Install Playwright browsers with their system packages, the packages' .deb files kept in the Actions cache.

# `playwright install --with-deps` downloads ~120 MB of WebKit and Firefox
# packages with apt, and the runners' Ubuntu mirror sometimes serves them at a
# few KB/s: 20 to 55 minutes instead of 40 seconds in about one job in five
# (CI, 2026-10-19 to 24). The browsers come from Playwright's CDN in seconds.
inputs:
  browsers:
    description: Space-separated Playwright browsers, e.g. "firefox webkit"
    required: true

runs:
  using: composite
  steps:
    - name: Key the apt package cache
      id: key
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        version=$(pnpm exec playwright --version | awk '{print $2}')
        prefix="playwright-apt-v1-${ImageOS:?}-${BROWSERS// /-}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$version-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
    # A new runner image restores the previous image's packages, so apt
    # downloads only the ones that changed.
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: restore
      with:
        path: ~/.cache/playwright-apt
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: sudo cp ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/
    - shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: pnpm exec playwright install --with-deps $BROWSERS
    # autoclean drops the versions no index lists any more, so the entry does
    # not grow with each image.
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get autoclean
        rm -rf ~/.cache/playwright-apt
        mkdir -p ~/.cache/playwright-apt
        cp /var/cache/apt/archives/*.deb ~/.cache/playwright-apt/
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/playwright-apt
        key: ${{ steps.key.outputs.key }}
