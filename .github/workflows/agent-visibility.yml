# The Agent visibility lane (pipeline/tests/stack, Q529-Q534): what a person
# or the agent creates or edits reaches what the chat model receives. The e2e
# stack's Go server, collaboration server and Postgres, the real pipeline in
# process, a scripted model and stub embeddings: no provider is called.
# Nightly when the read path changed since the last green run, by hand, and
# as a production promotion gate (promote-production.yml).
name: Agent visibility

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Full Git SHA to test
        required: true
        type: string

permissions:
  # actions: the nightly run reads the last green run.
  actions: read
  contents: read

concurrency:
  # A promotion's call runs in a group of its own, so no nightly or manual run
  # cancels it.
  group: ${{ github.workflow == 'Agent visibility' && format('agent-visibility-{0}', github.ref) || format('agent-visibility-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The collaboration image builds the fork from vendor/betteroffice.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          submodules: recursive
      # The read path: the retrieval tools, Go's internal routes and the
      # stores behind them, the collaboration crates that compute changes,
      # the fork, the stack and the lane itself.
      - name: Skip a nightly run when the read path is unchanged since the last green run
        id: changed
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=agent-visibility.yml \
            --branch main --status=success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null &&
            git diff --quiet "$last" HEAD -- \
              pipeline/pipeline/retrieval \
              'server/internal/httpapi/internal_*.go' \
              server/internal/store/{note_index,source_documents,source_refresh,account_scope,item_changes,trash,file_move}.go \
              server/internal/{materialdoc,agenttools,embeds} \
              server/migrations \
              collaboration-rs/crates/{sources,notes,items} \
              collaboration-rs/crates/server/src/{edits,http,room}.rs \
              vendor/betteroffice \
              deploy/docker-compose.e2e.yml \
              e2e/fixtures/seed.sql \
              pipeline/tests/stack \
              .github/workflows/agent-visibility.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No read-path change since the last green run ($last)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The e2e_stack job's images and layer cache (ci.yml), read only.
      - if: steps.changed.outputs.run != 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.changed.outputs.run != 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: collaboration-rs/Dockerfile
          tags: capy-e2e-collaboration:local
          load: true
          cache-from: type=gha,scope=e2e-collaboration
      - if: steps.changed.outputs.run != 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          tags: capy-e2e-server:local
          load: true
          cache-from: type=gha,scope=e2e-server
      - if: steps.changed.outputs.run != 'false'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - if: steps.changed.outputs.run != 'false'
        run: uv sync --frozen --extra test
      # The lane starts the stack from the loaded images, seeds it and stops it.
      - if: steps.changed.outputs.run != 'false'
        name: Run the Agent visibility lane
        run: uv run --extra test pytest -m stack pipeline/tests/stack
        env:
          E2E_PREBUILT_IMAGES: "true"
