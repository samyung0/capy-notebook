name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run email:check
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:collaboration
      - run: pnpm run test:cloudflare-relay

  e2e_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:install
      - run: pnpm run e2e
      - run: pnpm run e2e:editor
      # Docker/Vite make these suites timing sensitive, and a failure that only
      # reproduces on the runner is undiagnosable without the traces.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            e2e/editor/playwright-report-editor/
            e2e/editor/test-results/
          retention-days: 7

  backend_check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_USER: evo
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      # The store/httpapi suites operate on the shared E2E actors (u_owner and
      # friends), so the schema alone is not enough to run them.
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f server/migrations/0001_init.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f e2e/fixtures/seed.sql
        env:
          TEST_DATABASE_URL: postgres://evo:evo@localhost:5432/evo?sslmode=disable
      # -p 1 because several packages reapply the migration on start-up, and
      # concurrent DDL on one database deadlocks.
      - run: go test -p 1 ./...
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://evo:evo@localhost:5432/evo?sslmode=disable

  pipeline_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --extra test pytest
