name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pin is a gitlink: Git records the SHA without checking that it exists
  # anywhere but the machine that staged it. An unpushed or off-branch pin
  # builds fine locally and breaks every fresh clone, so verify it here and
  # print what the bump actually contains.
  office_pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Verify vendor/betteroffice pin
        run: |
          set -euo pipefail
          pin=$(git ls-tree HEAD vendor/betteroffice | awk '{print $3}')
          url=$(git config -f .gitmodules submodule.vendor/betteroffice.url)
          branch=$(git config -f .gitmodules submodule.vendor/betteroffice.branch)
          previous=$(git ls-tree HEAD^ vendor/betteroffice 2>/dev/null | awk '{print $3}' || true)

          git init -q fork
          cd fork
          git remote add origin "$url"
          git fetch -q --filter=blob:none --no-tags origin "$branch"

          if ! git cat-file -e "$pin^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$pin" FETCH_HEAD; then
            echo "::error::vendor/betteroffice pin $pin is not reachable from $branch on $url. Push the commit to $branch before pinning it."
            exit 1
          fi

          echo "Pinned $pin on $branch:"
          git log -1 --format='  %h %s' "$pin"
          if [ -n "$previous" ] && [ "$previous" != "$pin" ]; then
            echo "Bumped from $previous:"
            git log --oneline --no-decorate "$previous..$pin" || true
          fi
      # The Office parity checklists (bench/parity) against the pin: every cited
      # test, file and matrix exists there and every Y cites a test. No builds.
      - name: Check the Office parity checklists
        run: |
          git submodule update --init --depth 1 vendor/betteroffice
          python3 -m unittest discover -s bench/parity/scripts -p 'test_*.py'
          python3 bench/parity/scripts/parity.py --check

  # The DOCX regression matrix (vendor/betteroffice/shared/matrix) gates a
  # commit that moves the BetterOffice pin, so a regressing pin never reaches
  # UAT; promotion inherits it through CI. Other commits skip it.
  office_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check whether the pin moved
        id: pin
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          pin=$(git ls-tree HEAD vendor/betteroffice | awk '{print $3}')
          previous=""
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            previous=$(git ls-tree "$BEFORE" vendor/betteroffice | awk '{print $3}')
          fi
          if [ "$pin" = "$previous" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "vendor/betteroffice pin unchanged ($pin); skipping the matrix."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "vendor/betteroffice pin ${previous:-(none)} -> $pin"
          fi
      - if: steps.pin.outputs.moved == 'true'
        run: git submodule update --init --recursive vendor/betteroffice
      - if: steps.pin.outputs.moved == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - if: steps.pin.outputs.moved == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - if: steps.pin.outputs.moved == 'true'
        uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - if: steps.pin.outputs.moved == 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - if: steps.pin.outputs.moved == 'true'
        uses: ./.github/actions/cache-betteroffice
      - if: steps.pin.outputs.moved == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.pin.outputs.moved == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 22
      - if: steps.pin.outputs.moved == 'true'
        run: pnpm install --frozen-lockfile
      # Builds the WASM cores and the checkpoint runtime the matrix loads.
      - if: steps.pin.outputs.moved == 'true'
        run: pnpm office:prepare
      - if: steps.pin.outputs.moved == 'true'
        working-directory: vendor/betteroffice
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun install --frozen-lockfile && bun run test:matrix
      - if: steps.pin.outputs.moved == 'true'
        name: DOCX publication regressions
        working-directory: vendor/betteroffice
        run: bun test --isolate shared/docx-*.test.ts
      - if: always() && steps.pin.outputs.moved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: docx-matrix-report
          path: ${{ runner.temp }}/docx-matrix-*/report.txt
          retention-days: 7

  frontend_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git diff --exit-code -- src/api/gen ops/src/api-gen
      - run: pnpm run email:check
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm review:validate-boundaries
      - run: pnpm test:deployment
      - run: pnpm typecheck:site
      - run: pnpm test:site
      - run: pnpm typecheck:office
      - run: pnpm test:office
      - run: pnpm typecheck:uat-inbox
      - run: pnpm test:uat-inbox
      # The pinned fork's golden seeds; a changed seed needs a maintenance window (record 23).
      - run: bun run test:golden
        working-directory: vendor/betteroffice
      - run: pnpm test:uat-seed
      - run: pnpm test
      - run: pnpm --filter @capy-notebook/ops typecheck
      - run: pnpm --filter @capy-notebook/ops test

  # The Rust collaboration server: format, lint, every test, the delta-save
  # and security integration tests among them against the e2e stack's
  # Postgres, Redis and Go API (they fail here, not skip, without it). Cost
  # tests count steps, so they run in debug with the rest.
  collaboration:
    runs-on: ubuntu-latest
    env:
      E2E_AUTH_SECRET: ci-collaboration-auth-secret-0123456789
      SHARE_LINK_SECRET: ci-collaboration-share-link-secret-0123456789
      COLLABORATION_SECRET: it-collaboration-secret
      CAPY_IT_REQUIRED: "1"
      CAPY_IT_DATABASE_URL: postgres://capy:capy@127.0.0.1:55432/capy
      CAPY_IT_REDIS_URL: redis://127.0.0.1:16379/0
      CAPY_IT_API_URL: http://127.0.0.1:18080
      SOURCES_TEST_DATABASE_URL: postgres://capy:capy@127.0.0.1:55432/capy
      SOURCES_TEST_REDIS_URL: redis://127.0.0.1:16379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: collaboration-rs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          tags: capy-e2e-server:local
          load: true
          cache-from: type=gha,scope=e2e-server
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The workspace's own crates (--all would reach into the fork's yrs).
      - run: cargo fmt --manifest-path collaboration-rs/Cargo.toml -p server -p sources -p notes -p ydoc --check
      - run: cargo clippy --manifest-path collaboration-rs/Cargo.toml --workspace --all-targets -- -D warnings
      - run: docker compose -f deploy/docker-compose.e2e.yml -p collaboration-it up --no-build -d --wait db redis server
      # The notes crate's markdown tests read the bundle the image ships.
      - run: pnpm --filter @capy-notebook/notes-markdown build
      - run: cargo test --manifest-path collaboration-rs/Cargo.toml --workspace -- --include-ignored --test-threads=1
      - if: always()
        run: docker compose -f deploy/docker-compose.e2e.yml -p collaboration-it down -v

  # The real-stack suite and the two editor shards run as parallel jobs.
  e2e_stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      # Build the stack's images from the GitHub Actions layer cache before
      # office:prepare writes WASM into vendor/betteroffice, so the
      # collaboration image's BetterOffice layer only rebuilds when the pin moves.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: collaboration-rs/Dockerfile
          tags: capy-e2e-collaboration:local
          load: true
          cache-from: type=gha,scope=e2e-collaboration
          cache-to: type=gha,mode=max,scope=e2e-collaboration
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          tags: capy-e2e-server:local
          load: true
          cache-from: type=gha,scope=e2e-server
          cache-to: type=gha,mode=max,scope=e2e-server
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm office:prepare
      - run: pnpm run e2e:install
      # The live note View spec reads in WebKit too (live-items REVIEW5 M1).
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm run e2e
        env:
          E2E_PREBUILT_IMAGES: "true"
      # Retain failed-attempt traces even when a retry makes the job succeed.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: playwright-artifacts-stack
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e_editor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Playwright starts Vite directly, so no pre-script builds the Office
      # stylesheet and WASM the editor suite's runtime iframe imports.
      - run: pnpm office:prepare
      - run: pnpm run e2e:install
      - run: pnpm run e2e:msw:editor --shard=${{ matrix.shard }}/2
      # Retain failed-attempt traces even when a retry makes the job succeed.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: playwright-artifacts-editor-${{ matrix.shard }}
          path: |
            e2e/editor/playwright-report-editor/
            e2e/editor/test-results/
          retention-days: 7

  backend_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
      # The harness owns one fresh pgvector container, migrations, fixtures,
      # serial package execution, and cleanup. Database tests fail rather than
      # skip if someone bypasses it.
      - run: go run ./cmd/testdb
        working-directory: server
      - run: go run ./cmd/openapi -o /tmp/openapi.yaml -python-slots /tmp/slot.py
        working-directory: server
      - run: diff -u openapi.yaml /tmp/openapi.yaml
      - run: diff -u pipeline/pipeline/generated/slot.py /tmp/slot.py

  pipeline_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra test
      - run: uv run --extra test pytest
      # The knowledge-base builder's tests, its security regressions included.
      - run: uv run --extra test pytest lab/knowledge/tests -q

  # Known vulnerabilities fail CI, one job per ecosystem. An advisory that has
  # to wait goes on that ecosystem's commented ignore list, with the reason:
  # collaboration-rs/deny.toml, server/govulncheck-ignore.txt and
  # pnpm-workspace.yaml's auditConfig.
  audit_rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
        working-directory: collaboration-rs

  audit_go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The Go line server/Dockerfile and ops/Dockerfile build with.
          go-version: "1.25"
          check-latest: true
      # Fails on a called vulnerability (one whose trace reaches a function)
      # that the ignore list does not name.
      - working-directory: server
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          jq -r 'select(.finding.trace[0].function) | .finding.osv' "$RUNNER_TEMP/govulncheck.json" | sort -u > "$RUNNER_TEMP/found"
          sed -n 's/^\(GO-[0-9]*-[0-9]*\).*/\1/p' govulncheck-ignore.txt | sort -u > "$RUNNER_TEMP/ignored"
          new=$(comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/ignored")
          for id in $new; do echo "::error::$id https://pkg.go.dev/vuln/$id"; done
          [ -z "$new" ]

  audit_pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm audit --prod
