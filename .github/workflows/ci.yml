name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git diff --exit-code -- src/api/gen ops/src/api-gen
      - run: pnpm run email:check
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm review:validate-boundaries
      - run: pnpm test
      - run: pnpm --filter @evo-notes/ops typecheck
      - run: pnpm --filter @evo-notes/ops test
      - run: pnpm run test:collaboration

  e2e_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:install
      - run: pnpm run e2e
      - run: pnpm run e2e:editor
      # Docker/Vite make these suites timing sensitive, and a failure that only
      # reproduces on the runner is undiagnosable without the traces.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            e2e/editor/playwright-report-editor/
            e2e/editor/test-results/
          retention-days: 7

  backend_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      # The harness owns one fresh pgvector container, migrations, fixtures,
      # serial package execution, and cleanup. Database tests fail rather than
      # skip if someone bypasses it.
      - run: go run ./cmd/testdb
        working-directory: server
      - run: go run ./cmd/openapi -o /tmp/openapi.yaml -python-slots /tmp/slot.py
        working-directory: server
      - run: diff -u openapi.yaml /tmp/openapi.yaml
      - run: diff -u pipeline/pipeline/generated/slot.py /tmp/slot.py

  pipeline_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra test
      - run: uv run --extra test pytest
