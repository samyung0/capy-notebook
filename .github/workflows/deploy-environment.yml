name: Reusable environment deployment

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment and deployment target
        required: true
        type: string
      revision:
        description: Full Git commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.revision }}
          submodules: recursive
      - name: Validate immutable deployment input
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          [[ "$TARGET_ENVIRONMENT" == "uat" || "$TARGET_ENVIRONMENT" == "production" ]] || {
            echo "Unsupported deployment environment: $TARGET_ENVIRONMENT" >&2
            exit 1
          }
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Deployment revision must be a full Git SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]] || {
            echo "Checked-out revision does not match deployment input" >&2
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Only the build's own values: the Coolify and ingest configuration is
      # rendered in the deploy job, so it never sits on disk while
      # third-party build code runs.
      - name: Render the build configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          # Exactly the secrets this render reads; test_config.py checks the list.
          CAPY_SECRET_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: python3 scripts/env/config.py render-build --environment "$TARGET_ENVIRONMENT" --revision "$DEPLOY_REVISION" --output "$RUNNER_TEMP/capy-config"
      # package.json's build gives the client vite build an 8 GB heap (its flag
      # overrides NODE_OPTIONS). Rollup's AST and scope graph for ~15k modules
      # holds ~2.9 GB live; hidden sourcemaps and the Sentry plugin lift the
      # post-GC peak to ~3.4 GB, so the old 4 GB cap ran out of memory on some
      # runs (measured 2026-10-11). Runners have 16 GB.
      - name: Build the SPA for the target environment
        run: python3 scripts/env/config.py build --file "$RUNNER_TEMP/capy-config/build.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capy-site-${{ inputs.environment_name }}-${{ inputs.revision }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - name: Render deployment configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          # Exactly the secrets this render reads; test_config.py checks the list.
          CAPY_SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPY_SECRET_B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          CAPY_SECRET_B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          CAPY_SECRET_BANK_DATABASE_URL: ${{ secrets.BANK_DATABASE_URL }}
          CAPY_SECRET_BANK_EDITOR_DATABASE_URL: ${{ secrets.BANK_EDITOR_DATABASE_URL }}
          CAPY_SECRET_BANK_PUBLIC_B2_APP_KEY: ${{ secrets.BANK_PUBLIC_B2_APP_KEY }}
          CAPY_SECRET_BANK_PUBLIC_B2_KEY_ID: ${{ secrets.BANK_PUBLIC_B2_KEY_ID }}
          CAPY_SECRET_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CAPY_SECRET_CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CAPY_SECRET_CLOUDFLARE_EMAIL_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}
          CAPY_SECRET_COLLABORATION_SECRET: ${{ secrets.COLLABORATION_SECRET }}
          CAPY_SECRET_DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CAPY_SECRET_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CAPY_SECRET_EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
          CAPY_SECRET_JEV_TYPESAFE_API_KEY: ${{ secrets.JEV_TYPESAFE_API_KEY }}
          CAPY_SECRET_KNOWLEDGE_BASE_B2_APP_KEY: ${{ secrets.KNOWLEDGE_BASE_B2_APP_KEY }}
          CAPY_SECRET_KNOWLEDGE_BASE_B2_KEY_ID: ${{ secrets.KNOWLEDGE_BASE_B2_KEY_ID }}
          CAPY_SECRET_LIBRARY_DATABASE_URL: ${{ secrets.LIBRARY_DATABASE_URL }}
          CAPY_SECRET_LLM_CREDENTIALS_KEY: ${{ secrets.LLM_CREDENTIALS_KEY }}
          CAPY_SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPY_SECRET_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CAPY_SECRET_PARSER_TOKEN: ${{ secrets.PARSER_TOKEN }}
          CAPY_SECRET_PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CAPY_SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CAPY_SECRET_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CAPY_SECRET_SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
          CAPY_SECRET_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CAPY_SECRET_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: python3 scripts/env/config.py render --environment "$TARGET_ENVIRONMENT" --revision "$DEPLOY_REVISION" --output "$RUNNER_TEMP/capy-config"
      - name: Synchronize and verify Coolify configuration
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
        run: python3 scripts/env/config.py apply-coolify --file "$RUNNER_TEMP/capy-config/coolify.json"
      - name: Deploy the pinned backend revision through Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: scripts/deploy/coolify-deploy.sh
      - name: Remove runner configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config"

  site:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capy-site-${{ inputs.environment_name }}-${{ inputs.revision }}
          path: dist/
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # wrangler bundles workers/site from source, so this job needs the Worker's
      # own dependencies and the gitignored Paraglide output that otherwise only
      # the SPA build generates. Keep the options in step with vite.config.ts.
      - name: Compile the Paraglide messages the Worker imports
        run: >-
          pnpm exec paraglide-js compile
          --project ./project.inlang
          --outdir ./src/i18n/paraglide
          --strategy localStorage preferredLanguage baseLocale
      - name: Stage the isolated Office runtime
        run: node workers/office/stage.mjs dist "$RUNNER_TEMP/capy-office-assets"
      - name: Deploy the matching Office Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PARENT_ORIGINS: ${{ vars.OFFICE_ALLOWED_PARENT_ORIGINS }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: >-
          npx --yes wrangler@4.149.0 deploy
          --config wrangler.office.jsonc
          --env "$TARGET_ENVIRONMENT"
          --assets "$RUNNER_TEMP/capy-office-assets"
          --var "PARENT_ORIGINS:$PARENT_ORIGINS"
      # UAT only: the journey inbox Email Routing hands inbox.uat mail to. Its
      # READ_TOKEN secret persists across deploys (deployment-runbook §12.5).
      - name: Deploy the UAT journey inbox
        if: inputs.environment_name == 'uat'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.uat-inbox.jsonc
      # embed/ is the interactive block frame the SPA build points at
      # (VITE_EMBED_ORIGIN). One Pages project serves both environments: its
      # production branch is `production`, and UAT is the `uat` branch alias.
      - name: Deploy the matching interactive block frame
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          EMBED_PAGES_PROJECT: ${{ vars.EMBED_PAGES_PROJECT }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          [ -n "$EMBED_PAGES_PROJECT" ] || { echo "EMBED_PAGES_PROJECT is required" >&2; exit 1; }
          npx --yes wrangler@4.149.0 pages deploy embed \
            --project-name "$EMBED_PAGES_PROJECT" \
            --branch "$TARGET_ENVIRONMENT" \
            --commit-hash "$DEPLOY_REVISION"
      # Before either app host Worker publishes, so a bad secret leaves both on
      # the previous release.
      - name: Check the SPA Worker's secrets
        env:
          SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
        run: |
          [ "${#SHARE_LINK_SECRET}" -ge 32 ] || { echo "SHARE_LINK_SECRET must be at least 32 characters" >&2; exit 1; }
      # The app hosts' /assets/* route (wrangler.assets.jsonc) publishes before
      # the SPA Worker, so the new index.html never names a chunk the edge
      # cannot serve; a name it has no file for gets 404 no-store.
      - name: Stage the SPA's hashed assets
        run: mkdir "$RUNNER_TEMP/capy-app-assets" && cp -R dist/assets dist/_headers "$RUNNER_TEMP/capy-app-assets/"
      - name: Deploy the matching SPA assets Worker
        id: assets_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: >-
          npx --yes wrangler@4.149.0 deploy
          --config wrangler.assets.jsonc
          --env "$TARGET_ENVIRONMENT"
          --assets "$RUNNER_TEMP/capy-app-assets"
      - name: Deploy the matching SPA Worker
        id: app_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_ORIGIN: ${{ vars.DEPLOYMENT_API_URL }}
          APP_ORIGIN: ${{ vars.DEPLOYMENT_APP_URL }}
          SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        # The same GitHub secret reaches Go through Coolify, so signed /w/ links
        # verify on both sides; the secrets file lives only in the runner temp.
        run: |
          secrets_file="$RUNNER_TEMP/site-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          (umask 077; jq -n --arg value "$SHARE_LINK_SECRET" '{SHARE_LINK_SECRET: $value}' > "$secrets_file")
          npx --yes wrangler@4.149.0 deploy \
            --env "$TARGET_ENVIRONMENT" \
            --var "API_ORIGIN:$API_ORIGIN" \
            --var "APP_ORIGIN:$APP_ORIGIN" \
            --secrets-file "$secrets_file"
      # The old index.html, still served, names chunks only the previous assets
      # Worker has: put it back so the two Workers stay on one release. A step
      # that failed after its new version went live (a later part, such as
      # its routes) is left to the manual rollback of both Workers
      # (human/deployment-runbook.md, 2026-10-17): the check rolls back only
      # when every successful read of /release.txt shows the old revision, and
      # a failed assets step never gets here.
      - name: Roll the SPA assets Worker back after a failed SPA Worker deploy
        if: failure() && steps.assets_worker.outcome == 'success' && steps.app_worker.outcome == 'failure'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          scripts/deploy/assets-rollback-check.sh
          npx --yes wrangler@4.149.0 rollback \
            --config wrangler.assets.jsonc \
            --env "$TARGET_ENVIRONMENT" \
            --message "SPA Worker deploy of $DEPLOY_REVISION failed" \
            --yes
      - name: Verify the public deployment revision
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          DEPLOYMENT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL }}
          DEPLOYMENT_COLLAB_URL: ${{ vars.DEPLOYMENT_COLLAB_URL }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: scripts/deploy/verify-release.sh
