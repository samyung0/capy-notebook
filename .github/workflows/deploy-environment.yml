name: Reusable environment deployment

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment and deployment target
        required: true
        type: string
      revision:
        description: Full Git commit SHA to deploy
        required: true
        type: string
      bootstrap_ingest:
        description: Explicit first-time initialization of this environment's ingest stack
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision }}
          submodules: recursive
      - name: Validate immutable deployment input
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          [[ "$TARGET_ENVIRONMENT" == "uat" || "$TARGET_ENVIRONMENT" == "production" ]] || {
            echo "Unsupported deployment environment: $TARGET_ENVIRONMENT" >&2
            exit 1
          }
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Deployment revision must be a full Git SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]] || {
            echo "Checked-out revision does not match deployment input" >&2
            exit 1
          }
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Render deployment configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          CAPY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/env/config.py render --environment '${{ inputs.environment_name }}' --revision '${{ inputs.revision }}' --output "$RUNNER_TEMP/capy-config"
      - name: Build the SPA for the target environment
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: python3 scripts/env/config.py build --file "$RUNNER_TEMP/capy-config/build.json"
      - uses: actions/upload-artifact@v4
        with:
          name: capy-site-${{ inputs.environment_name }}-${{ inputs.revision }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config"

  ingest_prepare:
    needs: build
    uses: ./.github/workflows/deploy-ingest.yml
    with:
      environment_name: ${{ inputs.environment_name }}
      revision: ${{ inputs.revision }}
      phase: ${{ inputs.bootstrap_ingest && 'bootstrap-prepare' || 'prepare' }}

  deploy:
    outputs:
      coolify_deployment_uuid: ${{ steps.coolify.outputs.deployment_uuid }}
      coolify_outcome: ${{ steps.coolify.outcome }}
    needs: ingest_prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
      - name: Render deployment configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          CAPY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/env/config.py render --environment '${{ inputs.environment_name }}' --revision '${{ inputs.revision }}' --output "$RUNNER_TEMP/capy-config"
      - name: Synchronize and verify Coolify configuration
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
        run: python3 scripts/env/config.py apply-coolify --file "$RUNNER_TEMP/capy-config/coolify.json"
      - name: Deploy the pinned backend revision through Coolify
        id: coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: scripts/deploy/coolify-deploy.sh
      - name: Remove runner configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config"

  ingest_activate:
    needs: deploy
    uses: ./.github/workflows/deploy-ingest.yml
    with:
      environment_name: ${{ inputs.environment_name }}
      revision: ${{ inputs.revision }}
      phase: activate

  site:
    needs: [deploy, ingest_activate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          name: capy-site-${{ inputs.environment_name }}-${{ inputs.revision }}
          path: dist/
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Stage the isolated Office runtime
        run: node workers/office/stage.mjs dist "$RUNNER_TEMP/capy-office-assets"
      - name: Deploy the matching Office Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PARENT_ORIGINS: ${{ vars.OFFICE_ALLOWED_PARENT_ORIGINS }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: >-
          npx --yes wrangler@4.125.0 deploy
          --config wrangler.office.jsonc
          --env "$TARGET_ENVIRONMENT"
          --assets "$RUNNER_TEMP/capy-office-assets"
          --var "PARENT_ORIGINS:$PARENT_ORIGINS"
      - name: Deploy the matching SPA Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_ORIGIN: ${{ vars.DEPLOYMENT_API_URL }}
          APP_ORIGIN: ${{ vars.DEPLOYMENT_APP_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: >-
          npx --yes wrangler@4.125.0 deploy
          --env "$TARGET_ENVIRONMENT"
          --var "API_ORIGIN:$API_ORIGIN"
          --var "APP_ORIGIN:$APP_ORIGIN"
      - name: Verify the public deployment revision
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          DEPLOYMENT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL }}
          DEPLOYMENT_COLLAB_URL: ${{ vars.DEPLOYMENT_COLLAB_URL }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: scripts/deploy/verify-release.sh

  ingest_recover:
    if: always() && needs.ingest_prepare.result != 'skipped' && (needs.ingest_prepare.result != 'success' || needs.deploy.result != 'success' || needs.ingest_activate.result != 'success')
    needs: [ingest_prepare, deploy, ingest_activate]
    uses: ./.github/workflows/deploy-ingest.yml
    with:
      environment_name: ${{ inputs.environment_name }}
      revision: ${{ inputs.revision }}
      phase: ${{ needs.deploy.result == 'skipped' && 'rollback-if-pending' || 'recover' }}
      coolify_deployment_uuid: ${{ needs.deploy.outputs.coolify_deployment_uuid }}
      coolify_outcome: ${{ needs.deploy.outputs.coolify_outcome }}
