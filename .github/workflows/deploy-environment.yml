name: Reusable environment deployment

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment and deployment target
        required: true
        type: string
      revision:
        description: Full Git commit SHA to deploy
        required: true
        type: string
      image_digests:
        description: The CAPY_*_IMAGE=<image>@<digest> lines a UAT run deployed; a promotion runs exactly those
        required: false
        type: string
        default: ""
    outputs:
      image_digests:
        description: The CAPY_*_IMAGE=<image>@<digest> lines this run deployed
        value: ${{ jobs.deploy.outputs.image_digests }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.revision }}
          submodules: recursive
      - name: Validate immutable deployment input
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          [[ "$TARGET_ENVIRONMENT" == "uat" || "$TARGET_ENVIRONMENT" == "production" ]] || {
            echo "Unsupported deployment environment: $TARGET_ENVIRONMENT" >&2
            exit 1
          }
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Deployment revision must be a full Git SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]] || {
            echo "Checked-out revision does not match deployment input" >&2
            exit 1
          }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Only the build's own values: the app host and ingest configuration is
      # rendered in the deploy job, so it never sits on disk while
      # third-party build code runs.
      - name: Render the build configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          # Exactly the secrets this render reads; test_config.py checks the list.
          CAPY_SECRET_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: python3 scripts/env/config.py render-build --environment "$TARGET_ENVIRONMENT" --revision "$DEPLOY_REVISION" --output "$RUNNER_TEMP/capy-config"
      # package.json's build gives the client vite build an 8 GB heap (its flag
      # overrides NODE_OPTIONS). Rollup's AST and scope graph for ~15k modules
      # holds ~2.9 GB live; hidden sourcemaps and the Sentry plugin lift the
      # post-GC peak to ~3.4 GB, so the old 4 GB cap ran out of memory on some
      # runs (measured 2026-10-11). Runners have 16 GB.
      - name: Build the SPA for the target environment
        run: python3 scripts/env/config.py build --file "$RUNNER_TEMP/capy-config/build.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capy-site-${{ inputs.environment_name }}-${{ inputs.revision }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config"

  # The backend images, built once per revision and pushed to GHCR as private
  # packages tagged with the full SHA: a production promotion finds the tags
  # UAT ran and builds nothing. No environment and no secrets; the job's own
  # token pushes. The only layer cache is this registry cache, which only
  # deploy jobs write; CI's Actions cache scopes are never read, since jobs
  # running third-party install and build code also write them (Epo 2026-10-23).
  # Each image is labelled with the hash of the compose file of its revision
  # (the host runs only that file, checking capy-server's label) and recorded
  # by digest, which the host runs.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: capy-server
            variable: CAPY_SERVER_IMAGE
            context: server
            file: server/Dockerfile
          - image: capy-collaboration
            variable: CAPY_COLLABORATION_IMAGE
            context: .
            file: collaboration-rs/Dockerfile
          - image: capy-pipeline
            variable: CAPY_PIPELINE_IMAGE
            context: .
            file: pipeline/Dockerfile
            build-args: RELEASE_SHA=${{ inputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
          submodules: recursive
      - name: Validate immutable deployment input
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Deployment revision must be a lowercase full Git SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]] || {
            echo "Checked-out revision does not match deployment input" >&2
            exit 1
          }
      - name: Log in to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Skip an image this revision already has
        id: existing
        env:
          IMAGE: ghcr.io/samyung0/${{ matrix.image }}:${{ inputs.revision }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already exists; not rebuilding it."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hash the compose file the host will run
        id: compose
        run: |
          read -r sha256 _ < <(sha256sum deploy/docker-compose.prod.yml)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.existing.outputs.found != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/samyung0/${{ matrix.image }}:${{ inputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=https://github.com/samyung0/capy-notebook
            org.capynotebook.compose.sha256=${{ steps.compose.outputs.sha256 }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=registry,ref=ghcr.io/samyung0/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/samyung0/${{ matrix.image }}:buildcache,mode=max
      # The digest just pushed, or the one the revision's tag already names.
      - name: Record the image digest
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/samyung0/${{ matrix.image }}
          REVISION: ${{ inputs.revision }}
          VARIABLE: ${{ matrix.variable }}
        run: |
          digest="${BUILT:-$(docker buildx imagetools inspect "$IMAGE:$REVISION" --format '{{json .Manifest}}' | jq -r .digest)}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for $IMAGE:$REVISION" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/image-digest"
          printf '%s=%s@%s\n' "$VARIABLE" "$IMAGE" "$digest" > "$RUNNER_TEMP/image-digest/$VARIABLE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capy-image-digest-${{ inputs.environment_name }}-${{ inputs.revision }}-${{ matrix.image }}
          path: ${{ runner.temp }}/image-digest/${{ matrix.variable }}
          retention-days: 1
          if-no-files-found: error
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Runs the images on the app host: the rendered app.env and the compose file
  # go over SSH, through a Cloudflare Access tunnel, to the host's forced
  # deploy command (scripts/deploy/app-host-deploy.sh). The job token, which
  # the host uses once to pull, can only read packages. The images run by the
  # digests the images job recorded, or for a promotion by those UAT ran.
  deploy:
    needs: [build, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    outputs:
      image_digests: ${{ steps.images.outputs.lines }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - if: inputs.image_digests == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: capy-image-digest-${{ inputs.environment_name }}-${{ inputs.revision }}-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true
      - name: Collect the image digests
        id: images
        env:
          IMAGE_DIGESTS: ${{ inputs.image_digests }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          [[ "$TARGET_ENVIRONMENT" != production || -n "$IMAGE_DIGESTS" ]] || {
            echo "Production runs only the image digests a UAT run of this revision deployed." >&2
            exit 1
          }
          if [[ -n "$IMAGE_DIGESTS" ]]; then
            printf '%s\n' "$IMAGE_DIGESTS" > "$RUNNER_TEMP/capy-images"
          else
            cat "$RUNNER_TEMP"/image-digests/CAPY_*_IMAGE > "$RUNNER_TEMP/capy-images"
          fi
          delimiter="capy-$(openssl rand -hex 16)"
          { echo "lines<<$delimiter"; cat "$RUNNER_TEMP/capy-images"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: Render deployment configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          # Exactly the secrets this render reads; test_config.py checks the list.
          CAPY_SECRET_ALIBABA_MODELSTUDIO_KEY: ${{ secrets.ALIBABA_MODELSTUDIO_KEY }}
          CAPY_SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPY_SECRET_B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          CAPY_SECRET_B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          CAPY_SECRET_BANK_DATABASE_URL: ${{ secrets.BANK_DATABASE_URL }}
          CAPY_SECRET_BANK_EDITOR_DATABASE_URL: ${{ secrets.BANK_EDITOR_DATABASE_URL }}
          CAPY_SECRET_BANK_PUBLIC_B2_APP_KEY: ${{ secrets.BANK_PUBLIC_B2_APP_KEY }}
          CAPY_SECRET_BANK_PUBLIC_B2_KEY_ID: ${{ secrets.BANK_PUBLIC_B2_KEY_ID }}
          CAPY_SECRET_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CAPY_SECRET_CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CAPY_SECRET_CLOUDFLARE_EMAIL_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}
          CAPY_SECRET_COLLABORATION_SECRET: ${{ secrets.COLLABORATION_SECRET }}
          CAPY_SECRET_DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CAPY_SECRET_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CAPY_SECRET_EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
          CAPY_SECRET_JEV_TYPESAFE_API_KEY: ${{ secrets.JEV_TYPESAFE_API_KEY }}
          CAPY_SECRET_KNOWLEDGE_BASE_B2_APP_KEY: ${{ secrets.KNOWLEDGE_BASE_B2_APP_KEY }}
          CAPY_SECRET_KNOWLEDGE_BASE_B2_KEY_ID: ${{ secrets.KNOWLEDGE_BASE_B2_KEY_ID }}
          CAPY_SECRET_LIBRARY_DATABASE_URL: ${{ secrets.LIBRARY_DATABASE_URL }}
          CAPY_SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPY_SECRET_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CAPY_SECRET_PARSER_TOKEN: ${{ secrets.PARSER_TOKEN }}
          CAPY_SECRET_PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CAPY_SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CAPY_SECRET_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CAPY_SECRET_SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
          CAPY_SECRET_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CAPY_SECRET_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CAPY_SECRET_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: python3 scripts/env/config.py render --environment "$TARGET_ENVIRONMENT" --revision "$DEPLOY_REVISION" --output "$RUNNER_TEMP/capy-config"
      - name: Configure SSH through Access
        env:
          APP_HOST_SSH_HOSTNAME: ${{ vars.APP_HOST_SSH_HOSTNAME }}
          APP_HOST_KNOWN_HOSTS: ${{ secrets.APP_HOST_KNOWN_HOSTS }}
          APP_HOST_SSH_PRIVATE_KEY: ${{ secrets.APP_HOST_SSH_PRIVATE_KEY }}
        run: scripts/deploy/app-host-release.sh configure
      - name: Deploy the pinned backend revision
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          GHCR_TOKEN: ${{ github.token }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.APP_HOST_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.APP_HOST_ACCESS_CLIENT_SECRET }}
        run: scripts/deploy/app-host-release.sh deploy app deploy/docker-compose.prod.yml "$RUNNER_TEMP/capy-config/app.env" "$RUNNER_TEMP/capy-images"
      - name: Remove runner configuration and SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config" "$RUNNER_TEMP/capy-ssh"

  site:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: capy-site-${{ inputs.environment_name }}-${{ inputs.revision }}
          path: dist/
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # wrangler bundles workers/site from source, so this job needs the Worker's
      # own dependencies and the gitignored Paraglide output that otherwise only
      # the SPA build generates. Keep the options in step with vite.config.ts.
      - name: Compile the Paraglide messages the Worker imports
        run: >-
          pnpm exec paraglide-js compile
          --project ./project.inlang
          --outdir ./src/i18n/paraglide
          --strategy localStorage preferredLanguage baseLocale
      - name: Stage the isolated Office runtime
        run: node workers/office/stage.mjs dist "$RUNNER_TEMP/capy-office-assets"
      - name: Deploy the matching Office Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PARENT_ORIGINS: ${{ vars.OFFICE_ALLOWED_PARENT_ORIGINS }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: >-
          npx --yes wrangler@4.149.0 deploy
          --config wrangler.office.jsonc
          --env "$TARGET_ENVIRONMENT"
          --assets "$RUNNER_TEMP/capy-office-assets"
          --var "PARENT_ORIGINS:$PARENT_ORIGINS"
      # UAT only: the journey inbox Email Routing hands inbox.uat mail to. Its
      # READ_TOKEN secret persists across deploys (deployment-runbook §12.5).
      - name: Deploy the UAT journey inbox
        if: inputs.environment_name == 'uat'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.uat-inbox.jsonc
      # embed/ is the interactive block frame the SPA build points at
      # (VITE_EMBED_ORIGIN). One Pages project serves both environments: its
      # production branch is `production`, and UAT is the `uat` branch alias.
      - name: Deploy the matching interactive block frame
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          EMBED_PAGES_PROJECT: ${{ vars.EMBED_PAGES_PROJECT }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          [ -n "$EMBED_PAGES_PROJECT" ] || { echo "EMBED_PAGES_PROJECT is required" >&2; exit 1; }
          npx --yes wrangler@4.149.0 pages deploy embed \
            --project-name "$EMBED_PAGES_PROJECT" \
            --branch "$TARGET_ENVIRONMENT" \
            --commit-hash "$DEPLOY_REVISION"
      # Before either app host Worker publishes, so a bad secret leaves both on
      # the previous release.
      - name: Check the SPA Worker's secrets
        env:
          SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
        run: |
          [ "${#SHARE_LINK_SECRET}" -ge 32 ] || { echo "SHARE_LINK_SECRET must be at least 32 characters" >&2; exit 1; }
      # The app hosts' /assets/* route (wrangler.assets.jsonc) publishes before
      # the SPA Worker, so the new index.html never names a chunk the edge
      # cannot serve; a name it has no file for gets 404 no-store.
      - name: Stage the SPA's hashed assets
        run: mkdir "$RUNNER_TEMP/capy-app-assets" && cp -R dist/assets dist/_headers "$RUNNER_TEMP/capy-app-assets/"
      - name: Deploy the matching SPA assets Worker
        id: assets_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: >-
          npx --yes wrangler@4.149.0 deploy
          --config wrangler.assets.jsonc
          --env "$TARGET_ENVIRONMENT"
          --assets "$RUNNER_TEMP/capy-app-assets"
      - name: Deploy the matching SPA Worker
        id: app_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_ORIGIN: ${{ vars.DEPLOYMENT_API_URL }}
          APP_ORIGIN: ${{ vars.DEPLOYMENT_APP_URL }}
          SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        # The same GitHub secret reaches Go through app.env, so signed /w/ links
        # verify on both sides; the secrets file lives only in the runner temp.
        run: |
          secrets_file="$RUNNER_TEMP/site-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          (umask 077; jq -n --arg value "$SHARE_LINK_SECRET" '{SHARE_LINK_SECRET: $value}' > "$secrets_file")
          npx --yes wrangler@4.149.0 deploy \
            --env "$TARGET_ENVIRONMENT" \
            --var "API_ORIGIN:$API_ORIGIN" \
            --var "APP_ORIGIN:$APP_ORIGIN" \
            --secrets-file "$secrets_file"
      # The old index.html, still served, names chunks only the previous assets
      # Worker has: put it back so the two Workers stay on one release. A step
      # that failed after its new version went live (a later part, such as
      # its routes) is left to the manual rollback of both Workers
      # (human/deployment-runbook.md, 2026-10-17): the check rolls back only
      # when every successful read of /release.txt shows the old revision, and
      # a failed assets step never gets here.
      - name: Roll the SPA assets Worker back after a failed SPA Worker deploy
        if: failure() && steps.assets_worker.outcome == 'success' && steps.app_worker.outcome == 'failure'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          scripts/deploy/assets-rollback-check.sh
          npx --yes wrangler@4.149.0 rollback \
            --config wrangler.assets.jsonc \
            --env "$TARGET_ENVIRONMENT" \
            --message "SPA Worker deploy of $DEPLOY_REVISION failed" \
            --yes
      - name: Verify the public deployment revision
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          DEPLOYMENT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL }}
          DEPLOYMENT_COLLAB_URL: ${{ vars.DEPLOYMENT_COLLAB_URL }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: scripts/deploy/verify-release.sh
