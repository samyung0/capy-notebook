name: Deploy ingest

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Environment whose backend already serves this revision
        required: true
        type: choice
        options: [uat, production]
      revision:
        description: Full SHA; blank uses whatever the backend already serves
        required: false
        type: string
      bootstrap:
        description: Init ingest stack (once only)
        required: false
        default: false
        type: boolean
      reclaim_pending:
        description: Cleanup previous pending release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Sharing the app deployments' group keeps ingest off the host while a backend
# release is migrating, and means a pending release owner is always a finished
# run, which is what makes reclaim safe.
concurrency:
  group: uat-promotion-flow
  cancel-in-progress: false

jobs:
  # The ingest stack shares the backend's database and calls its gateway, so the
  # revision that matters is the one the backend serves, not the head of main.
  # The backend reports it, so an operator only names a revision to override.
  resolve_revision:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve the revision the backend already serves
        id: resolve
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REQUESTED_REVISION" ]]; then
            revision="$REQUESTED_REVISION"
          else
            revision="$(python3 scripts/deploy/verify-backend.py --print)"
          fi
          [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Could not determine a full Git SHA for the ingest release." >&2
            exit 1
          }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  ingest:
    needs: resolve_revision
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_revision.outputs.revision }}
          fetch-depth: 0
      - name: Validate target and immutable revision
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_REVISION: ${{ needs.resolve_revision.outputs.revision }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$TARGET_ENVIRONMENT" == uat || "$TARGET_ENVIRONMENT" == production ]]
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]]
          git merge-base --is-ancestor "$DEPLOY_REVISION" origin/main
      - name: Load release scripts from the workflow revision
        run: |
          # Recovery fixes must work even while the backend serves an older SHA.
          # Keep application/config sources at DEPLOY_REVISION and pin these two
          # orchestration scripts to the immutable commit that started this run.
          mkdir -p "$RUNNER_TEMP/capy-release-tools"
          for script in ingest-host-release.sh ingest-host-remote-release.sh; do
            git show "$GITHUB_SHA:scripts/deploy/$script" > "$RUNNER_TEMP/capy-release-tools/$script"
            chmod 700 "$RUNNER_TEMP/capy-release-tools/$script"
          done
      - name: Verify the deployment matches the running backend
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          EXPECTED_REVISION: ${{ needs.resolve_revision.outputs.revision }}
        run: python3 scripts/deploy/verify-backend.py
      - name: Render environment configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          CAPY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/env/config.py render --environment '${{ inputs.environment_name }}' --revision '${{ needs.resolve_revision.outputs.revision }}' --output "$RUNNER_TEMP/capy-config"
      - name: Configure SSH access
        env:
          INGEST_HOST_KNOWN_HOSTS: ${{ secrets.INGEST_HOST_KNOWN_HOSTS }}
          INGEST_HOST_SSH_PRIVATE_KEY: ${{ secrets.INGEST_HOST_SSH_PRIVATE_KEY }}
        run: |
          [[ -n "$INGEST_HOST_KNOWN_HOSTS" && -n "$INGEST_HOST_SSH_PRIVATE_KEY" ]]
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$INGEST_HOST_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$INGEST_HOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
      - name: Release the ingest stack
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_REVISION: ${{ needs.resolve_revision.outputs.revision }}
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          RECLAIM_PENDING: ${{ inputs.reclaim_pending }}
          CAPY_INGEST_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          CAPY_RELEASE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
          CAPY_CONFIG_DIR: ${{ runner.temp }}/capy-config
          CAPY_RELEASE_SCRIPT: ${{ runner.temp }}/capy-release-tools/ingest-host-release.sh
          INGEST_HOST: ${{ vars.INGEST_HOST }}
          INGEST_HOST_USER: ${{ vars.INGEST_HOST_USER }}
          INGEST_HOST_SSH_PORT: ${{ vars.INGEST_HOST_SSH_PORT }}
        run: |
          # Prepare and activate run under one owner here, so the trap settles
          # any pending release this run created before the job ends.
          recover() {
            CAPY_BACKEND_REVISION="$(python3 scripts/deploy/verify-backend.py --print)" || return 1
            export CAPY_BACKEND_REVISION
            "$CAPY_RELEASE_SCRIPT" recover
          }
          # A run killed before its trap leaves pending behind; reclaim adopts it.
          # The host decides what that pending release permits; a bootstrap needs
          # no backend revision.
          if [[ "$RECLAIM_PENDING" == true ]]; then
            CAPY_BACKEND_REVISION="$(python3 scripts/deploy/verify-backend.py --print)" || CAPY_BACKEND_REVISION=""
            export CAPY_BACKEND_REVISION
            "$CAPY_RELEASE_SCRIPT" reclaim
          fi
          trap recover EXIT
          if [[ "$BOOTSTRAP" == true ]]; then
            "$CAPY_RELEASE_SCRIPT" bootstrap-prepare
          else
            "$CAPY_RELEASE_SCRIPT" prepare
          fi
          "$CAPY_RELEASE_SCRIPT" activate
      - name: Remove runner configuration and SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-config" "$HOME/.ssh/id_ed25519"
