name: Deploy Ops
run-name: Deploy Ops ${{ inputs.environment_name }} ${{ inputs.revision || 'from backend' }}

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Ops environment to deploy
        required: true
        type: choice
        options: [uat, production]
      revision:
        description: Full SHA; blank uses whatever the backend already serves
        required: false
        type: string

permissions:
  actions: read
  contents: read

# Share the app promotion lock so Ops cannot restart during schema migrations.
concurrency:
  group: uat-promotion-flow
  cancel-in-progress: false

jobs:
  # Ops reads the same database the backend migrates, so the revision that
  # matters is the one the backend serves rather than the head of main. The
  # backend reports it; an operator names a revision only to override. Every
  # check on the revision runs here, before its image builds.
  resolve_revision:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Resolve the revision the backend already serves
        id: resolve
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REQUESTED_REVISION" ]]; then
            revision="$REQUESTED_REVISION"
          else
            revision="$(python3 scripts/deploy/verify-backend.py --print)"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Could not determine a lowercase full Git SHA for the Ops release." >&2
            exit 1
          }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Run Deploy Ops from main." >&2; exit 1; }
          git cat-file -e "${revision}^{commit}"
          git merge-base --is-ancestor "$revision" origin/main || {
            echo "Revision is not reachable from origin/main." >&2
            exit 1
          }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Require prior Ops UAT deployment
        if: inputs.environment_name == 'production'
        env:
          DEPLOY_REVISION: ${{ steps.resolve.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-ops.yml/runs?status=success&event=workflow_dispatch&per_page=100" \
            --jq ".workflow_runs | any(.head_branch == \"main\" and .display_title == \"Deploy Ops uat $DEPLOY_REVISION\")" \
            | grep -qx true || {
              echo "Deploy this Ops revision to UAT successfully first, naming it explicitly:" >&2
              echo "a UAT run left with a blank revision does not record which SHA it deployed." >&2
              exit 1
            }

  # The Ops image per environment (capy-ops:<sha>-<environment>): its build
  # arguments are the environment's public variables, never secrets. It builds
  # on every run, since those variables can change between runs of one SHA.
  # Labelled with the Ops compose file's hash, which the host checks, and
  # deployed by the digest pushed here.
  image:
    needs: resolve_revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: ${{ inputs.environment_name }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      DEPLOY_REVISION: ${{ needs.resolve_revision.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_revision.outputs.revision }}
      - name: Validate the revision and the build values
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]]
          [[ -n "$CLERK_PUBLISHABLE_KEY" ]] || { echo "CLERK_PUBLISHABLE_KEY is required" >&2; exit 1; }
      - name: Log in to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Hash the compose file the host will run
        id: compose
        run: |
          read -r sha256 _ < <(sha256sum deploy/docker-compose.ops.yml)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/samyung0/capy-ops:${{ needs.resolve_revision.outputs.revision }}-${{ inputs.environment_name }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve_revision.outputs.revision }}
            org.opencontainers.image.source=https://github.com/samyung0/capy-notebook
            org.capynotebook.compose.sha256=${{ steps.compose.outputs.sha256 }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN_OPS }}
            VITE_APP_ENV=${{ inputs.environment_name }}
            VITE_RELEASE_SHA=${{ needs.resolve_revision.outputs.revision }}
          cache-from: type=registry,ref=ghcr.io/samyung0/capy-ops:buildcache
          cache-to: type=registry,ref=ghcr.io/samyung0/capy-ops:buildcache,mode=max
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # The same deploy command as the main stack, as Compose project capy-ops.
  deploy:
    needs: [resolve_revision, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_OPS_URL }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment_name }}
      DEPLOY_REVISION: ${{ needs.resolve_revision.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_revision.outputs.revision }}
      - name: Validate the revision and name the image by its digest
        env:
          OPS_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          [[ "$TARGET_ENVIRONMENT" == uat || "$TARGET_ENVIRONMENT" == production ]]
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]]
          printf 'CAPY_OPS_IMAGE=ghcr.io/samyung0/capy-ops@%s\n' "$OPS_DIGEST" > "$RUNNER_TEMP/capy-images"
      - name: Render Ops configuration from GitHub
        env:
          CAPY_GITHUB_VARS: ${{ toJSON(vars) }}
          # Exactly the secrets this render reads; test_config.py checks the list.
          CAPY_SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPY_SECRET_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CAPY_SECRET_DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CAPY_SECRET_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CAPY_SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPY_SECRET_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CAPY_SECRET_OPS_ADMIN_DATABASE_URL: ${{ secrets.OPS_ADMIN_DATABASE_URL }}
          CAPY_SECRET_OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
          CAPY_SECRET_OPS_INGEST_LOCAL_DATABASE_URL: ${{ secrets.OPS_INGEST_LOCAL_DATABASE_URL }}
          CAPY_SECRET_OPS_INGEST_UAT_DATABASE_URL: ${{ secrets.OPS_INGEST_UAT_DATABASE_URL }}
          CAPY_SECRET_OPS_LIBRARY_DATABASE_URL: ${{ secrets.OPS_LIBRARY_DATABASE_URL }}
        run: python3 scripts/env/config.py render-ops --environment "$TARGET_ENVIRONMENT" --revision "$DEPLOY_REVISION" --output "$RUNNER_TEMP/capy-ops-config"
      - name: Configure SSH through Access
        env:
          APP_HOST_SSH_HOSTNAME: ${{ vars.APP_HOST_SSH_HOSTNAME }}
          APP_HOST_KNOWN_HOSTS: ${{ secrets.APP_HOST_KNOWN_HOSTS }}
          APP_HOST_SSH_PRIVATE_KEY: ${{ secrets.APP_HOST_SSH_PRIVATE_KEY }}
        run: scripts/deploy/app-host-release.sh configure
      - name: Deploy only the pinned Ops revision
        env:
          GHCR_TOKEN: ${{ github.token }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.APP_HOST_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.APP_HOST_ACCESS_CLIENT_SECRET }}
        run: scripts/deploy/app-host-release.sh deploy ops deploy/docker-compose.ops.yml "$RUNNER_TEMP/capy-ops-config/ops.env" "$RUNNER_TEMP/capy-images"
      - name: Remove runner configuration and SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/capy-ops-config" "$RUNNER_TEMP/capy-ssh"
      # Only UAT holds an Access service token, so production stops at the deploy.
      - name: Probe the Ops edge
        if: inputs.environment_name == 'uat'
        env:
          UAT_ALLOWED_HOSTS: ${{ vars.UAT_ALLOWED_HOSTS }}
          UAT_TARGET_AUTHORIZED: ${{ vars.UAT_TARGET_AUTHORIZED }}
          DEPLOYMENT_OPS_URL: ${{ vars.DEPLOYMENT_OPS_URL }}
          OPS_CF_ACCESS_ISSUER: ${{ vars.OPS_CF_ACCESS_ISSUER }}
          UAT_OPS_ACCESS_CLIENT_ID: ${{ secrets.UAT_OPS_ACCESS_CLIENT_ID }}
          UAT_OPS_ACCESS_CLIENT_SECRET: ${{ secrets.UAT_OPS_ACCESS_CLIENT_SECRET }}
        run: scripts/review/ops-smoke.sh
