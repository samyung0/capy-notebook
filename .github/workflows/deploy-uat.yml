name: Deploy UAT
run-name: Deploy UAT ${{ inputs.revision || github.sha }}

# Manual only: the UAT deploy plus its deterministic gate is heavy, so a person
# picks the revision instead of every green CI run staging itself.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full main-branch SHA; blank deploys the selected main revision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: uat-promotion-flow
  cancel-in-progress: false

jobs:
  resolve_revision:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Resolve and validate the UAT revision
        id: revision
        env:
          CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this deployment workflow from main." >&2
            exit 1
          fi
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Revision must be a full Git SHA." >&2
            exit 1
          }
          git cat-file -e "${CANDIDATE_REVISION}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_REVISION" origin/main || {
            echo "Revision is not reachable from origin/main." >&2
            exit 1
          }
          echo "revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"

  # A called workflow cannot raise the token scope: its images job pushes to GHCR.
  deploy:
    needs: resolve_revision
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: uat
      revision: ${{ needs.resolve_revision.outputs.revision }}
    secrets: inherit

  quality_gate:
    needs:
      - resolve_revision
      - deploy
    uses: ./.github/workflows/uat-quality.yml
    with:
      revision: ${{ needs.resolve_revision.outputs.revision }}
    secrets: inherit
