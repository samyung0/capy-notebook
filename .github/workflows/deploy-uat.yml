name: Deploy UAT
run-name: Deploy UAT ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      revision:
        description: Full main-branch SHA; blank deploys the selected main revision
        required: false
        type: string
      bootstrap_ingest:
        description: Initialize an empty UAT ingest stack
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uat-promotion-flow
  cancel-in-progress: false

jobs:
  resolve_revision:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.UAT_DEPLOYMENT_ENABLED == 'true')
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - name: Resolve and validate the UAT revision
        id: revision
        env:
          CANDIDATE_REVISION: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this deployment workflow from main." >&2
            exit 1
          fi
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Revision must be a full Git SHA." >&2
            exit 1
          }
          git cat-file -e "${CANDIDATE_REVISION}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_REVISION" origin/main || {
            echo "Revision is not reachable from origin/main." >&2
            exit 1
          }
          echo "revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve_revision
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: uat
      bootstrap_ingest: ${{ inputs.bootstrap_ingest || false }}
      revision: ${{ needs.resolve_revision.outputs.revision }}

  quality_gate:
    needs:
      - resolve_revision
      - deploy
    uses: ./.github/workflows/uat-quality.yml
    with:
      revision: ${{ needs.resolve_revision.outputs.revision }}
