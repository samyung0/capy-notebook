# Performance and stress tests, dispatched by hand. Production promotion
# calls this file for the editor budgets (job `perf`); the Office runtime
# bench and the collaboration stress test run on dispatch only.
name: Performance

on:
  workflow_dispatch:
    inputs:
      office:
        description: Also run the Office runtime bench
        default: true
        type: boolean
      stress:
        description: Also run the collaboration stress test
        default: true
        type: boolean
  workflow_call:
    inputs:
      revision:
        description: Full Git SHA to measure
        required: true
        type: string
      office:
        description: Also run the Office runtime bench
        default: false
        type: boolean
      stress:
        description: Also run the collaboration stress test
        default: false
        type: boolean

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      # The app imports BetterOffice from the submodule (vite scans it at
      # startup), so this job prepares it as ci.yml's e2e_editor does.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm office:prepare
      - run: pnpm run e2e:install
      - name: Capture runner CPU
        run: |
          cpu_model="$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "PERF_CPU_MODEL=$cpu_model" >> "$GITHUB_ENV"
      - name: Capture Playwright version
        run: |
          playwright_version="$(pnpm exec playwright --version)"
          echo "PERF_CHROMIUM=$playwright_version" >> "$GITHUB_ENV"
      - name: Run editor performance budgets
        id: perf
        continue-on-error: true
        run: pnpm bench:editor
        env:
          PERF_CPU: 4
          PERF_SNAPSHOT_DIR: bench/editor/.results
      - name: Assemble performance snapshot
        if: always()
        run: pnpm exec tsx bench/editor/scripts/compare-cli.ts assemble bench/editor/.results perf-snapshot.json
        env:
          PERF_COMMIT: ${{ inputs.revision || github.sha }}
          PERF_CPU: 4
      - name: Upload failed Playwright artifacts
        if: always() && steps.perf.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-perf-artifacts
          path: |
            playwright-report-perf/
            test-results/
          retention-days: 7
      # Green snapshots come from manual dispatches and from promotions, which
      # call this workflow, so both run lists are read. compare-cli sorts them
      # by creation time and picks the median-of-5 and best baselines itself.
      - name: Download retained green snapshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baselines
          for workflow in perf.yml promote-production.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow="$workflow" \
              --status=success --limit=10 --json databaseId --jq '.[].databaseId'
          done | while read -r run_id; do
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name perf-snapshot --dir "baselines/$run_id" || true
          done
      - name: Write performance comparison
        if: always()
        continue-on-error: true
        run: pnpm exec tsx bench/editor/scripts/compare-cli.ts compare perf-snapshot.json baselines/*/perf-snapshot.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: perf-snapshot
          path: perf-snapshot.json
          retention-days: 90
      - name: Enforce absolute performance budgets
        if: always() && steps.perf.outcome == 'failure'
        run: exit 1

  office:
    if: inputs.office
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The production build imports the fork's WASM and stylesheet.
      - run: pnpm office:prepare
      - run: pnpm run e2e:install
      - name: Run Office runtime bench
        run: pnpm bench:office
        env:
          PERF_SNAPSHOT_DIR: bench/editor/.results/office
      - name: Write Office results
        if: always()
        run: |
          shopt -s nullglob
          for file in bench/editor/.results/office/*.json; do
            echo "### $(basename "$file" .json)"
            echo '```json'
            cat "$file"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Office results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: office-perf-results
          path: |
            bench/editor/.results/office/
            test-results/
          retention-days: 90

  stress:
    if: inputs.stress
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A failure shows on the job and in its summary while the run stays green,
    # so its editor snapshot still counts as a baseline: the p95 is a few
    # milliseconds with a 40% run-to-run spread, too noisy to fail the run.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          submodules: recursive
      # The e2e_stack job's images and layer cache (ci.yml).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: collaboration/Dockerfile
          tags: capy-e2e-collaboration:local
          load: true
          cache-from: type=gha,scope=e2e-collaboration
      - uses: docker/build-push-action@v6
        with:
          context: server
          tags: capy-e2e-server:local
          load: true
          cache-from: type=gha,scope=e2e-server
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Exit 1: a failed check (convergence, lost updates, server errors);
      # exit 2: only the provisional latency budget missed.
      - name: Run collaboration stress test
        run: pnpm bench:stress
        env:
          E2E_PREBUILT_IMAGES: "true"
          STRESS_OUT: bench/collaboration/.results
      - name: Write stress results
        if: always()
        run: |
          file=bench/collaboration/.results/stress.json
          {
            echo '### Collaboration stress'
            if [ ! -f "$file" ]; then
              echo '**FAILED: no results (the stack or the run broke; see the log).**'
            else
              node -e '
                const r = require("./" + process.argv[1]);
                for (const f of r.failures) console.log(`- **FAILED (correctness):** ${f}`);
                for (const b of r.budgetMisses) console.log(`- Over the budget: ${b}`);
                if (!r.failures.length && !r.budgetMisses.length) console.log("All checks passed.");
              ' "$file"
              echo '```json'; cat "$file"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: collaboration-stress-results
          path: bench/collaboration/.results/
          retention-days: 90
