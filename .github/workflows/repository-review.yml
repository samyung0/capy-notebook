name: Manual repository security review

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Strix scan depth
        required: true
        type: choice
        default: standard
        options:
          - quick
          - standard
          - deep
      enforce_findings:
        description: Fail on validated high or critical findings
        required: true
        type: boolean
        default: false
# Deliberately workflow_dispatch-only: Strix is an agent-driven, costly review.

permissions:
  contents: read
  security-events: write

concurrency:
  group: repository-security-review
  cancel-in-progress: false

jobs:
  source_security:
    runs-on: ubuntu-24.04
    environment: uat
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9
      - name: Install pinned Strix CLI
        run: uv tool install strix-agent==1.5.3
      - name: Capture source snapshot
        run: node scripts/review/source-snapshot.mjs
      - name: Run source security scan
        id: strix
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          STRIX_MAX_BUDGET: ${{ vars.STRIX_SOURCE_MAX_BUDGET || '40' }}
        run: >-
          scripts/review/strix-scan.sh source
          "${{ inputs.scan_mode || 'standard' }}"
          "$STRIX_MAX_BUDGET"
      - name: Validate scan completion and release gate
        if: always()
        env:
          ENFORCE_FINDINGS: ${{ inputs.enforce_findings || 'false' }}
        run: |
          result="$(cat review-results/latest-strix-result.txt)"
          args=()
          if [[ "$ENFORCE_FINDINGS" == "true" ]]; then
            args+=(--enforce-findings)
          fi
          node scripts/review/validate-strix-run.mjs "$result" "${args[@]}"
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: repository-security-review-${{ github.run_id }}
          path: review-results/
          retention-days: 90
      - name: Upload SARIF
        if: always() && hashFiles('review-results/**/findings.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: review-results
