name: Deterministic UAT quality

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full deployed SHA; blank uses whatever the UAT backend already serves
        required: false
        type: string
      browser_suite:
        description: Also run the authenticated Playwright suite
        required: false
        default: true
        type: boolean
      critical_paths:
        description: Also run disposable lifecycle journeys with provider verification
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      revision:
        description: Full deployed SHA to verify
        required: true
        type: string
      browser_suite:
        description: Also run the authenticated Playwright suite
        required: false
        default: false
        type: boolean
      critical_paths:
        description: Also run disposable lifecycle journeys with provider verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Reusable calls run under the caller's lock; never wait on that same lock.
  group: ${{ github.workflow == 'Deterministic UAT quality' && 'uat-promotion-flow' || format('uat-quality-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: uat
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Resolve the deployed UAT revision
        id: resolve
        env:
          DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL || vars.UAT_API_URL }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REQUESTED_REVISION" ]]; then
            revision="$REQUESTED_REVISION"
          else
            revision="$(python3 scripts/deploy/verify-backend.py --print)"
          fi
          [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Could not determine a full Git SHA for UAT quality checks." >&2
            exit 1
          }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.revision }}
      - name: Probe authorized UAT services
        env:
          UAT_ALLOWED_HOSTS: ${{ vars.UAT_ALLOWED_HOSTS }}
          UAT_API_URL: ${{ vars.DEPLOYMENT_API_URL || vars.UAT_API_URL }}
          UAT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL || vars.UAT_APP_URL }}
          UAT_COLLAB_URL: ${{ vars.DEPLOYMENT_COLLAB_URL || vars.UAT_COLLAB_URL }}
          UAT_TARGET_AUTHORIZED: ${{ vars.UAT_TARGET_AUTHORIZED }}
          EXPECTED_REVISION: ${{ steps.resolve.outputs.revision }}
        run: scripts/review/remote-smoke.sh

  # A deploy only has to prove the services answer. The authorization checks
  # are run deliberately, before promoting UAT to production.
  authenticated_browser:
    if: inputs.browser_suite
    needs: smoke
    runs-on: ubuntu-24.04
    environment: uat
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.smoke.outputs.revision }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:install
      - name: Run authenticated authorization checks
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          UAT_ALLOWED_HOSTS: ${{ vars.UAT_ALLOWED_HOSTS }}
          UAT_API_URL: ${{ vars.DEPLOYMENT_API_URL || vars.UAT_API_URL }}
          UAT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL || vars.UAT_APP_URL }}
          UAT_COLLAB_URL: ${{ vars.DEPLOYMENT_COLLAB_URL || vars.UAT_COLLAB_URL }}
          UAT_EDITOR_EMAIL: ${{ vars.UAT_EDITOR_EMAIL }}
          UAT_FIXTURE_MATERIAL_ID: ${{ vars.UAT_FIXTURE_MATERIAL_ID }}
          UAT_FIXTURE_WORKSPACE_ID: ${{ vars.UAT_FIXTURE_WORKSPACE_ID }}
          UAT_OTHER_EMAIL: ${{ vars.UAT_OTHER_EMAIL }}
          UAT_OWNER_EMAIL: ${{ vars.UAT_OWNER_EMAIL }}
          UAT_TARGET_AUTHORIZED: ${{ vars.UAT_TARGET_AUTHORIZED }}
          UAT_VIEWER_EMAIL: ${{ vars.UAT_VIEWER_EMAIL }}
        run: pnpm e2e:uat
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: deterministic-uat-quality-${{ github.run_id }}
          path: |
            e2e/uat/report/
            e2e/uat/test-results/
          retention-days: 30

  critical_paths:
    if: inputs.critical_paths
    needs: smoke
    runs-on: ubuntu-24.04
    environment: uat
    timeout-minutes: 120
    env:
      UAT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_REVISION: ${{ needs.smoke.outputs.revision }}
      UAT_TARGET_AUTHORIZED: ${{ vars.UAT_TARGET_AUTHORIZED }}
      UAT_APP_URL: ${{ vars.UAT_APP_URL }}
      UAT_API_URL: ${{ vars.UAT_API_URL }}
      UAT_COLLAB_URL: ${{ vars.UAT_COLLAB_URL }}
      UAT_CLERK_TEST_MODE: ${{ vars.UAT_CLERK_TEST_MODE }}
      UAT_ACTOR_EMAIL_DOMAIN: ${{ vars.UAT_ACTOR_EMAIL_DOMAIN }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      UAT_DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
      UAT_DATABASE_NAME: ${{ vars.UAT_DATABASE_NAME }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_REGION: ${{ vars.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
      UAT_STRIPE_ACCOUNT_ID: ${{ vars.UAT_STRIPE_ACCOUNT_ID }}
      UAT_RESEND_READ_KEY: ${{ secrets.UAT_RESEND_READ_KEY }}
      UAT_RESEND_FROM: ${{ vars.UAT_RESEND_FROM }}
      UAT_SENTRY_TOKEN: ${{ secrets.UAT_SENTRY_TOKEN }}
      UAT_SENTRY_URL: ${{ vars.UAT_SENTRY_URL }}
      UAT_SENTRY_ORG: ${{ vars.UAT_SENTRY_ORG }}
      UAT_SENTRY_PROJECTS: ${{ vars.UAT_SENTRY_PROJECTS }}
      UAT_DB_SSH_HOST: ${{ vars.UAT_DB_SSH_HOST }}
      UAT_DB_SSH_USER: ${{ vars.UAT_DB_SSH_USER }}
      UAT_DB_SSH_PORT: ${{ vars.UAT_DB_SSH_PORT }}
      UAT_DB_SSH_PRIVATE_KEY: ${{ secrets.UAT_DB_SSH_PRIVATE_KEY }}
      UAT_DB_SSH_KNOWN_HOSTS: ${{ vars.UAT_DB_SSH_KNOWN_HOSTS }}
      UAT_DB_FORWARD_HOST: ${{ vars.UAT_DB_FORWARD_HOST }}
      UAT_DB_FORWARD_PORT: ${{ vars.UAT_DB_FORWARD_PORT }}
      UAT_DB_LOCAL_PORT: ${{ vars.UAT_DB_LOCAL_PORT }}
      INGEST_HOST: ${{ vars.INGEST_HOST }}
      INGEST_HOST_USER: ${{ vars.INGEST_HOST_USER }}
      INGEST_HOST_SSH_PORT: ${{ vars.INGEST_HOST_SSH_PORT }}
      INGEST_HOST_SSH_PRIVATE_KEY: ${{ secrets.INGEST_HOST_SSH_PRIVATE_KEY }}
      INGEST_HOST_KNOWN_HOSTS: ${{ secrets.INGEST_HOST_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.smoke.outputs.revision }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./vendor/betteroffice/.github/actions/wasm-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: ./.github/actions/cache-betteroffice
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm office:prepare
        timeout-minutes: 30
      - run: uv sync --frozen
      - run: pnpm exec playwright install --with-deps chromium
      - name: Connect the read-only UAT database verifier
        run: scripts/uat/journey-tunnel.sh start
      - name: Verify the separately deployed ingest candidate
        id: ingest_release
        timeout-minutes: 3
        run: scripts/uat/verify-journey-releases.sh before
      - name: Run critical-path journeys
        timeout-minutes: 50
        run: pnpm e2e:uat:journeys
      - name: Clean up this run's disposable resources
        if: always()
        timeout-minutes: 10
        run: pnpm e2e:uat:cleanup --run-id "$UAT_RUN_ID"
      - name: Recheck the ingest candidate after cleanup
        if: always() && steps.ingest_release.outcome == 'success'
        timeout-minutes: 3
        run: scripts/uat/verify-journey-releases.sh after
      - name: Close the database tunnel
        if: always()
        run: scripts/uat/journey-tunnel.sh stop
      - name: Upload sanitized journey evidence and cleanup report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: uat-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/uat/journey-runs/${{ env.UAT_RUN_ID }}/
          retention-days: 30
