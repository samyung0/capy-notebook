name: Manual UAT review with Strix

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Strix scan depth
        required: true
        type: choice
        default: standard
        options:
          - quick
          - standard
          - deep
      enforce_findings:
        description: Fail on validated high or critical findings
        required: true
        type: boolean
        default: false
# Deliberately workflow_dispatch-only: this workflow includes an autonomous
# Strix assessment. Deterministic deployment checks live in uat-quality.yml.

permissions:
  contents: read
  security-events: write

concurrency:
  group: uat-promotion-flow
  cancel-in-progress: false

jobs:
  deterministic_quality:
    uses: ./.github/workflows/uat-quality.yml
    with:
      revision: ${{ github.sha }}

  dynamic_security:
    needs: deterministic_quality
    runs-on: ubuntu-24.04
    environment: uat
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9
      - name: Install pinned Strix CLI
        run: uv tool install strix-agent==1.5.3
      - name: Run source-aware UAT pentest
        id: strix
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          STRIX_MAX_BUDGET: ${{ vars.STRIX_UAT_MAX_BUDGET || '40' }}
          STRIX_UAT_AUTH_INSTRUCTIONS: ${{ secrets.STRIX_UAT_AUTH_INSTRUCTIONS }}
          UAT_ALLOWED_HOSTS: ${{ vars.UAT_ALLOWED_HOSTS }}
          UAT_API_URL: ${{ vars.DEPLOYMENT_API_URL || vars.UAT_API_URL }}
          UAT_APP_URL: ${{ vars.DEPLOYMENT_APP_URL || vars.UAT_APP_URL }}
          UAT_COLLAB_URL: ${{ vars.DEPLOYMENT_COLLAB_URL || vars.UAT_COLLAB_URL }}
          UAT_OPS_URL: ${{ vars.DEPLOYMENT_OPS_URL || vars.UAT_OPS_URL }}
          UAT_TARGET_AUTHORIZED: ${{ vars.UAT_TARGET_AUTHORIZED }}
        run: >-
          scripts/review/strix-scan.sh uat
          "${{ inputs.scan_mode || 'standard' }}"
          "$STRIX_MAX_BUDGET"
      - name: Validate scan completion and release gate
        if: always()
        env:
          ENFORCE_FINDINGS: ${{ inputs.enforce_findings || 'false' }}
        run: |
          result="$(cat review-results/latest-strix-result.txt)"
          args=()
          if [[ "$ENFORCE_FINDINGS" == "true" ]]; then
            args+=(--enforce-findings)
          fi
          node scripts/review/validate-strix-run.mjs "$result" "${args[@]}"
      - name: Upload Strix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: uat-strix-${{ github.run_id }}
          path: review-results/
          retention-days: 90
      - name: Upload SARIF
        if: always() && hashFiles('review-results/**/findings.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: review-results
