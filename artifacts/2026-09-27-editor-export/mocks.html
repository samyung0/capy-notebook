<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capy export layout choices</title><style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f2ef;
        color: #242424;
        font:
          14px/1.55 Inter,
          Segoe UI,
          sans-serif;
      }
      button,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: #5744a5;
      }
      header {
        padding: 24px max(20px, calc((100% - 1120px) / 2));
        background: #fff;
        border-bottom: 1px solid #e0ded9;
      }
      header h1 {
        font-size: 23px;
        letter-spacing: -0.5px;
        margin: 4px 0 8px;
      }
      header p {
        margin: 6px 0;
        color: #666;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: #777;
      }
      .choices {
        display: flex;
        gap: 8px;
        margin: 20px 0 12px;
        flex-wrap: wrap;
      }
      .choices button {
        flex: 1;
        min-width: 200px;
        text-align: left;
        border: 1px solid #dedbd5;
        background: #fff;
        border-radius: 9px;
        padding: 12px 15px;
      }
      .choices button[aria-pressed="true"] {
        border-color: #6f5eb8;
        background: #f4f0ff;
        box-shadow: 0 0 0 1px #6f5eb8;
      }
      .choices strong,
      .choices small {
        display: block;
      }
      .choices small {
        color: #65606e;
        font-size: 12px;
        margin-top: 4px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .tools button,
      select,
      .download {
        padding: 7px 12px;
        border: 1px solid #dedbd5;
        border-radius: 6px;
        background: #fff;
      }
      .tools button[aria-pressed="true"] {
        background: #28252e;
        color: #fff;
        border-color: #28252e;
      }
      .download {
        margin-left: auto;
        text-decoration: none;
      }
      .status {
        font-size: 12px;
        margin: 12px auto;
        color: #666;
        max-width: 850px;
        padding: 0 16px;
      }
      main {
        padding: 12px 20px 60px;
      }
      .paper {
        max-width: 850px;
        margin: auto;
        background: #fff;
        padding: 55px 62px;
        box-shadow: 0 2px 14px #29221a12;
        border: 1px solid #e2dfda;
        overflow-wrap: anywhere;
        font:
          15px/1.65 Georgia,
          serif;
      }
      .paper.md {
        font-family:
          Segoe UI,
          sans-serif;
      }
      .paper h1 {
        font-size: 30px;
        line-height: 1.2;
        margin: 0 0 28px;
      }
      .paper h2 {
        font:
          600 21px/1.35 Segoe UI,
          sans-serif;
        margin: 32px 0 14px;
        break-after: avoid;
      }
      .paper h3 {
        font-size: 18px;
        margin: 20px 0 9px;
      }
      .paper h4 {
        font-size: 16px;
      }
      .paper h5 {
        font-size: 14px;
      }
      .paper h6 {
        font-size: 13px;
      }
      .paper p {
        margin: 9px 0;
      }
      .paper blockquote {
        margin: 18px 0;
        padding: 5px 20px;
        border-left: 3px solid #bbb;
        color: #4b4652;
      }
      .paper hr {
        border: 0;
        border-top: 1px solid #bbb;
        margin: 24px 0;
      }
      .paper pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f5f4f2;
        padding: 16px;
        font:
          12px/1.65 Consolas,
          monospace;
      }
      .paper code {
        font:
          13px/1.5 Consolas,
          monospace;
        background: #f4f3f1;
      }
      .paper .toc {
        font:
          13px/1.7 Segoe UI,
          sans-serif;
        columns: 2;
        column-gap: 28px;
        margin-bottom: 22px;
      }
      .toc a {
        display: block;
        text-decoration: none;
      }
      .paper table {
        border-collapse: collapse;
        width: 100%;
        margin: 14px 0 20px;
        font:
          13px/1.5 Segoe UI,
          sans-serif;
      }
      .paper th,
      .paper td {
        border: 1px solid #dad8d3;
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }
      .paper th {
        background: #f0eeea;
        font-weight: 600;
      }
      .paper .columns td {
        border: 0;
        border-left: 1px solid #dedbd5;
      }
      .paper .columns td:first-child {
        border: 0;
      }
      .callout {
        padding: 12px 15px;
        margin: 12px 0;
        background: #eff6ff;
        border-left: 3px solid #3b82f6;
      }
      .callout.success {
        background: #eef5f0;
        border-color: #5f9174;
      }
      .callout.warning {
        background: #faf4e8;
        border-color: #be963f;
      }
      .callout.danger {
        background: #f9eeeb;
        border-color: #b96558;
      }
      .callout b {
        font-family:
          Segoe UI,
          sans-serif;
        font-size: 13px;
      }
      .question {
        margin: 16px 0 24px;
        break-inside: avoid;
      }
      .qhead {
        display: flex;
        gap: 14px;
        justify-content: space-between;
      }
      .qhead strong {
        font-weight: 600;
      }
      .marks {
        white-space: nowrap;
        color: #666;
        font:
          12px Segoe UI,
          sans-serif;
        padding-top: 4px;
      }
      .options {
        list-style: none;
        padding: 0 0 0 22px;
        margin: 10px 0;
      }
      .options li {
        margin: 5px 0;
      }
      .answer {
        margin: 13px 0 20px;
        padding: 12px 16px;
        font-size: 14px;
      }
      .answer p {
        margin: 5px 0;
      }
      .answer small {
        font-family:
          Segoe UI,
          sans-serif;
        color: #666;
      }
      .answer-key {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 2px solid #bbb;
      }
      .writing {
        height: 50px;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 24px,
          #d9d6d0 24px,
          #d9d6d0 25px
        );
        margin: 8px 0;
      }
      .flash {
        padding: 14px 0;
        border-bottom: 1px solid #dedbd5;
        break-inside: avoid;
      }
      .flash p:first-child {
        font-weight: 600;
      }
      .label {
        font:
          11px Segoe UI,
          sans-serif;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      .video {
        margin: 18px 0;
        max-width: 560px;
        break-inside: avoid;
      }
      .video p {
        margin: 8px 0;
      }
      .video-preview {
        display: grid;
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #242424;
        border-radius: 3px;
        place-items: center;
      }
      .video-preview img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        color: white;
      }
      .video-play {
        display: grid;
        z-index: 1;
        width: 68px;
        height: 48px;
        border-radius: 12px;
        background: #c00;
        color: white;
        font:
          24px Arial,
          sans-serif;
        text-indent: 3px;
        place-items: center;
      }
      .video .video-caption {
        color: #646464;
        font:
          12px/1.5 Arial,
          sans-serif;
      }
      .diagram {
        width: 100%;
        max-width: 300px;
        display: block;
        margin: 18px auto;
      }
      .caption {
        text-align: center;
        color: #666;
        font:
          12px Segoe UI,
          sans-serif;
      }
      .source {
        font:
          12px/1.7 Consolas,
          monospace;
        white-space: pre-wrap;
      }
      .coverage {
        max-width: 1120px;
        font-family:
          Segoe UI,
          sans-serif;
      }
      .coverage table {
        font-size: 13px;
      }
      .coverage h2 {
        margin-top: 12px;
      }
      .notice {
        border-left: 3px solid #8d7d51;
        padding-left: 14px;
        color: #605844;
        font:
          13px/1.6 Segoe UI,
          sans-serif;
      }
      .jump {
        max-width: 190px;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 650px) {
        header {
          padding: 20px 16px;
        }
        .choices {
          display: grid;
          grid-template-columns: 1fr;
        }
        .choices button {
          min-width: 0;
        }
        .paper {
          padding: 26px 20px;
        }
        .paper .toc {
          columns: 1;
        }
        main {
          padding: 10px 8px 40px;
        }
        .download {
          margin-left: 0;
        }
        .paper .columns td {
          display: block;
          width: 100% !important;
          border-left: 0;
          border-bottom: 1px solid #ddd;
        }
        .paper th,
        .paper td {
          padding: 7px;
        }
        .tools {
          gap: 6px;
        }
      }
      @media print {
        header,
        .status {
          display: none;
        }
        body {
          background: #fff;
        }
        main {
          padding: 0;
        }
        .paper {
          box-shadow: none;
          border: 0;
          padding: 0;
          max-width: none;
        }
        .answer-key {
          break-before: page;
        }
      }
    

      .paper .katex-display {
        overflow-x: auto;
        max-width: 100%;
        padding: 4px 0;
      }
    
math[display=block]{display:block;overflow-x:auto;max-width:100%;margin:18px 0}</style></head><body><header>
      <div class="eyebrow">Capy Notebook · Export proposal</div>

      <div class="choices" aria-label="Export layouts">
        <button data-profile="study" aria-pressed="false">

          <strong>B · Answered notes</strong><small>Answer and explanation below each question.</small></button><button data-profile="worksheet" aria-pressed="true">

        </button>

      <div class="tools" aria-label="Preview controls">

            <option value="text-marks-styles">Text styles</option>
          </select></label><button class="download" id="download">Download sample .md</button>
      </div>
    </header><p class="status" id="status" aria-live="polite"></p><main><article id="paper" class="paper"></article></main><script>const views={"study":{"docx":{"html":"\u003ch1 id=\"editor-feature-matrix\">Editor feature matrix\u003c/h1>\u003cnav class=\"toc\" aria-label=\"Document contents\">\u003ca style=\"padding-left:0px\" href=\"#editor-feature-matrix\">Editor feature matrix\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#headings\">Headings\u003c/a>\u003ca style=\"padding-left:18px\" href=\"#heading-3\">Heading 3\u003c/a>\u003ca style=\"padding-left:27px\" href=\"#heading-4\">Heading 4\u003c/a>\u003ca style=\"padding-left:36px\" href=\"#heading-5\">Heading 5\u003c/a>\u003ca style=\"padding-left:45px\" href=\"#heading-6\">Heading 6\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#text-marks-styles\">Text marks &amp; styles\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#alignment\">Alignment\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#lists\">Lists\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#quote-divider\">Quote &amp; divider\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#callout-variants\">Callout variants\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#code-block\">Code block\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#table\">Table\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#columns\">Columns\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#block-equation\">Block equation\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#youtube-embed\">YouTube embed\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#mermaid-diagram\">Mermaid diagram\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#quiz-block\">Quiz block\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#flashcards-block\">Flashcards block\u003c/a>\u003c/nav>\u003cp>This note intentionally exercises every Plate feature except uploaded media nodes (img / audio / file).\u003c/p>\u003ch2 id=\"headings\">Headings\u003c/h2>\u003ch3 id=\"heading-3\">Heading 3\u003c/h3>\u003ch4 id=\"heading-4\">Heading 4\u003c/h4>\u003ch5 id=\"heading-5\">Heading 5\u003c/h5>\u003ch6 id=\"heading-6\">Heading 6\u003c/h6>\u003ch2 id=\"text-marks-styles\">Text marks &amp; styles\u003c/h2>\u003cp>plain · \u003cstrong>bold\u003c/strong> · \u003cem>italic\u003c/em> · \u003cu>underline\u003c/u> · \u003cs>strike\u003c/s> · \u003ccode>inline code\u003c/code> · \u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>B\u003c/kbd> · \u003cmark>highlight\u003c/mark> · H\u003csub>2\u003c/sub>O · E=mc\u003csup>2\u003c/sup>\u003c/p>\u003cp>\u003cspan style=\"color:#dc2626\">colored\u003c/span> · \u003cspan style=\"color:#854d0e;background-color:#fef9c3\">tinted\u003c/span> · \u003cspan style=\"font-size:24px\">larger\u003c/span> · \u003cspan style=\"font-family:Georgia, serif\">serif sample\u003c/span>\u003c/p>\u003cp>Inline link: \u003ca href=\"https://openstax.org/details/books/biology-2e\">OpenStax Biology\u003c/a> · mention @Kate Malone · inline math \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>G\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>H\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>S\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\Delta G = \\Delta H - T\\Delta S\u003c/annotation>\u003c/semantics>\u003c/math>.\u003c/p>\u003ch2 id=\"alignment\">Alignment\u003c/h2>\u003cp style=\"text-align:left\">Left-aligned paragraph (default).\u003c/p>\u003cp style=\"text-align:center\">Center-aligned paragraph.\u003c/p>\u003cp style=\"text-align:right\">Right-aligned paragraph.\u003c/p>\u003cp style=\"text-align:justify\">Justify-aligned paragraph: membranes separate compartments so gradients can do work across the bilayer.\u003c/p>\u003ch2 id=\"lists\">Lists\u003c/h2>\u003cp style=\"padding-left:16px\">• Bulleted item — organelles\u003c/p>\u003cp style=\"padding-left:16px\">• Bulleted item — membranes\u003c/p>\u003cp style=\"padding-left:16px\">\u003cspan class=\"numbered\">1.\u003c/span> Numbered step — isolate the variable\u003c/p>\u003cp style=\"padding-left:16px\">\u003cspan class=\"numbered\">2.\u003c/span> Numbered step — apply the model\u003c/p>\u003cp style=\"padding-left:16px\">☑ Todo checked — skim the matrix\u003c/p>\u003cp style=\"padding-left:16px\">☐ Todo open — try each toolbar control\u003c/p>\u003ch2 id=\"quote-divider\">Quote &amp; divider\u003c/h2>\u003cblockquote>\u003cp>“Nothing in biology makes sense except in the light of evolution.” — Theodosius Dobzhansky\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"callout-variants\">Callout variants\u003c/h2>\u003cdiv class=\"callout info\">\u003cb>Info\u003c/b>\u003cp>Info callout — background reading is linked above.\u003c/p>\u003c/div>\u003cdiv class=\"callout success\">\u003cb>Success\u003c/b>\u003cp>Success callout — you covered every non-media block.\u003c/p>\u003c/div>\u003cdiv class=\"callout warning\">\u003cb>Warning\u003c/b>\u003cp>Warning callout — osmolarity units trip people up.\u003c/p>\u003c/div>\u003cdiv class=\"callout danger\">\u003cb>Danger\u003c/b>\u003cp>Danger callout — do not confuse lysis with crenation.\u003c/p>\u003c/div>\u003ch2 id=\"code-block\">Code block\u003c/h2>\u003cpre>\u003ccode>def atp_yield(glucose_mol: float) -&gt; float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\u003c/code>\u003c/pre>\u003ch2 id=\"table\">Table\u003c/h2>\u003ctable>\u003ctbody>\u003ctr>\u003cth>\u003cp>Process\u003c/p>\u003c/th>\u003cth>\u003cp>Location\u003c/p>\u003c/th>\u003cth>\u003cp>ATP net\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Glycolysis\u003c/p>\u003c/td>\u003ctd>\u003cp>Cytosol\u003c/p>\u003c/td>\u003ctd>\u003cp>2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Krebs cycle\u003c/p>\u003c/td>\u003ctd>\u003cp>Mitochondrial matrix\u003c/p>\u003c/td>\u003ctd>\u003cp>2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ETC / oxidative phosphorylation\u003c/p>\u003c/td>\u003ctd>\u003cp>Inner membrane\u003c/p>\u003c/td>\u003ctd>\u003cp>~28\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2 id=\"columns\">Columns\u003c/h2>\u003ctable class=\"columns\">\u003ctbody>\u003ctr>\u003ctd style=\"width:50%\">\u003cp>\u003cstrong>Two-column left\u003c/strong> — structure.\u003c/p>\u003c/td>\u003ctd style=\"width:50%\">\u003cp>\u003cstrong>Two-column right\u003c/strong> — function.\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ctable class=\"columns\">\u003ctbody>\u003ctr>\u003ctd style=\"width:33.333%\">\u003cp>Prokaryote\u003c/p>\u003c/td>\u003ctd style=\"width:33.333%\">\u003cp>Eukaryote animal\u003c/p>\u003c/td>\u003ctd style=\"width:33.334%\">\u003cp>Eukaryote plant\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ctable class=\"columns\">\u003ctbody>\u003ctr>\u003ctd style=\"width:66.667%\">\u003cp>Wide column: endosymbiotic origin of mitochondria.\u003c/p>\u003c/td>\u003ctd style=\"width:33.333%\">\u003cp>Narrow: DNA circular.\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2 id=\"block-equation\">Block equation\u003c/h2>\u003cspan class=\"katex-display\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmn>6\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>6\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>→\u003c/mo>\u003cmn>6\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmtext>ATP\u003c/mtext>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003ch2 id=\"youtube-embed\">YouTube embed\u003c/h2>\u003cdiv class=\"video\">\u003cp>\u003ca href=\"https://www.youtube.com/watch?v=URUJD5NEXC8\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube video\u003c/a>\u003c/p>\u003ca class=\"video-preview\" href=\"https://www.youtube.com/watch?v=URUJD5NEXC8\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch video on YouTube\">\u003cimg src=\"https://i.ytimg.com/vi/URUJD5NEXC8/hqdefault.jpg\" alt=\"YouTube video preview\" loading=\"lazy\" referrerpolicy=\"no-referrer\">\u003cspan class=\"video-play\" aria-hidden=\"true\">▶\u003c/span>\u003c/a>\u003c/div>\u003ch2 id=\"mermaid-diagram\">Mermaid diagram\u003c/h2>\u003csvg class=\"diagram\" viewBox=\"0 0 280 400\" role=\"img\" aria-label=\"Glucose to glycolysis to pyruvate to Krebs to ETC to ATP\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#80768d\">\u003c/path>\u003c/marker>\u003c/defs>\u003crect x=\"60\" y=\"6\" width=\"160\" height=\"38\" rx=\"5\" fill=\"#f4f1f7\" stroke=\"#b1a6bd\">\u003c/rect>\u003ctext x=\"140\" y=\"31\" text-anchor=\"middle\" font-family=\"Segoe UI\" font-size=\"14\" fill=\"#29232f\">Glucose\u003c/text>\u003cline x1=\"140\" y1=\"44\" x2=\"140\" y2=\"69\" stroke=\"#80768d\" marker-end=\"url(#arrow)\">\u003c/line>\u003crect x=\"60\" y=\"72\" width=\"160\" height=\"38\" rx=\"5\" fill=\"#f4f1f7\" stroke=\"#b1a6bd\">\u003c/rect>\ ection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>2. Which organelles contain their own DNA? (multi)\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003cli>☐ Mitochondria\u003c/li>\u003cli>☐ Lysosomes\u003c/li>\u003cli>☐ Chloroplasts\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>3. Ribosomes are present in both prokaryotes and eukaryotes.\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003cli>A. True\u003c/li>\u003cli>B. False\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>4. The main short-term energy carrier is ____.\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003c/ul>\u003cp>Answer: ______________________________\u003c/p>\u003c/section>\u003csection class=\"answer-key\">\u003ch3>Quiz answer key\u003c/h3>\u003cdiv class=\"answer\">\u003cp>\u003cb>1. A. Cytosol\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>Glycolysis occurs in the cytosol of the cell.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>Glycolysis occurs in the cytosol of the cell.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>2. A. Mitochondria; C. Chloroplasts\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>Both mitochondria and chloroplasts have their own DNA.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>Both mitochondria and chloroplasts have their own DNA.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>3. True\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>True — ribosomes are not membrane-bound.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>True — ribosomes are not membrane-bound.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>4. ATP / adenosine triphosphate\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>ATP is the cell’s short-term energy currency.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>ATP is the cell’s short-term energy currency.\u003c/p>\u003c/div>\u003c/section>\u003ch2 id=\"flashcards-block\">Flashcards block\u003c/h2>\u003csection class=\"flash\">\u003cdiv class=\"label\">Card 1\u003c/div>\u003cp>What does ATP stand for?\u003c/p>\u003cp>Adenosine triphosphate — cellular energy currency\u003c/p>\u003c/section>\u003csection class=\"flash\">\u003cdiv class=\"label\">Card 2\u003c/div>\u003cp>Define osmosis\u003c/p>\u003cp>Diffusion of water across a semi-permeable membrane\u003c/p>\u003c/section>\u003cp>End of matrix. Media uploads (\u003ccode>img\u003c/code> / \u003ccode>audio\u003c/code> / \u003ccode>file\u003c/code>) are omitted on purpose.\u003c/p>","className":"paper","status":"DOCX layout mock · Not a generated Word file. The video preview opens YouTube here; native playback in Word, pagination and image conversion still need validation.","markdown":"# Editor feature matrix\n\n- [Editor feature matrix](#editor-feature-matrix)\n  - [Headings](#headings)\n    - [Heading 3](#heading-3)\n      - [Heading 4](#heading-4)\n        - [Heading 5](#heading-5)\n          - [Heading 6](#heading-6)\n  - [Text marks & styles](#text-marks-styles)\n  - [Alignment](#alignment)\n  - [Lists](#lists)\n  - [Quote & divider](#quote-divider)\n  - [Callout variants](#callout-variants)\n  - [Code block](#code-block)\n  - [Table](#table)\n  - [Columns](#columns)\n  - [Block equation](#block-equation)\n  - [YouTube embed](#youtube-embed)\n  - [Mermaid diagram](#mermaid-diagram)\n  - [Quiz block](#quiz-block)\n  - [Flashcards block](#flashcards-block)\n\nThis note intentionally exercises every Plate feature except uploaded media nodes (img / audio / file).\n\n## Headings\n\n### Heading 3\n\n#### Heading 4\n\n##### Heading 5\n\n###### Heading 6\n\n## Text marks & styles\n\nplain · **bold** · *italic* · \u003cu>underline\u003c/u> · ~~strike~~ · `inline code` · `Ctrl`+`B` · \u003cmark>highlight\u003c/mark> · H\u003csub>2\u003c/sub>O · E=mc\u003csup>2\u003c/sup>\n\ncolored · tinted · larger · serif sample\n\nInline link: [OpenStax Biology](https://openstax.org/details/books/biology-2e) · mention @Kate Malone · inline math $\\Delta G = \\Delta H - T\\Delta S$.\n\n## Alignment\n\nLeft-aligned paragraph (default).\n\nCenter-aligned paragraph.\n\nRight-aligned paragraph.\n\nJustify-aligned paragraph: membranes separate compartments so gradients can do work across the bilayer.\n\n## Lists\n\n- Bulleted item — organelles\n\n- Bulleted item — membranes\n\n1. Numbered step — isolate the variable\n\n1. Numbered step — apply the model\n\n- [x] Todo checked — skim the matrix\n\n- [ ] Todo open — try each toolbar control\n\n## Quote & divider\n\n> “Nothing in biology makes sense except in the light of evolution.” — Theodosius Dobzhansky\n\n---\n\n## Callout variants\n\n> **Info**\n>\n> Info callout — background reading is linked above.\n\n> **Success**\n>\n> Success callout — you covered every non-media block.\n\n> **Warning**\n>\n> Warning callout — osmolarity units trip people up.\n\n> **Danger**\n>\n> Danger callout — do not confuse lysis with crenation.\n\n## Code block\n\n```python\ndef atp_yield(glucose_mol: float) -> float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\n```\n\n## Table\n\n| Process | Location | ATP net |\n| --- | --- | --- |\n| Glycolysis | Cytosol | 2 |\n| Krebs cycle | Mitochondrial matrix | 2 |\n| ETC / oxidative phosphorylation | Inner membrane | ~28 |\n\n## Columns\n\n**Column 1**\n\n**Two-column left** — structure.\n\n**Column 2**\n\n**Two-column right** — function.\n\n**Column 1**\n\nProkaryote\n\n**Column 2**\n\nEukaryote animal\n\n**Column 3**\n\nEukaryote plant\n\n**Column 1**\n\nWide column: endosymbiotic origin of mitochondria.\n\n**Column 2**\n\nNarrow: DNA circular.\n\n## Block equation\n\n$$\n\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\n$$\n\n## YouTube embed\n\n[YouTube video](https://www.youtube.com/watch?v=URUJD5NEXC8)\n\n## Mermaid diagram\n\nRespiration overview\n\n```mermaid\nflowchart TB\n  Glucose --> Glycolysis\n  Glycolysis --> Pyruvate\n  Pyruvate --> Krebs\n  Krebs --> ETC\n  ETC --> ATP\n```\n\n## Quiz block\n\n### Question 1\n\nWhere does glycolysis occur? (1 mark)\n\nA. Cytosol\nB. Nucleus\nC. Golgi lumen\n\n### Question 2\n\nWhich organelles contain their own DNA? (multi) (1 mark)\n\n- [ ] Mitochondria\n- [ ] Lysosomes\n- [ ] Chloroplasts\n\n### Question 3\n\nRibosomes are present in both prokaryotes and eukaryotes. (1 mark)\n\nA. True\nB. False\n\n### Question 4\n\nThe main short-term energy carrier is ____. (1 mark)\n\n\n\nAnswer: ______________________________\n\n### Quiz answer key\n\n**1. A. Cytosol**\n\nMarking scheme (1 mark):\n- Glycolysis occurs in the cytosol of the cell.\n\nWorked solution: Glycolysis occurs in the cytosol of the cell.\n\n**2. A. Mitochondria; C. Chloroplasts**\n\nMarking scheme (1 mark):\n- Both mitochondria and chloroplasts have their own DNA.\n\nWorked solution: Both mitochondria and chloroplasts have their own DNA.\n\n**3. True**\n\nMarking scheme (1 mark):\n- True — ribosomes are not membrane-bound.\n\nWorked solution: True — ribosomes are not membrane-bound.\n\n**4. ATP / adenosine triphosphate**\n\nMarking scheme (1 mark):\n- ATP is the cell’s short-term energy currency.\n\nWorked solution: ATP is the cell’s short-term energy currency.\n\n## Flashcards block\n\n### Card 1\n\n**Front:** What does ATP stand for?\n\n**Back:** Adenosine triphosphate — cellular energy currency\n\n### Card 2\n\n**Front:** Define osmosis\n\n**Back:** Diffusion of water across a semi-permeable membrane\n\nEnd of matrix. Media uploads (`img` / `audio` / `file`) are omitted on purpose.\n\n"},"markdo 2>\u003cblockquote>\u003cp>“Nothing in biology makes sense except in the light of evolution.” — Theodosius Dobzhansky\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"callout-variants\">Callout variants\u003c/h2>\u003cblockquote class=\"\">\u003cb>Info\u003c/b>\u003cp>Info callout — background reading is linked above.\u003c/p>\u003c/blockquote>\u003cblockquote class=\"\">\u003cb>Success\u003c/b>\u003cp>Success callout — you covered every non-media block.\u003c/p>\u003c/blockquote>\u003cblockquote class=\"\">\u003cb>Warning\u003c/b>\u003cp>Warning callout — osmolarity units trip people up.\u003c/p>\u003c/blockquote>\u003cblockquote class=\"\">\u003cb>Danger\u003c/b>\u003cp>Danger callout — do not confuse lysis with crenation.\u003c/p>\u003c/blockquote>\u003ch2 id=\"code-block\">Code block\u003c/h2>\u003cpre>\u003ccode>def atp_yield(glucose_mol: float) -&gt; float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\u003c/code>\u003c/pre>\u003ch2 id=\"table\">Table\u003c/h2>\u003ctable>\u003ctbody>\u003ctr>\u003cth>\u003cp>Process\u003c/p>\u003c/th>\u003cth>\u003cp>Location\u003c/p>\u003c/th>\u003cth>\u003cp>ATP net\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Glycolysis\u003c/p>\u003c/td>\u003ctd>\u003cp>Cytosol\u003c/p>\u003c/td>\u003ctd>\u003cp>2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Krebs cycle\u003c/p>\u003c/td>\u003ctd>\u003cp>Mitochondrial matrix\u003c/p>\u003c/td>\u003ctd>\u003cp>2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ETC / oxidative phosphorylation\u003c/p>\u003c/td>\u003ctd>\u003cp>Inner membrane\u003c/p>\u003c/td>\u003ctd>\u003cp>~28\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2 id=\"columns\">Columns\u003c/h2>\u003cp>\u003cb>Column 1\u003c/b>\u003c/p>\u003cp>\u003cstrong>Two-column left\u003c/strong> — structure.\u003c/p>\u003cp>\u003cb>Column 2\u003c/b>\u003c/p>\u003cp>\u003cstrong>Two-column right\u003c/strong> — function.\u003c/p>\u003cp>\u003cb>Column 1\u003c/b>\u003c/p>\u003cp>Prokaryote\u003c/p>\u003cp>\u003cb>Column 2\u003c/b>\u003c/p>\u003cp>Eukaryote animal\u003c/p>\u003cp>\u003cb>Column 3\u003c/b>\u003c/p>\u003cp>Eukaryote plant\u003c/p>\u003cp>\u003cb>Column 1\u003c/b>\u003c/p>\u003cp>Wide column: endosymbiotic origin of mitochondria.\u003c/p>\u003cp>\u003cb>Column 2\u003c/b>\u003c/p>\u003cp>Narrow: DNA circular.\u003c/p>\u003ch2 id=\"block-equation\">Block equation\u003c/h2>\u003cspan class=\"katex-display\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmn>6\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>6\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>→\u003c/mo>\u003cmn>6\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmtext>ATP\u003c/mtext>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003ch2 id=\"youtube-embed\">YouTube embed\u003c/h2>\u003cp>\u003ca href=\"https://www.youtube.com/watch?v=URUJD5NEXC8\">YouTube video\u003c/a>\u003c/p>\u003ch2 id=\"mermaid-diagram\">Mermaid diagram\u003c/h2>\u003cp>Respiration overview\u003c/p>\u003cpre>\u003ccode>flowchart TB\n  Glucose --&gt; Glycolysis\n  Glycolysis --&gt; Pyruvate\n  Pyruvate --&gt; Krebs\n  Krebs --&gt; ETC\n  ETC --&gt; ATP\u003c/code>\u003c/pre>\u003ch2 id=\"quiz-block\">Quiz block\u003c/h2>\u003csection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>1. Where does glycolysis occur?\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003cli>A. Cytosol\u003c/li>\u003cli>B. Nucleus\u003c/li>\u003cli>C. Golgi lumen\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>2. Which organelles contain their own DNA? (multi)\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003cli>☐ Mitochondria\u003c/li>\u003cli>☐ Lysosomes\u003c/li>\u003cli>☐ Chloroplasts\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>3. Ribosomes are present in both prokaryotes and eukaryotes.\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003cli>A. True\u003c/li>\u003cli>B. False\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"question\">\u003cdiv class=\"qhead\">\u003cstrong>4. The main short-term energy carrier is ____.\u003c/strong>\u003cspan class=\"marks\">1 mark\u003c/span>\u003c/div>\u003cul class=\"options\">\u003c/ul>\u003cp>Answer: ______________________________\u003c/p>\u003c/section>\u003csection class=\"answer-key\">\u003ch3>Quiz answer key\u003c/h3>\u003cdiv class=\"answer\">\u003cp>\u003cb>1. A. Cytosol\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>Glycolysis occurs in the cytosol of the cell.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>Glycolysis occurs in the cytosol of the cell.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>2. A. Mitochondria; C. Chloroplasts\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>Both mitochondria and chloroplasts have their own DNA.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>Both mitochondria and chloroplasts have their own DNA.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>3. True\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>True — ribosomes are not membrane-bound.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>True — ribosomes are not membrane-bound.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>4. ATP / adenosine triphosphate\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>ATP is the cell’s short-term energy currency.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>ATP is the cell’s short-term energy currency.\u003c/p>\u003c/div>\u003c/section>\u003ch2 id=\"flashcards-block\">Flashcards block\u003c/h2>\u003csection class=\"flash\">\u003cdiv class=\"label\">Card 1\u003c/div>\u003cp>What does ATP stand for?\u003c/p>\u003cp>Adenosine triphosphate — cellular energy currency\u003c/p>\u003c/section>\u003csection class=\"flash\">\u003cdiv class=\"label\">Card 2\u003c/div>\u003cp>Define osmosis\u003c/p>\u003cp>Diffusion of water across a semi-permeable membrane\u003c/p>\u003c/section>\u003cp>End of matrix. Media uploads (\u003ccode>img\u003c/code> / \u003ccode>audio\u003c/code> / \u003ccode>file\u003c/code>) are omitted on purpose.\u003c/p>","className":"paper md","status":"Markdown rendering mock · Math, Mermaid and inline HTML support depends on the reader. Fonts, colors and alignment are simplified.","markdown":"# Editor feature matrix\n\n- [Editor feature matrix](#editor-feature-matrix)\n  - [Headings](#headings)\n    - [Heading 3](#heading-3)\n      - [Heading 4](#heading-4)\n        - [Heading 5](#heading-5)\n          - [Heading 6](#heading-6)\n  - [Text marks & styles](#text-marks-styles)\n  - [Alignment](#alignment)\n  - [Lists](#lists)\n  - [Quote & divider](#quote-divider)\n  - [Callout variants](#callout-variants)\n  - [Code block](#code-block)\n  - [Table](#table)\n  - [Columns](#columns)\n  - [Block equation](#block-equation)\n  - [YouTube embed](#youtube-embed)\n  - [Mermaid diagram](#mermaid-diagram)\n  - [Quiz block](#quiz-block)\n  - [Flashcards block](#flashcards-block)\n\nThis note intentionally exercises every Plate feature except uploaded media nodes (img / audio / file).\n\n## Headings\n\n### Heading 3\n\n#### Heading 4\n\n##### Heading 5\n\n###### Heading 6\n\n## Text marks & styles\n\nplain · **bold** · *italic* · \u003cu>underline\u003c/u> · ~~strike~~ · `inline code` · `Ctrl`+`B` · \u003cmark>highlight\u003c/mark> · H\u003csub>2\u003c/sub>O · E=mc\u003csup>2\u003c/sup>\n\ncolored · tinted · larger · serif sample\n\nInline link: [OpenStax Biology](https://openstax.org/details/books/biology-2e) · mention @Kate Malone · inline math $\\Delta G = \\Delta H - T\\Delta S$.\n\n## Alignment\n\nLeft-aligned paragraph (default).\n\nCenter-aligned paragraph.\n\nRight-aligned paragraph.\n\nJustify-aligned paragraph: membranes separate compartments so gradients can do work across the bilayer.\n\n## Lists\n\n- Bulleted item — organelles\n\n- Bulleted item — membranes\n\n1. Numbered step — isolate the variable\n\n1. Numbered step — apply the model\n\n- [x] Todo checked — skim the matrix\n\n- [ ] Todo open — try each toolbar control\n\n## Quote & divider\n\n> “Nothing in biology makes sense except in the light of evolution.” — Theodosius Dobzhansky\n\n---\n\n## Callout variants\n\n> **Info**\n>\n> Info callout — background reading is linked above.\n\n> **Success**\n>\n> Success callout — you covered every non-media block.\n\n> **Warning**\n>\n> Warning callout — osmolarity units trip people up.\n\n> **Danger**\n>\n> Danger callout — do not confuse lysis with crenation.\n\n## Code block\n\n```python\ndef atp_yield(glucose_mol: float) -> float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\n```\n\n## Table\n\n| Process | Location | ATP net |\n| --- | --- | --- |\n| Glycolysis | Cytosol | 2 |\n| Krebs cycle | Mitochondrial matrix | 2 |\n| ETC / oxidative phosphorylation | Inner membrane | ~28 |\n\n## Columns\n\n**Column 1**\n\n**Two-column left** — structure.\n\n**Column 2**\n\n**Two-column right** — function.\n\n**Column 1**\n\nProkaryote\n\n**Column 2**\n\nEukaryote animal\n\n**Column 3**\n\nEukaryote plant\n\n**Column 1**\n\nWide column: endosymbiotic origin of mitochondria.\n\n**Column 2**\n\nNarrow: DNA circular.\n\n## Block equation\n\n$$\n\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\n$$\n\n## YouTube embed\n\n[YouTube video](https://www.youtube.com/watch?v=URUJD5NEXC8)\n\n## Mermaid diagram\n\nRespiration overview\n\n```mermaid\nflowchart TB\n  Glucose --> Glycolysis\n  Glycolysis --> Pyruvate\n  Pyruvate --> Krebs\n  Krebs --> ETC\n  ETC --> ATP\n```\n\n## Quiz block\n\n### Question 1\n\nWhere does glycolysis occur? (1 mark)\n\nA. Cytosol\nB. Nucleus\nC. Golgi lumen\n\n### Question 2\n\nWhich organelles contain their own DNA? (multi) (1 mark)\n\n- [ ] Mitochondria\n- [ ] Lysosomes\n- [ ] Chloroplasts\n\n### Question 3\n\nRibosomes are present in both prokaryotes and eukaryotes. (1 mark)\n\nA. True\nB. False\n\n### Question 4\n\nThe main short-term energy carrier is ____. (1 mark)\n\n\n\nAnswer: ______________________________\n\n### Quiz answer key\n\n**1. A. Cytosol**\n\nMarking scheme (1 mark):\n- Glycolysis occurs in the cytosol of the cell.\n\nWorked solution: Glycolysis occurs in the cytosol of the cell.\n\n**2. A. Mitochondria; C. Chloroplasts**\n\nMarking scheme (1 mark):\n- Both mitochondria and chloroplasts have their own DNA.\n\nWorked solution: Both mitochondria and chloroplasts have their own DNA.\n\n**3. True**\n\nMarking scheme (1 mark):\n- True — ribosomes are not membrane-bound.\n\nWorked solution: True — ribosomes are not membrane-bound.\n\n**4. ATP / adenosine triphosphate**\n\nMarking scheme (1 mark):\n- ATP is the cell’s short-term energy currency.\n\nWorked solution: ATP is the cell’s short-term energy currency.\n\n## Flashcards block\n\n### Card 1\n\n**Front:** What does ATP stand for?\n\n**Back:** Adenosine triphosphate — cellular energy currency\n\n### Card 2\n\n**Front:** Define osmosis\n\n**Back:** Diffusion of water across a semi-permeable membrane\n\nEnd of matrix. Media uploads (`img` / `audio` / `file`) are omitted on purpose.\n\n"},"source":{"html":"\u003cpre class=\"source\"># Editor feature matrix\n\n- [Editor feature matrix](#editor-feature-matrix)\n  - [Headings](#headings)\n    - [Heading 3](#heading-3)\n      - [Heading 4](#heading-4)\n        - [Heading 5](#heading-5)\n          - [Heading 6](#heading-6)\n  - [Text marks &amp; styles](#text-marks-styles)\n  - [Alignment](#alignment)\n  - [Lists](#lists)\n  - [Quote &amp; divider](#quote-divider)\n  - [Callout variants](#callout-variants)\n  - [Code block](#code-block)\n  - [Table](#table)\n  - [Columns](#columns)\n  - [Block equation](#block-equation)\n  - [YouTube embed](#youtube-embed)\n  - [Mermaid diagram](#mermaid-diagram)\n  - [Quiz block](#quiz-block)\n  - [Flashcards block](#flashcards-block)\n\nThis note intentionally exercises every Plate feature except uploaded media nodes (img / audio / file).\n\n## Headings\n\n### Heading 3\n\n#### Heading 4\n\n##### Heading 5\n\n###### Heading 6\n\n## Text marks &amp; styles\n\nplain · **bold** · *italic* · &lt;u&gt;underline&lt;/u&gt; · ~~strike~~ · `inline code` · `Ctrl`+`B` · &lt;mark&gt;highlight&lt;/mark&gt; · H&lt;sub&gt;2&lt;/sub&gt;O · E=mc&lt;sup&gt;2&lt;/sup&gt;\n\ncolored · tinted · larger · serif sample\n\nInline link: [OpenStax Biology](https://openstax.org/details/books/biology-2e) · mention @Kate Malone · inline math $\\Delta G = \\Delta H - T\\Delta S$.\n\n## Alignment\n\nLeft-aligned paragraph (default).\n\nCenter-aligned paragraph.\n\nRight-aligned paragraph.\n\nJustify-aligned paragraph: membranes separate compartments so gradients can do work across the bilayer.\n\n## Lists\n\n- Bulleted item — organelles\n\n- Bulleted item — membranes\n\n1. Numbered step — isolate the variable\n\n1. Numbered step — apply the model\n\n- [x] Todo checked — skim the matrix\n\n- [ ] Todo open — try each toolbar control\n\n## Quote &amp; divider\n\n&gt; “Nothing in biology makes sense except in the light of evolution.” — Theodosius Dobzhansky\n\n---\n\n## Callout variants\n\n&gt; **Info**\n&gt;\n&gt; Info callout — background reading is linked above.\n\n&gt; **Success**\n&gt;\n&gt; Success callout — you covered every non-media block.\n\n&gt; **Warning**\n&gt;\n&gt; Warning callout — osmolarity units trip people up.\n\n&gt; **Danger**\n&gt;\n&gt; Danger callout — do not confuse lysis with crenation.\n\n## Code block\n\n```python\ndef atp_yield(glucose_mol: float) -&gt; float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\n```\n\n## Table\n\n| Process | Location | ATP net |\n| --- | --- | --- |\n| Glycolysis | Cytosol | 2 |\n| Krebs cycle | Mitochondrial matrix | 2 |\n| ETC / oxidative phosphorylation | Inner membrane | ~28 |\n\n## Columns\n\n**Column 1**\n\n**Two-column left** — structure.\n\n**Column 2**\n\n**Two-column right** — function.\n\n**Column 1**\n\nProkaryote\n\n**Column 2**\n\nEukaryote animal\n\n**Column 3**\n\nEukaryote plant\n\n**Column 1**\n\nWide column: endosymbiotic origin of mitochondria.\n\n**Column 2**\n\nNarrow: DNA circular.\n\n## Block equation\n\n$$\n\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\n$$\n\n## YouTube embed\n\n[YouTube video](https://www.youtube.com/watch?v=URUJD5NEXC8)\n\n## Mermaid diagram\n\nRespiration overview\n\n```mermaid\nflowchart TB\n  Glucose --&gt; Glycolysis\n  Glycolysis --&gt; Pyruvate\n  Pyruvate --&gt; Krebs\n  Krebs --&gt; ETC\n  ETC --&gt; ATP\n```\n\n## Quiz block\n\n### Question 1\n\nWhere does glycolysis occur? (1 mark)\n\ code-block)\n  - [Table](#table)\n  - [Columns](#columns)\n  - [Block equation](#block-equation)\n  - [YouTube embed](#youtube-embed)\n  - [Mermaid diagram](#mermaid-diagram)\n  - [Quiz block](#quiz-block)\n  - [Flashcards block](#flashcards-block)\n\nThis note intentionally exercises every Plate feature except uploaded media nodes (img / audio / file).\n\n## Headings\n\n### Heading 3\n\n#### Heading 4\n\n##### Heading 5\n\n###### Heading 6\n\n## Text marks & styles\n\nplain · **bold** · *italic* · \u003cu>underline\u003c/u> · ~~strike~~ · `inline code` · `Ctrl`+`B` · \u003cmark>highlight\u003c/mark> · H\u003csub>2\u003c/sub>O · E=mc\u003csup>2\u003c/sup>\n\ncolored · tinted · larger · serif sample\n\nInline link: [OpenStax Biology](https://openstax.org/details/books/biology-2e) · mention @Kate Malone · inline math $\\Delta G = \\Delta H - T\\Delta S$.\n\n## Alignment\n\nLeft-aligned paragraph (default).\n\nCenter-aligned paragraph.\n\nRight-aligned paragraph.\n\nJustify-aligned paragraph: membranes separate compartments so gradients can do work across the bilayer.\n\n## Lists\n\n- Bulleted item — organelles\n\n- Bulleted item — membranes\n\n1. Numbered step — isolate the variable\n\n1. Numbered step — apply the model\n\n- [x] Todo checked — skim the matrix\n\n- [ ] Todo open — try each toolbar control\n\n## Quote & divider\n\n> “Nothing in biology makes sense except in the light of evolution.” — Theodosius Dobzhansky\n\n---\n\n## Callout variants\n\n> **Info**\n>\n> Info callout — background reading is linked above.\n\n> **Success**\n>\n> Success callout — you covered every non-media block.\n\n> **Warning**\n>\n> Warning callout — osmolarity units trip people up.\n\n> **Danger**\n>\n> Danger callout — do not confuse lysis with crenation.\n\n## Code block\n\n```python\ndef atp_yield(glucose_mol: float) -> float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\n```\n\n## Table\n\n| Process | Location | ATP net |\n| --- | --- | --- |\n| Glycolysis | Cytosol | 2 |\n| Krebs cycle | Mitochondrial matrix | 2 |\n| ETC / oxidative phosphorylation | Inner membrane | ~28 |\n\n## Columns\n\n**Column 1**\n\n**Two-column left** — structure.\n\n**Column 2**\n\n**Two-column right** — function.\n\n**Column 1**\n\nProkaryote\n\n**Column 2**\n\nEukaryote animal\n\n**Column 3**\n\nEukaryote plant\n\n**Column 1**\n\nWide column: endosymbiotic origin of mitochondria.\n\n**Column 2**\n\nNarrow: DNA circular.\n\n## Block equation\n\n$$\n\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\n$$\n\n## YouTube embed\n\n[YouTube video](https://www.youtube.com/watch?v=URUJD5NEXC8)\n\n## Mermaid diagram\n\nRespiration overview\n\n```mermaid\nflowchart TB\n  Glucose --> Glycolysis\n  Glycolysis --> Pyruvate\n  Pyruvate --> Krebs\n  Krebs --> ETC\n  ETC --> ATP\n```\n\n## Quiz block\n\n### Question 1\n\nWhere does glycolysis occur? (1 mark)\n\nA. Cytosol\nB. Nucleus\nC. Golgi lumen\n\n**1. A. Cytosol**\n\nMarking scheme (1 mark):\n- Glycolysis occurs in the cytosol of the cell.\n\nWorked solution: Glycolysis occurs in the cytosol of the cell.\n\n### Question 2\n\nWhich organelles contain their own DNA? (multi) (1 mark)\n\n- [ ] Mitochondria\n- [ ] Lysosomes\n- [ ] Chloroplasts\n\n**2. A. Mitochondria; C. Chloroplasts**\n\nMarking scheme (1 mark):\n- Both mitochondria and chloroplasts have their own DNA.\n\nWorked solution: Both mitochondria and chloroplasts have their own DNA.\n\n### Question 3\n\nRibosomes are present in both prokaryotes and eukaryotes. (1 mark)\n\nA. True\nB. False\n\n**3. True**\n\nMarking scheme (1 mark):\n- True — ribosomes are not membrane-bound.\n\nWorked solution: True — ribosomes are not membrane-bound.\n\n### Question 4\n\nThe main short-term energy carrier is ____. (1 mark)\n\n\n\nAnswer: ______________________________\n\n**4. ATP / adenosine triphosphate**\n\nMarking scheme (1 mark):\n- ATP is the cell’s short-term energy currency.\n\nWorked solution: ATP is the cell’s short-term energy currency.\n\n## Flashcards block\n\n| Front | Back |\n| --- | --- |\n| What does ATP stand for? | Adenosine triphosphate — cellular energy currency |\n| Define osmosis | Diffusion of water across a semi-permeable membrane |\n\nEnd of matrix. Media uploads (`img` / `audio` / `file`) are omitted on purpose.\n\n"}},"worksheet":{"docx":{"html":"\u003ch1 id=\"editor-feature-matrix\">Editor feature matrix\u003c/h1>\u003cnav class=\"toc\" aria-label=\"Document contents\">\u003ca style=\"padding-left:0px\" href=\"#editor-feature-matrix\">Editor feature matrix\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#headings\">Headings\u003c/a>\u003ca style=\"padding-left:18px\" href=\"#heading-3\">Heading 3\u003c/a>\u003ca style=\"padding-left:27px\" href=\"#heading-4\">Heading 4\u003c/a>\u003ca style=\"padding-left:36px\" href=\"#heading-5\">Heading 5\u003c/a>\u003ca style=\"padding-left:45px\" href=\"#heading-6\">Heading 6\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#text-marks-styles\">Text marks &amp; styles\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#alignment\">Alignment\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#lists\">Lists\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#quote-divider\">Quote &amp; divider\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#callout-variants\">Callout variants\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#code-block\">Code block\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#table\">Table\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#columns\">Columns\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#block-equation\">Block equation\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#youtube-embed\">YouTube embed\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#mermaid-diagram\">Mermaid diagram\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#quiz-block\">Quiz block\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#flashcards-block\">Flashcard Danger**\n>\n> Danger callout — do not confuse lysis with crenation.\n\n## Code block\n\n```python\ndef atp_yield(glucose_mol: float) -> float:\n    \"\"\"Rough aerobic yield (~30-32 ATP / glucose).\"\"\"\n    return glucose_mol * 30\n```\n\n## Table\n\n| Process | Location | ATP net |\n| --- | --- | --- |\n| Glycolysis | Cytosol | 2 |\n| Krebs cycle | Mitochondrial matrix | 2 |\n| ETC / oxidative phosphorylation | Inner membrane | ~28 |\n\n## Columns\n\n**Column 1**\n\n**Two-column left** — structure.\n\n**Column 2**\n\n**Two-column right** — function.\n\n**Column 1**\n\nProkaryote\n\n**Column 2**\n\nEukaryote animal\n\n**Column 3**\n\nEukaryote plant\n\n**Column 1**\n\nWide column: endosymbiotic origin of mitochondria.\n\n**Column 2**\n\nNarrow: DNA circular.\n\n## Block equation\n\n$$\n\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\n$$\n\n## YouTube embed\n\n[YouTube video](https://www.youtube.com/watch?v=URUJD5NEXC8)\n\n## Mermaid diagram\n\nRespiration overview\n\n```mermaid\nflowchart TB\n  Glucose --> Glycolysis\n  Glycolysis --> Pyruvate\n  Pyruvate --> Krebs\n  Krebs --> ETC\n  ETC --> ATP\n```\n\n## Quiz block\n\n### Question 1\n\nWhere does glycolysis occur? (1 mark)\n\nA. Cytosol\nB. Nucleus\nC. Golgi lumen\n\nAnswer: ______________________________\n\n### Question 2\n\nWhich organelles contain their own DNA? (multi) (1 mark)\n\n- [ ] Mitochondria\n- [ ] Lysosomes\n- [ ] Chloroplasts\n\nAnswer: ______________________________\n\n### Question 3\n\nRibosomes are present in both prokaryotes and eukaryotes. (1 mark)\n\nA. True\nB. False\n\nAnswer: ______________________________\n\n### Question 4\n\nThe main short-term energy carrier is ____. (1 mark)\n\n\n\nAnswer: ______________________________\n\n## Flashcards block\n\n### Card 1\n\n**Front:** What does ATP stand for?\n\nRecall: ______________________________\n\n### Card 2\n\n**Front:** Define osmosis\n\nRecall: ______________________________\n\nEnd of matrix. Media uploads (`img` / `audio` / `file`) are omitted on purpose.\n\n## Answers\n\n### Quiz\n\n**1. A. Cytosol**\n\nMarking scheme (1 mark):\n- Glycolysis occurs in the cytosol of the cell.\n\nWorked solution: Glycolysis occurs in the cytosol of the cell.\n\n**2. A. Mitochondria; C. Chloroplasts**\n\nMarking scheme (1 mark):\n- Both mitochondria and chloroplasts have their own DNA.\n\nWorked solution: Both mitochondria and chloroplasts have their own DNA.\n\n**3. True**\n\nMarking scheme (1 mark):\n- True — ribosomes are not membrane-bound.\n\nWorked solution: True — ribosomes are not membrane-bound.\n\n**4. ATP / adenosine triphosphate**\n\nMarking scheme (1 mark):\n- ATP is the cell’s short-term energy currency.\n\nWorked solution: ATP is the cell’s short-term energy currency.\n\n### Flashcards\n\n**1. What does ATP stand for?**\n\nAdenosine triphosphate — cellular energy currency\n\n**2. Define osmosis**\n\nDiffusion of water across a semi-permeable membrane\n\n"},"markdown":{"html":"\u003ch1 id=\"editor-feature-matrix\">Editor feature matrix\u003c/h1>\u003cnav class=\"toc\" aria-label=\"Document contents\">\u003ca style=\"padding-left:0px\" href=\"#editor-feature-matrix\">Editor feature matrix\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#headings\">Headings\u003c/a>\u003ca style=\"padding-left:18px\" href=\"#heading-3\">Heading 3\u003c/a>\u003ca style=\"padding-left:27px\" href=\"#heading-4\">Heading 4\u003c/a>\u003ca style=\"padding-left:36px\" href=\"#heading-5\">Heading 5\u003c/a>\u003ca style=\"padding-left:45px\" href=\"#heading-6\">Heading 6\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#text-marks-styles\">Text marks &amp; styles\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#alignment\">Alignment\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#lists\">Lists\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#quote-divider\">Quote &amp; divider\u003c/a>\u003ca style=\"padding-left:9px\" href=\"#callout-variants\">Callout vari ir own DNA.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>3. True\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>True — ribosomes are not membrane-bound.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>True — ribosomes are not membrane-bound.\u003c/p>\u003c/div>\u003cdiv class=\"answer\">\u003cp>\u003cb>4. ATP / adenosine triphosphate\u003c/b>\u003c/p>\u003cp>\u003csmall>Marking scheme · 1 mark\u003c/small>\u003cbr>ATP is the cell’s short-term energy currency.\u003c/p>\u003cp>\u003csmall>Worked solution\u003c/small>\u003cbr>ATP is the cell’s short-term energy currency.\u003c/p>\u003c/div>\u003ch3>Flashcards\u003c/h3>\u003cp>\u003cb>1. What does ATP stand for?\u003c/b>\u003cbr>Adenosine triphosphate — cellular energy currency\u003c/p>\u003cp>\u003cb>2. Define osmosis\u003c/b>\u003cbr>Diffusion of water across a semi-permeable membrane\u003c/p>\u003c/section>","className":"paper md","status":"Markdown rendering mock · Math, Mermaid and inline HTML support depends on the reader. Fonts, colors and alignment are simplified.","markdown":"# Editor feature matrix\n\n- [Editor feature matrix](#editor-feature-matrix)\n  - [Headings](#headings)\n    - [Heading 3](#heading-3)\n      - [Heading 4](#heading-4)\n        - [Heading 5](#heading-5)\n          - [Heading 6](#heading-6)\n  - [Text marks & styles](#text-marks-styles)\n  - [Alignment](#alignment)\n  - [Lists](#lists)\n  - [Quote & divider](#quote-divider)\n  - [Callout variants](#callout-variants)\n  - [Code block](#code-block)\n  - [Table](#table)\n  - [Columns](#columns)\n  - [Block equation](#block-equation)\n  - [YouTube embed](#youtube-embed)\n  - [Mermaid diagram](#mermaid-diagram)\n  - [Quiz block](#quiz-block)\n  - [Flashcards block](#flashcards-block)\n\nThis note intentionally exercises every Plate feature except uploaded media nodes (img / audio / file).\n\n## Headings\n\n### Heading 3\n\n#### Heading 4\n\n##### Heading 5\n\n###### Heading 6\n \n\nNarrow: DNA circular.\n\n## Block equation\n\n$$\n\\mathrm{C_6H_{12}O_6} + 6\\,\\mathrm{O_2} \\rightarrow 6\\,\\mathrm{CO_2} + 6\\,\\mathrm{H_2O} + \\text{ATP}\n$$\n\n## YouTube embed\n\n[YouTube video](https://www.youtube.com/watch?v=URUJD5NEXC8)\n\n## Mermaid diagram\n\nRespiration overview\n\n```mermaid\nflowchart TB\n  Glucose --> Glycolysis\n  Glycolysis --> Pyruvate\n  Pyruvate --> Krebs\n  Krebs --> ETC\n  ETC --> ATP\n```\n\n## Quiz block\n\n### Question 1\n\nWhere does glycolysis occur? (1 mark)\n\nA. Cytosol\nB. Nucleus\nC. Golgi lumen\n\nAnswer: ______________________________\n\n### Question 2\n\nWhich organelles contain their own DNA? (multi) (1 mark)\n\n- [ ] Mitochondria\n- [ ] Lysosomes\n- [ ] Chloroplasts\n\nAnswer: ______________________________\n\n### Question 3\n\nRibosomes are present in both prokaryotes and eukaryotes. (1 mark)\n\nA. True\nB. False\n\nAnswer: ______________________________\n\n### Question 4\n\nThe main short-term energy carrier is ____. (1 mark)\n\n\n\nAnswer: ______________________________\n\n## Flashcards block\n\n### Card 1\n\n**Front:** What does ATP stand for?\n\nRecall: ______________________________\n\n### Card 2\n\n**Front:** Define osmosis\n\nRecall: ______________________________\n\nEnd of matrix. Media uploads (`img` / `audio` / `file`) are omitted on purpose.\n\n## Answers\n\n### Quiz\n\n**1. A. Cytosol**\n\nMarking scheme (1 mark):\n- Glycolysis occurs in the cytosol of the cell.\n\nWorked solution: Glycolysis occurs in the cytosol of the cell.\n\n**2. A. Mitochondria; C. Chloroplasts**\n\nMarking scheme (1 mark):\n- Both mitochondria and chloroplasts have their own DNA.\n\nWorked solution: Both mitochondria and chloroplasts have their own DNA.\n\n**3. True**\n\nMarking scheme (1 mark):\n- True — ribosomes are not membrane-bound.\n\nWorked solution: True — ribosomes are not membrane-bound.\n\n**4. ATP / adenosine triphosphate**\n\nMarking scheme (1 mark):\n- ATP is the cell’s short-term energy currency.\n\nWorke
