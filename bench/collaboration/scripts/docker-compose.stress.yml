# Layered on deploy/docker-compose.e2e.yml by stress.ts (E2E_COMPOSE_OVERRIDES).
# The e2e stack's memory blob store hands out memory:// URLs, which the
# collaboration service cannot fetch, so an Office room cannot load there.
# This points the server's B2 client at fake-s3.mjs. The server only accepts
# https://*.backblazeb2.com endpoints, so the fake answers under such a name
# inside the network, with a throwaway certificate stress.ts creates
# (STRESS_TLS_DIR) that the server and the collaboration service trust. It runs
# on the stock Node image (the collaboration image is Rust, with no Node).
services:
  s3:
    image: node:22-alpine
    command: ["node", "/stress/fake-s3.mjs"]
    volumes:
      - ${STRESS_FAKE_S3:?set by stress.ts}:/stress/fake-s3.mjs:ro
      - ${STRESS_TLS_DIR:?set by stress.ts}:/stress/tls:ro
    networks:
      default:
        aliases:
          - s3.stress.backblazeb2.com
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/capy"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    environment:
      BLOB_BACKEND: b2
      B2_ENDPOINT: https://s3.stress.backblazeb2.com:9443
      B2_REGION: us-west-000
      B2_BUCKET: capy
      B2_KEY_ID: stress
      B2_APP_KEY: stress
      B2_FORCE_PATH_STYLE: "true"
      SSL_CERT_FILE: /stress/tls/cert.pem
    volumes:
      - ${STRESS_TLS_DIR:?set by stress.ts}:/stress/tls:ro
    depends_on:
      s3:
        condition: service_healthy

  collaboration:
    environment:
      SSL_CERT_FILE: /stress/tls/cert.pem
      # Every peer is u_owner on one machine: one update allowance, one open
      # budget (step 1 answers) and one client address for all of them, and
      # past 22 joined channels a join would close the oldest.
      COLLABORATION_UPDATE_BURST: "100000000"
      COLLABORATION_UPDATES_PER_SECOND: "1000000"
      COLLABORATION_UPDATE_BURST_BYTES: "107374182400"
      COLLABORATION_UPDATE_BYTES_PER_SECOND: "10737418240"
      COLLABORATION_OPEN_BYTES: "107374182400"
      COLLABORATION_OPEN_REFILL_SECONDS: "1"
      COLLABORATION_SOCKETS_PER_ADDRESS: "100000"
      COLLABORATION_JOINED_PER_USER: "100000"
      COLLABORATION_CONNECTIONS_PER_DOCUMENT: "100000"
    volumes:
      - ${STRESS_TLS_DIR:?set by stress.ts}:/stress/tls:ro
