<!doctype html>
<html data-style="classroom" data-theme="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mermaid render measurement</title>
  </head>
  <body>
    <div id="out" style="width: 760px"></div>
    <script type="module">
      // Results are collected by mermaid-probe.mjs.
      import "/src/styles/tailwind.css";
      import { drawOnPage, renderMermaid } from "/src/features/materials/Mermaid.tsx";
      import { nearLimitFlowchart, nearLimitMindmap } from "/src/mocks/nearLimits.ts";

      const sources = {
        "near-flowchart": nearLimitFlowchart(),
        "near-mindmap": nearLimitMindmap(),
      };
      let tasks = [];
      let maxGap = 0;
      let last = performance.now();
      new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) tasks.push(entry.duration);
      }).observe({ type: "longtask" });
      const tick = (now) => {
        maxGap = Math.max(maxGap, now - last);
        last = now;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

      let runs = 0;
      // "page" draws as mermaid did before the worker; "worker" is the app's path.
      window.mermaidProbe = async (where, name) => {
        // A unique comment line, so no run is a cache hit.
        const code = `%% run ${++runs} ${Math.random()}\n${sources[name] ?? name}`;
        tasks = [];
        maxGap = 0;
        last = performance.now();
        const start = performance.now();
        const drawn =
          where === "page"
            ? await drawOnPage(code, "linearLight", 760)
            : await renderMermaid(code, "linearLight", { width: 760 });
        const drawnAt = performance.now();
        document.getElementById("out").innerHTML = drawn.svg;
        await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
        const insertMs = performance.now() - drawnAt;
        // Long tasks are reported after they end.
        await new Promise((done) => setTimeout(done, 300));
        return {
          drawMs: drawnAt - start,
          insertMs,
          longestTaskMs: Math.max(0, ...tasks),
          maxFrameGapMs: maxGap,
          svgKB: drawn.svg.length / 1024,
        };
      };
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
