# Layered on docker-compose.yml for a diagnostic step only: Postgres records
# each statement's execution and planning time (pg_stat_statements), which
# production does not load. Read with statements.sql after a step.
services:
  db:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_planning=on
