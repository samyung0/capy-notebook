# The Rust collaboration server (replaced the Node `collaboration/` package).
# Design and the behaviour checklist: capy-harness/2026-10-06-rust-round/rust-core/DESIGN.md.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
items = { path = "crates/items" }
notes = { path = "crates/notes" }
sources = { path = "crates/sources" }
ydoc = { path = "crates/ydoc" }
# One yrs for the server and the Office engines: the fork's patched copy.
yrs = { path = "../vendor/betteroffice/third_party/yrs" }
serde = { version = "1", features = ["derive"] }
# Plate nodes keep their key order, as JS objects do (slate-yjs attribute order).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
deadpool-postgres = "0.14"
futures = "0.3"
hmac = "0.12"
rand = "0.9"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
uuid = { version = "1", features = ["v4"] }

# The fork's engine crates depend on `yrs = "0.27.3"` from crates.io; this
# resolves them to the same patched copy, so documents cross crate lines.
#
# `third_party/tungstenite` is tungstenite 0.29.0 from crates.io (under axum's
# WebSocket and tokio-tungstenite) with one patch, marked "Patched for Capy"
# (Epo 2026-10-11 and 2026-10-12): a socket gives back a buffer a frame past
# 64 KiB grew, written (`write_out_buffer`) or read (`read_frame`), so it does
# not keep one the size of its largest message (a live View viewer of a 2 MB
# note held about 2.3 MiB; a peer could pin up to the frame cap), and
# `WebSocket::write_buffer_capacity`/`read_buffer_capacity` read them for
# `crates/server/tests/socket_buffers.rs`, which CI runs. Carry it until
# upstream releases its buffers; re-apply it on each tungstenite upgrade.
[patch.crates-io]
yrs = { path = "../vendor/betteroffice/third_party/yrs" }
tungstenite = { path = "third_party/tungstenite" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Test binaries link with line tables only and dependencies without debug
# info: full debug info made each link take 2-3 GB, and parallel test links
# ran a developer machine out of memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"
# The room task catches a panic from yrs or the notes checks on one update
# (room.rs on_sync) and survives it; with panic = "abort" every room would
# go down instead. crates/server/src/main.rs refuses to build that way.
panic = "unwind"

# The late merge's browser WASM (scripts/build-late-merge.mjs): WASM has no
# unwinding (the worker reports a trap as a failed merge), and no debug info.
# Arithmetic overflow traps as in the native tests (yrs's decode included),
# never wraps a clock.
[profile.late-merge-wasm]
inherits = "release"
panic = "abort"
debug = false
overflow-checks = true
lto = true
codegen-units = 1
