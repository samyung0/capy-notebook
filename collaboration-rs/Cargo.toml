# The Rust collaboration server (replaces `collaboration/` at the UAT cutover).
# Design and the behaviour checklist: capy-harness/2026-10-06-rust-round/rust-core/DESIGN.md.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
notes = { path = "crates/notes" }
sources = { path = "crates/sources" }
ydoc = { path = "crates/ydoc" }
# One yrs for the server and the Office engines: the fork's patched copy.
yrs = { path = "../vendor/betteroffice/third_party/yrs", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
# Plate nodes keep their key order, as JS objects do (slate-yjs attribute order).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
deadpool-postgres = "0.14"
futures = "0.3"
hmac = "0.12"
rand = "0.9"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
uuid = { version = "1", features = ["v4"] }

# The fork's engine crates depend on `yrs = "0.27.3"` from crates.io; this
# resolves them to the same patched copy, so documents cross crate lines.
[patch.crates-io]
yrs = { path = "../vendor/betteroffice/third_party/yrs" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
debug = "line-tables-only"
