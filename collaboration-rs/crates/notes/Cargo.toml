[package]
name = "notes"
description = "Pure functions over a note's yrs document: Plate projection, limits, edit commands, children, questions, markdown."
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Standalone until rust-core's workspace skeleton lands; then the workspace
# owns these versions.
[workspace]

[dependencies]
# Plate nodes keep their key order, as JS objects do: it is the order
# slate-yjs writes attributes in.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
yrs = { path = "../../../vendor/betteroffice/third_party/yrs" }

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
