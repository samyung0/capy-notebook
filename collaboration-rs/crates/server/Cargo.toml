[package]
name = "server"
description = "The Capy collaboration server: transport, rooms, persistence, internal commands."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "capy-collaboration"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
deadpool-postgres.workspace = true
futures.workspace = true
hmac.workspace = true
items.workspace = true
notes.workspace = true
rand.workspace = true
redis.workspace = true
reqwest.workspace = true
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sources.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
ydoc.workspace = true
yrs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.10"

[dev-dependencies]
# Reads the notes corpus for the Undo cost calibration (`edits.rs`).
flate2 = "1"
sentry = { workspace = true, features = ["test"] }
# Paused time for the send-stall test (`seats.rs`).
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
