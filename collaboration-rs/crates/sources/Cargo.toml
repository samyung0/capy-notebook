[package]
name = "sources"
description = "Office and text source rooms over the fork's native Office engines: saves, effects, update checks, handoff inputs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A stand-in engine child for the pool tests: the real dispatcher plus test
# methods (sleep, crash, allocate). Not shipped: the server binary's `engine`
# subcommand calls `sources::engine::serve`.
[[bin]]
name = "sources-test-engine"
path = "tests/support/test_engine.rs"
test = false
doc = false

[dependencies]
base64.workspace = true
cpu-time = "1"
deadpool-postgres.workspace = true
indexmap = "2"
memory-stats = "1"
notes.workspace = true
office-service = { package = "betteroffice-office-service", path = "../../../vendor/betteroffice/crates/office-service" }
# Page 1 as the browser draws it (`render`): the fork's layout engines and
# rasterizers, in engine processes only.
betteroffice-xlsx = { path = "../../../vendor/betteroffice/crates/betteroffice-xlsx", default-features = false }
docx-edit = { package = "betteroffice-docx-edit", path = "../../../vendor/betteroffice/crates/docx-edit" }
docx-layout = { package = "betteroffice-docx-layout", path = "../../../vendor/betteroffice/crates/docx-layout" }
docx-parse = { package = "betteroffice-docx-parse", path = "../../../vendor/betteroffice/crates/docx-parse", default-features = false }
docx-raster = { package = "betteroffice-docx-raster", path = "../../../vendor/betteroffice/crates/docx-raster" }
image = { version = "0.25", default-features = false, features = ["png"] }
ooxml-text = { package = "betteroffice-ooxml-text", path = "../../../vendor/betteroffice/crates/ooxml-text" }
pptx-edit = { package = "betteroffice-pptx-edit", path = "../../../vendor/betteroffice/crates/pptx-edit" }
pptx-raster = { package = "betteroffice-pptx-raster", path = "../../../vendor/betteroffice/crates/pptx-raster" }
pptx-render = { package = "betteroffice-pptx-render", path = "../../../vendor/betteroffice/crates/pptx-render" }
xlsx-raster = { package = "betteroffice-xlsx-raster", path = "../../../vendor/betteroffice/crates/xlsx-raster" }
# libwebp, the encoder the browser's canvas captures with (lossy, quality 60).
webp = { version = "0.3", default-features = false }
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
unicode-script = "0.5"
ydoc.workspace = true
yrs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.10"

[dev-dependencies]
axum.workspace = true
futures.workspace = true

[lints]
workspace = true
