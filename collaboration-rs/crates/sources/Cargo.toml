[package]
name = "sources"
description = "Office and text source rooms over the fork's native Office engines: saves, effects, update checks, handoff inputs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A stand-in engine child for the pool tests: the real dispatcher plus test
# methods (sleep, crash, allocate). Not shipped: the server binary's `engine`
# subcommand calls `sources::engine::serve`.
[[bin]]
name = "sources-test-engine"
path = "tests/support/test_engine.rs"
test = false
doc = false

[dependencies]
base64 = "0.22"
cpu-time = "1"
deadpool-postgres = "0.14"
indexmap = "2"
memory-stats = "1"
notes.workspace = true
redis = { version = "1", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
office-service = { package = "betteroffice-office-service", path = "../../../vendor/betteroffice/crates/office-service" }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
unicode-script = "0.5"
ydoc.workspace = true
yrs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.10"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "test-util"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[lints]
workspace = true
