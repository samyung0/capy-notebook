[package]
name = "sources"
description = "Office and text source rooms over the fork's native Office engines: saves, effects, update checks, handoff inputs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A stand-in engine child for the pool tests: the real dispatcher plus test
# methods (sleep, crash, allocate). Not shipped: the server binary's `engine`
# subcommand calls `sources::engine::serve`.
[[bin]]
name = "sources-test-engine"
path = "tests/support/test_engine.rs"
test = false
doc = false

[dependencies]
base64.workspace = true
cpu-time = "1"
deadpool-postgres.workspace = true
indexmap = "2"
memory-stats = "1"
notes.workspace = true
office-service = { package = "betteroffice-office-service", path = "../../../vendor/betteroffice/crates/office-service" }
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
unicode-script = "0.5"
ydoc.workspace = true
yrs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.10"

[dev-dependencies]
axum.workspace = true
futures.workspace = true

[lints]
workspace = true
