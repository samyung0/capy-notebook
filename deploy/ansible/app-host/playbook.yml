---
- name: Configure the app host service link, firewall, SSH and deploy command
  hosts: all
  become: true
  vars:
    app_wireguard_interface: wg0
    app_wireguard_listen_port: 51820
    app_wireguard_service_ports:
      - "5432"
      - "6379"
    # The interface the internet reaches this host on.
    app_public_interface: "{{ ansible_default_ipv4.interface }}"
    # Container networks allowed to reach the host (see the ufw task below).
    app_docker_host_networks: ["10.0.0.0/16", "fdda:ad28:f840::/64"]

  pre_tasks:
    - name: Refuse incomplete WireGuard configuration
      ansible.builtin.assert:
        that:
          - app_wireguard_peer_public_key | default('') | length > 20
          - app_wireguard_peer_endpoint | default('') is match('^[^:]+:[0-9]+$')
          - app_wireguard_peer_public_ip | default('') is match('^[0-9.]+$')
          - app_wireguard_address | default('') is match('^[0-9.]+/[0-9]+$')
          - app_wireguard_peer_address | default('') is match('^[0-9.]+/[0-9]+$')
        fail_msg: Fill the WireGuard peer values in inventory.yml first.
      tags: [firewall]

    # One bare public key, so the variable can add neither options nor a
    # second line to the deploy user's authorized_keys.
    - name: Refuse a malformed deploy key
      ansible.builtin.assert:
        that:
          - app_deploy_ssh_public_key | default('') is match('^ssh-ed25519 [A-Za-z0-9+/]+=* [A-Za-z0-9._@-]+$')
        fail_msg: Set app_deploy_ssh_public_key in inventory.yml to the CI deploy key's public half.
      tags: [deploy]

  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the WireGuard configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check for an existing WireGuard private key
      ansible.builtin.stat:
        path: /etc/wireguard/privatekey
      register: app_wireguard_private_key_stat

    - name: Create the WireGuard private key once
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > /etc/wireguard/privatekey
        creates: /etc/wireguard/privatekey
      no_log: true

    - name: Read the WireGuard private key
      ansible.builtin.slurp:
        src: /etc/wireguard/privatekey
      register: app_wireguard_private_key_file
      no_log: true
      when: app_wireguard_private_key_stat.stat.exists or not ansible_check_mode

    - name: Configure the private service link
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "/etc/wireguard/{{ app_wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart WireGuard
      when: app_wireguard_private_key_stat.stat.exists or not ansible_check_mode

    # ufw is this host's only inbound firewall. It denies by default (below)
    # and opens only SSH on 22, to all (restricting it is not decided), and
    # WireGuard from the ingest host. ufw's built-in rules keep loopback and
    # established traffic, so cloudflared, which only connects out, still
    # reaches sshd and the stack's ports published on 127.0.0.1. ufw never
    # sees Docker-published ports: Docker forwards them before ufw's chains
    # run. The database, Redis and gateway are also published on the
    # WireGuard address, for the ingest host (GitHub runners reach the
    # database by SSH through the ingest host); any port published on the
    # public interface is dropped in DOCKER-USER below.
    # Containers run as their own users on one kernel; with scope 1 a process
    # can trace only its own descendants, as on the ingest host.
    - name: Restrict ptrace to descendants
      ansible.posix.sysctl:
        name: kernel.yama.ptrace_scope
        value: "1"
        sysctl_file: /etc/sysctl.d/60-capy-ptrace.conf
        state: present
        reload: true
      tags: [sysctl]

    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [firewall]

    - name: Keep SSH open to all
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        comment: SSH, key-only
      tags: [firewall]

    - name: Allow WireGuard only from the ingest host
      community.general.ufw:
        rule: allow
        direction: in
        proto: udp
        from_ip: "{{ app_wireguard_peer_public_ip }}"
        to_port: "{{ app_wireguard_listen_port }}"
        comment: Capy Notebook ingest-host private service link
      tags: [firewall]

    # Containers reach the host itself (Coolify's sentinel pushes to the
    # host's published port 8000 through Docker's userland proxy, which ufw's
    # input rules see). Docker allocates its /24 networks from the start of
    # its 10.0.0.0/8 pool, so 10.0.0.0/16 covers them without the WireGuard
    # link's addresses, which sit elsewhere in 10/8. The IPv6 range is
    # Coolify's own network on this host (Epo 2026-10-20). Only Coolify needs
    # it: it goes once Coolify is removed from the host (runbook §1.1).
    - name: Allow Docker networks to reach the host
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ item }}"
        comment: Docker networks to the host
      loop: "{{ app_docker_host_networks }}"
      tags: [firewall]

    - name: Stop the unused native PostgreSQL cluster
      ansible.builtin.systemd_service:
        name: postgresql@16-main
        enabled: false
        state: stopped
      when: app_retire_native_postgresql | default(false)

    - name: Prevent the old PostgreSQL cluster from starting automatically
      ansible.builtin.copy:
        dest: /etc/postgresql/16/main/start.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          manual
        backup: true
      when: app_retire_native_postgresql | default(false)
      notify: Reload systemd

    - name: Disable the unused native PostgreSQL service
      ansible.builtin.systemd_service:
        name: postgresql
        enabled: false
        state: stopped
      when: app_retire_native_postgresql | default(false)

    - name: Remove public PostgreSQL access
      community.general.ufw:
        rule: allow
        port: "5432"
        proto: tcp
        delete: true
      when: app_retire_native_postgresql | default(false)
      tags: [firewall]

    - name: Remove the obsolete alternate PostgreSQL port
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ app_wireguard_interface }}"
        proto: tcp
        from_ip: "{{ app_wireguard_peer_address | regex_replace('/.*$', '') }}"
        to_ip: "{{ app_wireguard_address | regex_replace('/.*$', '') }}"
        to_port: "55432"
        delete: true
      tags: [firewall]

    - name: Allow ingest-host access to private app services
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ app_wireguard_interface }}"
        proto: tcp
        from_ip: "{{ app_wireguard_peer_address | regex_replace('/.*$', '') }}"
        to_ip: "{{ app_wireguard_address | regex_replace('/.*$', '') }}"
        to_port: "{{ item }}"
        comment: Capy Notebook ingest-host private app service
      loop: "{{ app_wireguard_service_ports }}"
      tags: [firewall]

    # Docker-published ports bypass ufw, so the public interface's drop sits
    # in Docker's DOCKER-USER chain, for IPv4 (after.rules) and IPv6
    # (after6.rules). It drops every new connection from the internet into
    # any container, whatever its port or protocol, so a port a compose file
    # publishes later stays closed too; replies to the containers' own
    # outbound connections (cloudflared's tunnel among them) are not new.
    # ufw loads these files at boot and on every reload, flushing and
    # refilling the chain, and Docker keeps the chain's rules when it
    # restarts. Only the public interface matches: the WireGuard address's
    # published services, traffic between containers and the tunnel's
    # loopback hop to the proxy are untouched.
    - name: Drop new public connections into containers
      ansible.builtin.blockinfile:
        path: "/etc/ufw/{{ item }}"
        marker: "# {mark} CAPY DOCKER-USER"
        block: |
          *filter
          :DOCKER-USER - [0:0]
          -A DOCKER-USER -i {{ app_public_interface }} -m conntrack --ctstate NEW -j DROP
          COMMIT
      loop: [after.rules, after6.rules]
      notify: Reload ufw
      tags: [firewall]

    - name: Deny inbound traffic by default
      community.general.ufw:
        default: deny
        direction: incoming
      tags: [firewall]

    - name: Allow outbound traffic by default
      community.general.ufw:
        default: allow
        direction: outgoing
      tags: [firewall]

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      tags: [firewall]

    - name: Load ufw at boot
      ansible.builtin.systemd_service:
        name: ufw
        enabled: true
      tags: [firewall]

    - name: Enable the private service link
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ app_wireguard_interface }}"
        enabled: true
        state: started
      when: app_wireguard_private_key_stat.stat.exists or not ansible_check_mode

    - name: Read the app host WireGuard public key
      ansible.builtin.shell:
        cmd: wg pubkey < /etc/wireguard/privatekey
      register: app_wireguard_public_key
      changed_when: false
      check_mode: false
      when: app_wireguard_private_key_stat.stat.exists or not ansible_check_mode

    - name: Show the public key for the ingest-host peer
      ansible.builtin.debug:
        msg: "App host WireGuard public key: {{ app_wireguard_public_key.stdout }}"
      when: app_wireguard_private_key_stat.stat.exists or not ansible_check_mode

    # The deploy command (openwiki/deployment-runbook.md §1.1). CI logs in as
    # capy-deploy through the Access tunnel only (from= loopback, where
    # cloudflared connects), and the key can run nothing but the deploy
    # script through sudo: no shell, forwarding, PTY or agent. The user is
    # not in the docker group, and owns nothing it could change: its home,
    # authorized_keys, the script and /opt/capy (releases and their env
    # files) all belong to root.
    - name: Create the deploy user
      ansible.builtin.user:
        name: capy-deploy
        system: true
        shell: /bin/sh
        home: /var/lib/capy-deploy
        create_home: false
        password: "*"
        groups: ""
      tags: [deploy]

    - name: Create the deploy user's SSH directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: [/var/lib/capy-deploy, /var/lib/capy-deploy/.ssh]
      tags: [deploy]

    - name: Authorize only the deploy command for the CI key
      ansible.builtin.copy:
        dest: /var/lib/capy-deploy/.ssh/authorized_keys
        owner: root
        group: root
        mode: "0644"
        content: |
          restrict,from="127.0.0.1,::1",command="/usr/bin/sudo -n /usr/local/sbin/capy-app-deploy" {{ app_deploy_ssh_public_key }}
      tags: [deploy]

    - name: Install the deploy command
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/deploy/app-host-deploy.sh"
        dest: /usr/local/sbin/capy-app-deploy
        owner: root
        group: root
        mode: "0755"
      tags: [deploy]

    - name: Create the release directory
      ansible.builtin.file:
        path: /opt/capy
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [deploy]

    # Exactly one root command with no arguments, keeping only the forced
    # command's SSH_ORIGINAL_COMMAND; sudo resets everything else.
    - name: Let the deploy user run only the deploy command as root
      ansible.builtin.copy:
        dest: /etc/sudoers.d/capy-deploy
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          Defaults!/usr/local/sbin/capy-app-deploy env_keep = "SSH_ORIGINAL_COMMAND"
          capy-deploy ALL=(root) NOPASSWD: /usr/local/sbin/capy-app-deploy ""
      tags: [deploy]

    # Key-only SSH. Ansible connects as root with a key, so a root key must
    # already be authorized; verify a key login in a second terminal before
    # running this (openwiki/deployment-runbook.md, "Host lockdown").
    - name: Read root's authorized SSH keys
      ansible.builtin.stat:
        path: /root/.ssh/authorized_keys
      register: app_root_authorized_keys
      tags: [ssh]

    - name: Refuse key-only SSH without an authorized root key
      ansible.builtin.assert:
        that:
          - app_root_authorized_keys.stat.exists
          - app_root_authorized_keys.stat.size > 0
        fail_msg: Authorize a root SSH key and log in with it before turning password logins off.
      tags: [ssh]

    - name: Allow SSH logins with keys only
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../shared/sshd-key-only.conf"
        dest: /etc/ssh/sshd_config.d/10-capy-key-only.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
      tags: [ssh]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart WireGuard
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ app_wireguard_interface }}"
        state: restarted

    - name: Reload ufw
      community.general.ufw:
        state: reloaded

    # Both listen on "Reload SSH" and run in this order: the whole effective
    # configuration must pass `sshd -t` before sshd reloads it. A reload keeps
    # open sessions.
    - name: Check the SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      listen: Reload SSH

    - name: Reload the SSH service
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      listen: Reload SSH
