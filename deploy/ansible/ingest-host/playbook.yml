---
- name: Provision the dedicated Capy Notebook ingest host
  hosts: all
  become: true
  vars:
    ingest_hostname: capy-ingest-1
    ingest_service_user: capy-ingest
    ingest_wireguard_interface: wg0
    ingest_wireguard_listen_port: 51820

  pre_tasks:
    - name: Require an explicit watchdog stack selection
      ansible.builtin.assert:
        that:
          - ingest_watchdog_stacks is defined
          - ingest_watchdog_stacks | difference(['production', 'nonprod']) | length == 0
        fail_msg: Set ingest_watchdog_stacks to the provisioned stacks, or an empty list for host-only setup.

    - name: Refuse incomplete WireGuard configuration
      ansible.builtin.assert:
        that:
          - ingest_wireguard_peer_public_key | default('') | length > 20
          - ingest_wireguard_peer_endpoint | default('') is match('^[^:]+:[0-9]+$')
          - ingest_wireguard_address | default('') is match('^[0-9.]+/[0-9]+$')
          - ingest_wireguard_peer_address | default('') is match('^[0-9.]+/[0-9]+$')
        fail_msg: Fill the WireGuard peer values in the ignored inventory first.
      when: ingest_configure_wireguard | default(true)

  tasks:
    - name: Set the ingest host name
      ansible.builtin.hostname:
        name: "{{ ingest_hostname }}"

    - name: Install VM packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose
          - fail2ban
          - git
          - nftables
          - unattended-upgrades
          - wireguard
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the ingest service account
      ansible.builtin.user:
        name: "{{ ingest_service_user }}"
        groups: docker
        append: true
        create_home: true
        shell: /bin/bash

    - name: Install the administrator SSH key
      ansible.posix.authorized_key:
        user: "{{ ingest_service_user }}"
        key: "{{ ingest_admin_public_key | default('') }}"
        state: present
      when: ingest_admin_public_key | default('') | length > 0

    - name: Create protected service directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/capy-ingest, owner: root, group: root, mode: "0700" }
        - {
            path: /opt/capy-ingest,
            owner: "{{ ingest_service_user }}",
            group: "{{ ingest_service_user }}",
            mode: "0750",
          }
        - { path: /etc/docker, owner: root, group: root, mode: "0755" }

    - name: Configure bounded Docker logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "20m",
              "max-file": "5"
            }
          }
      notify: Restart Docker

    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Create the WireGuard private key once
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > /etc/wireguard/privatekey
        creates: /etc/wireguard/privatekey
      no_log: true
      when: ingest_configure_wireguard | default(true)

    - name: Read the WireGuard private key
      ansible.builtin.slurp:
        src: /etc/wireguard/privatekey
      register: ingest_wireguard_private_key_file
      no_log: true
      when: ingest_configure_wireguard | default(true)

    - name: Configure the private WireGuard service link
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "/etc/wireguard/{{ ingest_wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart WireGuard
      when: ingest_configure_wireguard | default(true)

    - name: Enable the WireGuard service link
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ ingest_wireguard_interface }}"
        enabled: true
        state: started
      when: ingest_configure_wireguard | default(true)

    - name: Configure the host firewall
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        validate: nft -c -f %s
      notify: Reload nftables

    - name: Enable the firewall
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # GitHub deployments own application checkouts, configuration, and containers.
    # Docker's unless-stopped policy retains those exact containers across reboots.
    - name: Inspect existing services before retiring the old launch path
      ansible.builtin.service_facts:

    - name: Refuse to replace a running legacy stack launcher
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item].state != 'running'
        fail_msg: Retire the legacy stack launcher in a planned cutover before provisioning.
      loop: [evo-ingest.service, capy-ingest.service]
      when: item in ansible_facts.services

    - name: Disable the inactive legacy stack launchers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
      loop: [evo-ingest.service, capy-ingest.service]
      when: item in ansible_facts.services

    - name: Stop legacy watchdogs
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: [evo-ingest-watchdog.service, capy-ingest-watchdog.service]
      when: item in ansible_facts.services

    - name: Remove retired launcher and watchdog units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - evo-ingest.service
        - capy-ingest.service
        - evo-ingest-watchdog.service
        - capy-ingest-watchdog.service
      notify: Reload systemd

    - name: Install the ingest parser watchdog
      ansible.builtin.copy:
        src: files/capy_ingest_watchdog.py
        dest: /usr/local/sbin/capy-ingest-watchdog
        owner: root
        group: root
        mode: "0755"
      notify: Restart ingest watchdogs

    - name: Install the per-stack parser watchdog unit
      ansible.builtin.template:
        src: capy-ingest-watchdog.service.j2
        dest: /etc/systemd/system/capy-ingest-watchdog@.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart ingest watchdogs

    - name: Enable watchdogs for the selected stacks
      ansible.builtin.systemd_service:
        name: "capy-ingest-watchdog@{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ ingest_watchdog_stacks }}"

    - name: Keep SSH password login enabled
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/90-capy-ingest.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          X11Forwarding no
      notify: Restart SSH

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    - name: Restart WireGuard
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ ingest_wireguard_interface }}"
        state: restarted
      when: ingest_configure_wireguard | default(true)

    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded

    - name: Restart ingest watchdogs
      ansible.builtin.systemd_service:
        name: "capy-ingest-watchdog@{{ item }}"
        state: restarted
        daemon_reload: true
      loop: "{{ ingest_watchdog_stacks }}"

    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
