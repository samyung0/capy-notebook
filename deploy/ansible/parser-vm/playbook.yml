---
- name: Provision the dedicated Evo parser VM
  hosts: all
  become: true
  vars:
    parser_service_user: evo-parser
    parser_repo_dir: /opt/evo-parser/app
    parser_env_path: /etc/evo-parser/parser.env
    parser_compose_file: deploy/docker-compose.parser-vm.yml
    parser_wireguard_interface: wg0
    parser_wireguard_listen_port: 51820

  pre_tasks:
    - name: Refuse incomplete WireGuard configuration
      ansible.builtin.assert:
        that:
          - parser_wireguard_peer_public_key | default('') | length > 20
          - parser_wireguard_peer_endpoint | default('') is match('^[^:]+:[0-9]+$')
          - parser_wireguard_address | default('') is match('^[0-9.]+/[0-9]+$')
          - parser_wireguard_peer_address | default('') is match('^[0-9.]+/[0-9]+$')
        fail_msg: Fill the WireGuard peer values in the encrypted inventory first.
      when: parser_configure_wireguard | default(true)

    - name: Refuse SSH hardening until an admin key is supplied
      ansible.builtin.assert:
        that:
          - not (parser_harden_ssh | default(false)) or parser_admin_public_key | default('') | length > 40
        fail_msg: Set parser_admin_public_key before enabling parser_harden_ssh.

  tasks:
    - name: Install VM packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose
          - fail2ban
          - git
          - nftables
          - unattended-upgrades
          - wireguard
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the parser service account
      ansible.builtin.user:
        name: "{{ parser_service_user }}"
        groups: docker
        append: true
        create_home: true
        shell: /bin/bash

    - name: Install the administrator SSH key
      ansible.posix.authorized_key:
        user: "{{ parser_service_user }}"
        key: "{{ parser_admin_public_key | default('') }}"
        state: present
      when: parser_admin_public_key | default('') | length > 0

    - name: Create protected service directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/evo-parser, owner: root, group: root, mode: "0700" }
        - {
            path: /opt/evo-parser,
            owner: "{{ parser_service_user }}",
            group: "{{ parser_service_user }}",
            mode: "0750",
          }
        - { path: /etc/docker, owner: root, group: root, mode: "0755" }

    - name: Configure bounded Docker logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "20m",
              "max-file": "5"
            }
          }
      notify: Restart Docker

    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Create the WireGuard private key once
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > /etc/wireguard/privatekey
        creates: /etc/wireguard/privatekey
      no_log: true
      when: parser_configure_wireguard | default(true)

    - name: Read the WireGuard private key
      ansible.builtin.slurp:
        src: /etc/wireguard/privatekey
      register: parser_wireguard_private_key_file
      no_log: true
      when: parser_configure_wireguard | default(true)

    - name: Configure the private WireGuard service link
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "/etc/wireguard/{{ parser_wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart WireGuard
      when: parser_configure_wireguard | default(true)

    - name: Enable the WireGuard service link
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ parser_wireguard_interface }}"
        enabled: true
        state: started
      when: parser_configure_wireguard | default(true)

    - name: Configure the host firewall
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        validate: nft -c -f %s
      notify: Reload nftables

    - name: Enable the firewall
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Check out the parser branch
      ansible.builtin.git:
        repo: "{{ parser_repo_url }}"
        dest: "{{ parser_repo_dir }}"
        version: "{{ parser_repo_version }}"
        update: true
        force: false
      become_user: "{{ parser_service_user }}"
      when: parser_repo_url != 'CHANGE_ME'
      notify: Restart parser stack

    - name: Write the encrypted parser environment
      ansible.builtin.copy:
        dest: "{{ parser_env_path }}"
        owner: root
        group: "{{ parser_service_user }}"
        mode: "0640"
        content: |-
          {% for key, value in parser_env | default({}) | dictsort %}
          {{ key }}={{ value }}
          {% endfor %}
      no_log: true
      when: parser_env | default({}) | length > 0
      notify: Restart parser stack

    - name: Install the parser stack systemd unit
      ansible.builtin.template:
        src: evo-parser.service.j2
        dest: /etc/systemd/system/evo-parser.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart parser stack

    - name: Enable the parser stack when code and secrets exist
      ansible.builtin.systemd_service:
        name: evo-parser
        enabled: true
        state: started
        daemon_reload: true
      when:
        - parser_repo_url != 'CHANGE_ME'
        - parser_env | default({}) | length > 0

    - name: Harden SSH only after key login has been verified separately
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/90-evo-parser.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          X11Forwarding no
      when: parser_harden_ssh | default(false)
      notify: Restart SSH

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    - name: Restart WireGuard
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ parser_wireguard_interface }}"
        state: restarted
      when: parser_configure_wireguard | default(true)

    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded

    - name: Restart parser stack
      ansible.builtin.systemd_service:
        name: evo-parser
        state: restarted
        daemon_reload: true
      when:
        - parser_repo_url != 'CHANGE_ME'
        - parser_env | default({}) | length > 0

    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
