# Managed by deploy/ansible (app-host and ingest-host playbooks).
# Key-only SSH on every host: no password or keyboard-interactive logins, and
# root logs in with a key only. sshd keeps the first value it reads, and this
# file sorts before other drop-ins (such as a cloud image's 50-cloud-init.conf)
# and the main sshd_config, so these settings win.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
