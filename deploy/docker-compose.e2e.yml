# Disposable stack for Playwright / backend access tests.
#   docker compose -f deploy/docker-compose.e2e.yml up --build -d
#   docker compose -f deploy/docker-compose.e2e.yml down -v
#
# Host ports are offset so this can run alongside the normal dev stack.

services:
  # pgvector, same as the dev stack: the baseline schema creates the extension
  # for the retrieval index, so stock postgres:16 can no longer apply it.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: capy
      POSTGRES_PASSWORD: capy
      POSTGRES_DB: capy
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-55432}:5432"
    volumes:
      - capy_e2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready can succeed against Postgres' temporary bootstrap server
      # before POSTGRES_DB has been created. Require a real query so dependent
      # services only start after initialization is complete.
      test: ["CMD-SHELL", 'psql -U capy -d capy -c "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # The collaboration server's integration tests reach it from the host.
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Fixed tags let CI prebuild both images with a layer cache and start the
  # stack without rebuilding them (E2E_PREBUILT_IMAGES in e2e/global-setup.ts).
  collaboration:
    image: capy-e2e-collaboration:local
    build:
      context: ..
      dockerfile: collaboration-rs/Dockerfile
    environment:
      API_URL: http://server:8080
      COLLABORATION_ALLOWED_ORIGINS: ${E2E_BASE_URL:-http://127.0.0.1:5174}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-e2e-collaboration-secret}
      DATABASE_URL: postgres://capy:capy@db:5432/capy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "1234"
      # Office engine processes and their memory cap, UAT's (Epo 2026-10-07).
      COLLABORATION_ENGINE_SAVE_PROCESSES: "1"
      COLLABORATION_ENGINE_BACKGROUND_PROCESSES: "1"
      COLLABORATION_ENGINE_MEMORY_LIMIT_BYTES: "3221225472"
      # The source rooms' disk store cap, UAT's (the folder is the image's).
      COLLABORATION_SOURCE_DISK_BYTES: "5368709120"
    ports:
      - "127.0.0.1:${E2E_COLLABORATION_PORT:-11234}:1234"
    # Every client socket, gateway call and database connection is a
    # descriptor; Docker's default soft limit of 1024 held the server near
    # 1,000 connections (prod Phase B). The server also raises its soft limit
    # to the hard one at startup, as Go and Node do.
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    # Its Office engine children read uploaded files (Epo 2026-10-20): no
    # capabilities and no privilege gain, as on UAT and production.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1234/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  server:
    image: capy-e2e-server:local
    build:
      context: ../server
    environment:
      DATABASE_URL: postgres://capy:capy@db:5432/capy?sslmode=disable
      ADDR: ":8080"
      MIGRATE: "true"
      BLOB_BACKEND: memory
      AUTH_DISABLED: "true"
      APP_ENV: e2e
      E2E_AUTH: "true"
      E2E_AUTH_SECRET: ${E2E_AUTH_SECRET:?E2E_AUTH_SECRET is required}
      E2E_AUTH_USER_IDS: u_owner,u_editor,u_viewer,u_other
      APP_URL: ${APP_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-e2e-collaboration-secret}
      SHARE_LINK_SECRET: ${SHARE_LINK_SECRET:?SHARE_LINK_SECRET is required}
      COLLABORATION_URL: ws://127.0.0.1:${E2E_COLLABORATION_PORT:-11234}
      COLLABORATION_INTERNAL_URL: http://collaboration:1234
      # Mounts the internal agent routes agent-writes.spec.ts calls in place of
      # the retrieval service; unset (as in the collaboration IT job), they
      # stay unmounted.
      PIPELINE_SECRET: ${E2E_PIPELINE_SECRET:-}
      CAPY_PARSE_MAX_PAGES: "1400"
      CAPY_PARSE_OCR_PAGE_CAP: "500"
    ports:
      - "127.0.0.1:${E2E_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  capy_e2e_pgdata:
