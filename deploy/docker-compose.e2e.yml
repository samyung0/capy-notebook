# Disposable stack for Playwright / backend access tests.
#   docker compose -f deploy/docker-compose.e2e.yml up --build -d
#   docker compose -f deploy/docker-compose.e2e.yml down -v
#
# Host ports are offset so this can run alongside the normal dev stack.

services:
  # pgvector, same as the dev stack: the baseline schema creates the extension
  # for the retrieval index, so stock postgres:16 can no longer apply it.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: capy
      POSTGRES_PASSWORD: capy
      POSTGRES_DB: capy
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-55432}:5432"
    volumes:
      - capy_e2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready can succeed against Postgres' temporary bootstrap server
      # before POSTGRES_DB has been created. Require a real query so dependent
      # services only start after initialization is complete.
      test: ["CMD-SHELL", 'psql -U capy -d capy -c "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  collaboration:
    build:
      context: ..
      dockerfile: collaboration/Dockerfile
    environment:
      API_URL: http://server:8080
      COLLABORATION_ALLOWED_ORIGINS: ${E2E_BASE_URL:-http://127.0.0.1:5174}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-e2e-collaboration-secret}
      DATABASE_URL: postgres://capy:capy@db:5432/capy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "1234"
    ports:
      - "127.0.0.1:${E2E_COLLABORATION_PORT:-11234}:1234"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1234/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  server:
    build:
      context: ../server
    environment:
      DATABASE_URL: postgres://capy:capy@db:5432/capy?sslmode=disable
      ADDR: ":8080"
      MIGRATE: "true"
      BLOB_BACKEND: memory
      AUTH_DISABLED: "true"
      APP_ENV: e2e
      E2E_AUTH: "true"
      E2E_AUTH_SECRET: ${E2E_AUTH_SECRET:?E2E_AUTH_SECRET is required}
      E2E_AUTH_USER_IDS: u_owner,u_editor,u_commenter,u_viewer,u_other
      APP_URL: ${APP_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-e2e-collaboration-secret}
      COLLABORATION_URL: ws://127.0.0.1:${E2E_COLLABORATION_PORT:-11234}
      COLLABORATION_INTERNAL_URL: http://collaboration:1234
    ports:
      - "127.0.0.1:${E2E_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  capy_e2e_pgdata:
