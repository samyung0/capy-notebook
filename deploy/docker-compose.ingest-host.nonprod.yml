# Shared local/UAT ingest stack for the dedicated Netcup ingest host.
#
# Local and UAT keep separate databases, Redis instances, B2 buckets, and
# provider credentials. Their queue consumers run in this one Compose project
# and use locks on the shared spool to allow one active import, parse, and
# ingest job across both environments. Production uses a separate project and
# never mounts the non-production spool.

name: ${CAPY_INGEST_NONPROD_PROJECT_NAME:-capy-ingest-nonprod}

x-parser-env: &parser-env
  CAPY_PARSE_CONCURRENCY: "1"
  CAPY_MINERU_SLICE_PAGES: ${CAPY_MINERU_SLICE_PAGES:-26}
  MINERU_PROCESSING_WINDOW_SIZE: ${CAPY_MINERU_PROCESSING_WINDOW_SIZE:-26}
  MINERU_INTRA_OP_NUM_THREADS: ${CAPY_MINERU_INTRA_OP_NUM_THREADS:-2}
  MINERU_INTER_OP_NUM_THREADS: ${CAPY_MINERU_INTER_OP_NUM_THREADS:-1}
  CAPY_PARSE_SLICE_TIMEOUT: ${CAPY_PARSE_SLICE_TIMEOUT:-600}
  CAPY_PARSE_SHARED_DIR: /var/lib/capy-parse
  CAPY_OFFICE_CONVERT_TIMEOUT: ${CAPY_OFFICE_CONVERT_TIMEOUT:-180}
  CAPY_OFFICE_PREVIEW_MAX_BYTES: ${CAPY_OFFICE_PREVIEW_MAX_BYTES:-134217728}
  CAPY_PARSE_ARTIFACT_MAX_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_BYTES:-268435456}
  CAPY_PARSE_ARTIFACT_MAX_ENTRIES: ${CAPY_PARSE_ARTIFACT_MAX_ENTRIES:-4096}
  CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
  CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
  CAPY_PARSE_CONTENT_MAX_BYTES: ${CAPY_PARSE_CONTENT_MAX_BYTES:-134217728}
  CAPY_PARSE_CONTENT_MAX_BLOCKS: ${CAPY_PARSE_CONTENT_MAX_BLOCKS:-250000}
  CAPY_PARSE_IMAGE_MAX_BYTES: ${CAPY_PARSE_IMAGE_MAX_BYTES:-33554432}
  CAPY_PARSE_IMAGES_MAX_BYTES: ${CAPY_PARSE_IMAGES_MAX_BYTES:-268435456}

x-worker-env: &worker-env
  RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
  CAPY_INGEST_HOST_ID: ${CAPY_INGEST_HOST_ID:-netcup-ingest-nonprod}
  LOG_FORMAT: json
  PARSER_URL: http://127.0.0.1:${PARSER_PORT:-8091}/file_parse
  PARSER_TOKEN: ${PARSER_TOKEN:?set the shared non-production parser token}
  PARSER_TIMEOUT: ${PARSER_TIMEOUT:-2400}
  CAPY_PARSE_SLICE_TIMEOUT: ${CAPY_PARSE_SLICE_TIMEOUT:-600}
  PARSER_SLOT_TTL: ${PARSER_SLOT_TTL:-2700}
  CAPY_PARSE_SHARED_DIR: /var/lib/capy-parse
  CAPY_SHARED_CAPACITY_LOCK_DIR: /var/lib/capy-parse/capacity
  CAPY_PARSE_JOB_TIMEOUT: ${CAPY_PARSE_JOB_TIMEOUT:-3600}
  CAPY_INGEST_TIMEOUT: ${CAPY_INGEST_TIMEOUT:-1200}
  CAPY_PARSE_SLOTS: "1"
  CAPY_PARSE_METHOD: ${CAPY_PARSE_METHOD:-auto}
  CAPY_OFFICE_PREVIEW_MAX_BYTES: ${CAPY_OFFICE_PREVIEW_MAX_BYTES:-134217728}
  CAPY_PARSE_ARTIFACT_MAX_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_BYTES:-268435456}
  CAPY_PARSE_ARTIFACT_MAX_ENTRIES: ${CAPY_PARSE_ARTIFACT_MAX_ENTRIES:-4096}
  CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
  CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
  CAPY_PARSE_CONTENT_MAX_BYTES: ${CAPY_PARSE_CONTENT_MAX_BYTES:-134217728}
  CAPY_PARSE_CONTENT_MAX_BLOCKS: ${CAPY_PARSE_CONTENT_MAX_BLOCKS:-250000}
  CAPY_PARSE_IMAGE_MAX_BYTES: ${CAPY_PARSE_IMAGE_MAX_BYTES:-33554432}
  CAPY_PARSE_IMAGES_MAX_BYTES: ${CAPY_PARSE_IMAGES_MAX_BYTES:-268435456}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
  CAPY_CAPTION_CONCURRENCY: ${CAPY_CAPTION_CONCURRENCY:-2}
  CAPY_CAPTION_MAX_EDGE: ${CAPY_CAPTION_MAX_EDGE:-1280}
  CAPY_CAPTION_VERSION: ${CAPY_CAPTION_VERSION:-v2}
  CAPY_IMAGE_MAX_PIXELS: ${CAPY_IMAGE_MAX_PIXELS:-100000000}
  CAPY_ELEVENLABS_TRANSCRIPT_VERSION: ${CAPY_ELEVENLABS_TRANSCRIPT_VERSION:-scribe-v2-1}
  CAPY_ELEVENLABS_CONCURRENCY_UNITS: ${CAPY_ELEVENLABS_CONCURRENCY_UNITS:-2}
  CAPY_ELEVENLABS_SYNC_TIMEOUT_S: ${CAPY_ELEVENLABS_SYNC_TIMEOUT_S:-43200}
  CAPY_AUDIO_MAX_DURATION_SECONDS: ${CAPY_AUDIO_MAX_DURATION_SECONDS:-36000}
  CAPY_TABULAR_TEXT_VERSION: ${CAPY_TABULAR_TEXT_VERSION:-v1}
  CAPY_CAPTION_CACHE_TTL_DAYS: ${CAPY_CAPTION_CACHE_TTL_DAYS:-90}
  CAPY_PARSE_ZIP_TTL_HOURS: ${CAPY_PARSE_ZIP_TTL_HOURS:-6}
  CAPY_PARSE_SOURCE_TTL_HOURS: ${CAPY_PARSE_SOURCE_TTL_HOURS:-2}

x-pipeline-service: &pipeline-service
  image: capy-ingest-nonprod-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
  build:
    context: ..
    dockerfile: pipeline/Dockerfile
    args:
      RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
  network_mode: host
  restart: unless-stopped
  volumes:
    - parse_spool:/var/lib/capy-parse

x-coordinator-resources: &coordinator-resources
  mem_limit: ${CAPY_INGEST_NONPROD_COORDINATOR_MEMORY_LIMIT:-384m}
  memswap_limit: ${CAPY_INGEST_NONPROD_COORDINATOR_MEMORY_SWAP_LIMIT:-512m}
  cpus: ${CAPY_INGEST_NONPROD_COORDINATOR_CPUS:-0.5}
  pids_limit: ${CAPY_INGEST_NONPROD_COORDINATOR_PIDS_LIMIT:-64}

x-worker-resources: &worker-resources
  mem_limit: ${CAPY_INGEST_NONPROD_WORKER_MEMORY_LIMIT:-1g}
  memswap_limit: ${CAPY_INGEST_NONPROD_WORKER_MEMORY_SWAP_LIMIT:-1280m}
  cpus: ${CAPY_INGEST_NONPROD_WORKER_CPUS:-1.0}
  pids_limit: ${CAPY_INGEST_NONPROD_WORKER_PIDS_LIMIT:-128}

services:
  parse-spool-init:
    image: alpine:3.20
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/capy-parse/sources /var/lib/capy-parse/artifacts /var/lib/capy-parse/quarantine /var/lib/capy-parse/capacity && chown -R 10001:10001 /var/lib/capy-parse && chmod 2770 /var/lib/capy-parse /var/lib/capy-parse/sources /var/lib/capy-parse/artifacts /var/lib/capy-parse/quarantine /var/lib/capy-parse/capacity",
      ]
    volumes:
      - parse_spool:/var/lib/capy-parse
    restart: "no"

  parser:
    image: capy-ingest-nonprod-parser:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: parser/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    environment:
      <<: *parser-env
      APP_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
      PARSER_BIND_ADDRESS: 127.0.0.1
      PARSER_TOKEN: ${PARSER_TOKEN:?set the shared non-production parser token}
    command:
      [
        "uvicorn",
        "app:app",
        "--app-dir",
        "/app/parser",
        "--host",
        "127.0.0.1",
        "--port",
        "${PARSER_PORT:-8091}",
        "--workers",
        "1",
      ]
    volumes:
      - parser_models:/models
      - parse_spool:/var/lib/capy-parse
    mem_limit: ${CAPY_INGEST_NONPROD_PARSER_MEMORY_LIMIT:-6g}
    memswap_limit: ${CAPY_INGEST_NONPROD_PARSER_MEMORY_SWAP_LIMIT:-8g}
    cpus: ${CAPY_INGEST_NONPROD_PARSER_CPUS:-2.0}
    pids_limit: ${CAPY_INGEST_NONPROD_PARSER_PIDS_LIMIT:-256}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:${PARSER_PORT:-8091}/healthz",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15m
      retries: 8
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
    restart: unless-stopped

  parse-coordinator-local:
    <<: [*pipeline-service, *coordinator-resources]
    profiles: [local]
    env_file:
      - ${CAPY_INGEST_LOCAL_ENV_FILE:-/opt/capy-ingest/local.queue.env}
    environment:
      <<: *worker-env
      APP_ENV: development
      CAPY_INGEST_ENVIRONMENT: local
      SENTRY_ENVIRONMENT: local
      CAPY_PARSE_COORDINATOR_CONCURRENCY: "1"
      CAPY_DB_SYNC_POOL_MAX_SIZE: "2"
      CAPY_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.parse_worker"]
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
      parser:
        condition: service_healthy

  parse-coordinator-uat:
    <<: [*pipeline-service, *coordinator-resources]
    profiles: [uat]
    env_file:
      - ${CAPY_INGEST_UAT_ENV_FILE:-/opt/capy-ingest/uat.queue.env}
    environment:
      <<: *worker-env
      APP_ENV: production
      CAPY_INGEST_ENVIRONMENT: uat
      SENTRY_ENVIRONMENT: uat
      CAPY_PARSE_COORDINATOR_CONCURRENCY: "1"
      CAPY_DB_SYNC_POOL_MAX_SIZE: "2"
      CAPY_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.parse_worker"]
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
      parser:
        condition: service_healthy

  worker-local:
    <<: [*pipeline-service, *worker-resources]
    profiles: [local]
    env_file:
      - ${CAPY_INGEST_LOCAL_ENV_FILE:-/opt/capy-ingest/local.queue.env}
    environment:
      <<: *worker-env
      APP_ENV: development
      CAPY_INGEST_ENVIRONMENT: local
      SENTRY_ENVIRONMENT: local
    command: ["python", "-m", "pipeline.ingest.worker"]
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully

  worker-uat:
    <<: [*pipeline-service, *worker-resources]
    profiles: [uat]
    env_file:
      - ${CAPY_INGEST_UAT_ENV_FILE:-/opt/capy-ingest/uat.queue.env}
    environment:
      <<: *worker-env
      APP_ENV: production
      CAPY_INGEST_ENVIRONMENT: uat
      SENTRY_ENVIRONMENT: uat
    command: ["python", "-m", "pipeline.ingest.worker"]
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully

  # Drive/OneDrive imports. GATEWAY_URL and PIPELINE_SECRET come from each
  # environment's queue env file.
  import-worker-local:
    <<: [*pipeline-service, *coordinator-resources]
    profiles: [local]
    env_file:
      - ${CAPY_INGEST_LOCAL_ENV_FILE:-/opt/capy-ingest/local.queue.env}
    environment:
      <<: *worker-env
      APP_ENV: development
      CAPY_INGEST_ENVIRONMENT: local
      SENTRY_ENVIRONMENT: local
      CAPY_DB_SYNC_POOL_MAX_SIZE: "2"
      CAPY_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.import_worker"]
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully

  import-worker-uat:
    <<: [*pipeline-service, *coordinator-resources]
    profiles: [uat]
    env_file:
      - ${CAPY_INGEST_UAT_ENV_FILE:-/opt/capy-ingest/uat.queue.env}
    environment:
      <<: *worker-env
      APP_ENV: production
      CAPY_INGEST_ENVIRONMENT: uat
      SENTRY_ENVIRONMENT: uat
      CAPY_DB_SYNC_POOL_MAX_SIZE: "2"
      CAPY_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.import_worker"]
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully

  host-sampler-local:
    <<: *pipeline-service
    profiles: [local]
    env_file:
      - ${CAPY_INGEST_LOCAL_ENV_FILE:-/opt/capy-ingest/local.queue.env}
    read_only: true
    environment:
      <<: *worker-env
      APP_ENV: development
      CAPY_INGEST_ENVIRONMENT: local
      SENTRY_ENVIRONMENT: local
      CAPY_HOST_PROC: /host/proc
      CAPY_HOST_METRICS_ENABLED: "false"
      PARSER_HEALTH_URL: http://127.0.0.1:${PARSER_PORT:-8091}/healthz
      CAPY_HOST_SAMPLE_ACTIVE_SECONDS: ${CAPY_HOST_SAMPLE_ACTIVE_SECONDS:-5}
      CAPY_HOST_SAMPLE_IDLE_SECONDS: ${CAPY_HOST_SAMPLE_IDLE_SECONDS:-60}
    command: ["python", "-m", "pipeline.ingest.host_sampler"]
    volumes:
      - /proc:/host/proc:ro
      - parse_spool:/var/lib/capy-parse:ro
    depends_on:
      parser:
        condition: service_healthy

  host-sampler-uat:
    <<: *pipeline-service
    profiles: [uat]
    env_file:
      - ${CAPY_INGEST_UAT_ENV_FILE:-/opt/capy-ingest/uat.queue.env}
    read_only: true
    environment:
      <<: *worker-env
      APP_ENV: production
      CAPY_INGEST_ENVIRONMENT: uat
      SENTRY_ENVIRONMENT: uat
      CAPY_HOST_PROC: /host/proc
      CAPY_HOST_METRICS_ENABLED: "false"
      PARSER_HEALTH_URL: http://127.0.0.1:${PARSER_PORT:-8091}/healthz
      CAPY_HOST_SAMPLE_ACTIVE_SECONDS: ${CAPY_HOST_SAMPLE_ACTIVE_SECONDS:-5}
      CAPY_HOST_SAMPLE_IDLE_SECONDS: ${CAPY_HOST_SAMPLE_IDLE_SECONDS:-60}
    command: ["python", "-m", "pipeline.ingest.host_sampler"]
    volumes:
      - /proc:/host/proc:ro
      - parse_spool:/var/lib/capy-parse:ro
    depends_on:
      parser:
        condition: service_healthy

volumes:
  parser_models:
    name: ${CAPY_INGEST_PARSER_MODELS_VOLUME:-capy-ingest_parser_models}
  parse_spool:
    name: ${CAPY_INGEST_NONPROD_PARSE_SPOOL_VOLUME:-capy-ingest_nonprod_parse_spool}
