# Netcup ingest stack. Run only on the dedicated ingest host.
# Host networking is intentional: the parser binds to its WireGuard address,
# while the sampler reads host /proc counters and reaches the same private URL.

x-pipeline-env: &pipeline-env
  APP_ENV: production
  CAPY_INGEST_ENVIRONMENT: production
  CAPY_INGEST_HOST_ID: ${CAPY_INGEST_HOST_ID:-netcup-ingest-1}
  RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
  LOG_FORMAT: json
  DATABASE_URL: ${DATABASE_URL:?set the private WireGuard Postgres URL}
  REDIS_URL: ${REDIS_URL:?set the private WireGuard Redis URL}
  B2_ENDPOINT: ${B2_ENDPOINT:?set B2_ENDPOINT}
  B2_REGION: ${B2_REGION:?set B2_REGION}
  B2_BUCKET: ${B2_BUCKET:?set B2_BUCKET}
  B2_KEY_ID: ${B2_KEY_ID:?set B2_KEY_ID}
  B2_APP_KEY: ${B2_APP_KEY:?set B2_APP_KEY}
  PARSER_URL: http://${PARSER_BIND_ADDRESS:?set the WireGuard bind address}:8090/file_parse
  PARSER_TOKEN: ${PARSER_TOKEN:?set PARSER_TOKEN}
  PARSER_TIMEOUT: ${PARSER_TIMEOUT:-1920}
  CAPY_PARSE_SHARED_DIR: /var/lib/capy-parse
  CAPY_PARSE_JOB_TIMEOUT: ${CAPY_PARSE_JOB_TIMEOUT:-2100}
  CAPY_INGEST_TIMEOUT: ${CAPY_INGEST_TIMEOUT:-1200}
  CAPY_OFFICE_PREVIEW_MAX_BYTES: ${CAPY_OFFICE_PREVIEW_MAX_BYTES:-134217728}
  CAPY_PARSE_ARTIFACT_MAX_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_BYTES:-268435456}
  CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
  CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
  CAPY_PARSE_CONTENT_MAX_BYTES: ${CAPY_PARSE_CONTENT_MAX_BYTES:-134217728}
  CAPY_PARSE_CONTENT_MAX_BLOCKS: ${CAPY_PARSE_CONTENT_MAX_BLOCKS:-250000}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  # The Sentry environment tag. Empty falls back to APP_ENV in code; UAT sets
  # it because its APP_ENV stays `production` to exercise production checks.
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}

services:
  parse-spool-init:
    image: alpine:3.20
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/capy-parse/sources /var/lib/capy-parse/artifacts /var/lib/capy-parse/quarantine && chown -R 10001:10001 /var/lib/capy-parse && chmod 2770 /var/lib/capy-parse /var/lib/capy-parse/sources /var/lib/capy-parse/artifacts /var/lib/capy-parse/quarantine && chown 10001:10001 /run/capy-parser/work && chmod 0700 /run/capy-parser/work",
      ]
    volumes:
      - parse_spool:/var/lib/capy-parse
      - parser_work:/run/capy-parser/work
    restart: "no"

  parser:
    image: capy-ingest-parser:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: parser/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    # No `init: true`: the image's own PID 1 (tini, execute-only) reaps.
    # The parser reads untrusted documents: no capabilities, no privilege gain,
    # Docker's default seccomp profile and a read-only root. HOME and /tmp are
    # small RAM tmpfs mounts; sources, conversions and temporary files use the
    # disk-backed parser_work volume (the image sets TMPDIR to it).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/capy-parser/home:noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
      - /tmp:noexec,nosuid,nodev,size=64m
    environment:
      APP_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
      PARSER_BIND_ADDRESS: ${PARSER_BIND_ADDRESS:?set the WireGuard bind address}
      PARSER_TOKEN: ${PARSER_TOKEN:?set PARSER_TOKEN}
      # Parse children, one document each. Seven is the 8-CPU host's CPU
      # ceiling (a 1,400-page book uses about one core; seven peaked at
      # 10.8 of 14 GiB): bench/parsers/reports/2026-10-16-parser-v16-recalibration.md.
      CAPY_PARSE_WORKERS: ${CAPY_PARSE_WORKERS:-7}
      # Depth counts documents in a parse child and waiting.
      # One more is 429 and the coordinator re-pends without spending an
      # attempt.
      CAPY_PARSE_QUEUE_DEPTH: ${CAPY_PARSE_QUEUE_DEPTH:-8}
      # Hard deadline per document in its parse child (Java plus repairs, wall
      # clock); a breach quarantines the fingerprint and replaces that child.
      CAPY_PARSE_DOCUMENT_TIMEOUT: ${CAPY_PARSE_DOCUMENT_TIMEOUT:-900}
      # Text-less pages one document may send to the ingest worker's VLM;
      # more fails as parse_too_many_scanned_pages.
      CAPY_PARSE_OCR_PAGE_CAP: ${CAPY_PARSE_OCR_PAGE_CAP:-500}
      # Pages per document; more fails as parse_too_many_pages. The API serves
      # the same value in the upload policy.
      CAPY_PARSE_MAX_PAGES: ${CAPY_PARSE_MAX_PAGES:?set CAPY_PARSE_MAX_PAGES}
      # Per-document JVM heap; 1g parsed 15 to 1,220 pages as fast as 8g.
      CAPY_PARSER_JVM_MAX_HEAP: ${CAPY_PARSER_JVM_MAX_HEAP:-1g}
      # Two malloc arenas per process: LibreOffice and the JVM reserve far
      # less address space, which a parse child's limit also binds.
      MALLOC_ARENA_MAX: "2"
      CAPY_PARSE_SHARED_DIR: /var/lib/capy-parse
      CAPY_OFFICE_CONVERT_TIMEOUT: ${CAPY_OFFICE_CONVERT_TIMEOUT:-180}
      CAPY_OFFICE_PREVIEW_MAX_BYTES: ${CAPY_OFFICE_PREVIEW_MAX_BYTES:-134217728}
      CAPY_PARSE_ARTIFACT_MAX_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_BYTES:-268435456}
      CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
      CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${CAPY_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
      CAPY_PARSE_CONTENT_MAX_BYTES: ${CAPY_PARSE_CONTENT_MAX_BYTES:-134217728}
      CAPY_PARSE_CONTENT_MAX_BLOCKS: ${CAPY_PARSE_CONTENT_MAX_BLOCKS:-250000}
    command:
      [
        "uvicorn",
        "app:app",
        "--app-dir",
        "/app/parser",
        "--host",
        "${PARSER_BIND_ADDRESS:?set the WireGuard bind address}",
        "--port",
        "8090",
        "--workers",
        "1",
      ]
    volumes:
      - parse_spool:/var/lib/capy-parse
      - parser_work:/run/capy-parser/work
    mem_limit: 14g
    memswap_limit: 18g
    cpus: 8.0
    # Threads count: five JVMs and LibreOffice passed 256.
    pids_limit: 512
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://${PARSER_BIND_ADDRESS:?set the WireGuard bind address}:8090/healthz",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
    restart: unless-stopped

  parse-coordinator:
    image: capy-ingest-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    environment:
      <<: *pipeline-env
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      CAPY_PARSE_COORDINATOR_CONCURRENCY: ${CAPY_PARSE_COORDINATOR_CONCURRENCY:-8}
      CAPY_DB_SYNC_POOL_MAX_SIZE: "2"
      CAPY_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.parse_worker"]
    # Nine Python processes of about 81 MiB each after imports, plus up to
    # about 55 MiB per child while it validates a 1,220-page content list.
    mem_limit: ${CAPY_PARSE_COORDINATOR_MEMORY_LIMIT:-1280m}
    memswap_limit: ${CAPY_PARSE_COORDINATOR_MEMORY_SWAP_LIMIT:-1536m}
    cpus: ${CAPY_PARSE_COORDINATOR_CPUS:-1.0}
    pids_limit: ${CAPY_PARSE_COORDINATOR_PIDS_LIMIT:-128}
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - parse_spool:/var/lib/capy-parse

  # Drive/OneDrive imports: one provider file per claim, streamed into B2.
  # Its own service so a slow provider download never holds an ingest slot.
  import-worker:
    image: capy-ingest-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    environment:
      <<: *pipeline-env
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      GATEWAY_URL: ${GATEWAY_URL:?set the private WireGuard gateway URL}
      PIPELINE_SECRET: ${PIPELINE_SECRET:?set the gateway PIPELINE_SECRET}
      CAPY_IMPORT_JOB_TIMEOUT: ${CAPY_IMPORT_JOB_TIMEOUT:-600}
      CAPY_IMPORT_DOWNLOAD_HOSTS: ${CAPY_IMPORT_DOWNLOAD_HOSTS:-}
      CAPY_DB_SYNC_POOL_MAX_SIZE: "2"
      CAPY_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.import_worker"]
    mem_limit: ${CAPY_IMPORT_WORKER_MEMORY_LIMIT:-256m}
    memswap_limit: ${CAPY_IMPORT_WORKER_MEMORY_SWAP_LIMIT:-384m}
    cpus: ${CAPY_IMPORT_WORKER_CPUS:-0.5}
    pids_limit: ${CAPY_IMPORT_WORKER_PIDS_LIMIT:-64}
    deploy:
      mode: replicated
      replicas: ${IMPORT_WORKER_REPLICAS:-2}
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - parse_spool:/var/lib/capy-parse

  worker:
    image: capy-ingest-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    environment:
      <<: *pipeline-env
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      RELACE_API_KEY: ${RELACE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      CAPY_CAPTION_MAX_EDGE: ${CAPY_CAPTION_MAX_EDGE:-1280}
      CAPY_IMAGE_MAX_PIXELS: ${CAPY_IMAGE_MAX_PIXELS:-100000000}
      CAPY_TABULAR_TEXT_VERSION: ${CAPY_TABULAR_TEXT_VERSION:-v2}
      CAPY_CAPTION_CACHE_TTL_DAYS: ${CAPY_CAPTION_CACHE_TTL_DAYS:-90}
      CAPY_PARSE_SPOOL_TTL_HOURS: ${CAPY_PARSE_SPOOL_TTL_HOURS:-2}
    command: ["python", "-m", "pipeline.ingest.worker"]
    mem_limit: ${CAPY_INGEST_WORKER_MEMORY_LIMIT:-1g}
    memswap_limit: ${CAPY_INGEST_WORKER_MEMORY_SWAP_LIMIT:-1280m}
    cpus: ${CAPY_INGEST_WORKER_CPUS:-1.0}
    pids_limit: ${CAPY_INGEST_WORKER_PIDS_LIMIT:-128}
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-4}
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - parse_spool:/var/lib/capy-parse

  host-sampler:
    image: capy-ingest-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    read_only: true
    environment:
      <<: *pipeline-env
      CAPY_HOST_PROC: /host/proc
      CAPY_INGEST_ENVIRONMENT: production
      CAPY_INGEST_HOST_ID: ${CAPY_INGEST_HOST_ID:-netcup-ingest-1}
      CAPY_HOST_SAMPLE_ACTIVE_SECONDS: ${CAPY_HOST_SAMPLE_ACTIVE_SECONDS:-5}
      CAPY_HOST_SAMPLE_IDLE_SECONDS: ${CAPY_HOST_SAMPLE_IDLE_SECONDS:-60}
      PARSER_HEALTH_URL: http://${PARSER_BIND_ADDRESS:?set the WireGuard bind address}:8090/healthz
    volumes:
      - /proc:/host/proc:ro
      - parse_spool:/var/lib/capy-parse:ro
    command: ["python", "-m", "pipeline.ingest.host_sampler"]
    depends_on:
      parser:
        condition: service_healthy
    restart: unless-stopped

volumes:
  parse_spool:
    name: ${CAPY_INGEST_PROD_PARSE_SPOOL_VOLUME:-capy-ingest_parse_spool}
  # The parser's scratch; startup clears what a killed parser left.
  parser_work:
