# Independent Ops stack (Compose project `capy-ops`) on the app host, deployed
# by Deploy Ops through the same deploy command as the main stack. The main
# stack owns Postgres and migrations; Ops joins its `capy` network and reaches
# the database as `db`. The image is built per environment (deploy-ops.yml)
# and runs by digest (CAPY_OPS_IMAGE); the host runs this file only when its
# sha256 matches that image's compose label.
services:
  ops:
    image: ${CAPY_OPS_IMAGE:?set CAPY_OPS_IMAGE}
    environment:
      APP_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?set RELEASE_SHA}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:?set SENTRY_ENVIRONMENT}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      OPS_ADDR: ":8082"
      OPS_STATIC_DIR: /app/static
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:?set OPS_DATABASE_URL}
      OPS_ADMIN_DATABASE_URL: ${OPS_ADMIN_DATABASE_URL:?set OPS_ADMIN_DATABASE_URL}
      # Must match CAPY_INGEST_ENVIRONMENT on the workers writing to this
      # database; the renderer requires the selected deployment environment.
      OPS_INGEST_PRIMARY_ENVIRONMENT: ${OPS_INGEST_PRIMARY_ENVIRONMENT:?set OPS_INGEST_PRIMARY_ENVIRONMENT}
      OPS_INGEST_UAT_DATABASE_URL: ${OPS_INGEST_UAT_DATABASE_URL:-}
      OPS_INGEST_LOCAL_DATABASE_URL: ${OPS_INGEST_LOCAL_DATABASE_URL:-}
      # Reader URL for the shared knowledge library on the ingest host.
      # Empty disables the read-only Library section.
      OPS_LIBRARY_DATABASE_URL: ${OPS_LIBRARY_DATABASE_URL:-}
      OPS_CF_ACCESS_ISSUER: ${OPS_CF_ACCESS_ISSUER:?set OPS_CF_ACCESS_ISSUER}
      OPS_CF_ACCESS_AUDIENCE: ${OPS_CF_ACCESS_AUDIENCE:?set OPS_CF_ACCESS_AUDIENCE}
      OPS_CF_ACCESS_JWKS_URL: ${OPS_CF_ACCESS_JWKS_URL:-}
      OPS_ACCESS_DISABLED: "false"
      OPS_AUTH_DISABLED: "false"
      OPS_UNSAFE_DEVELOPMENT: "false"
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      # The only azp the Ops API accepts on a Clerk session token.
      OPS_ORIGIN: ${DEPLOYMENT_OPS_URL:?set DEPLOYMENT_OPS_URL}
      SENTRY_DSN: ${SENTRY_DSN_OPS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose:
      - "8082"
    # cloudflared reaches it on loopback, behind Cloudflare Access.
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

networks:
  default:
    name: capy
    external: true
