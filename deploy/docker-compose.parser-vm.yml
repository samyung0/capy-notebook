# Netcup parser/ingest stack. Run only on the dedicated parser VM.
# Host networking is intentional: the parser binds to its WireGuard address,
# while the sampler reads host /proc counters and reaches the same private URL.

x-pipeline-env: &pipeline-env
  APP_ENV: production
  RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
  LOG_FORMAT: json
  DATABASE_URL: ${DATABASE_URL:?set the private WireGuard Postgres URL}
  REDIS_URL: ${REDIS_URL:?set the private WireGuard Redis URL}
  B2_ENDPOINT: ${B2_ENDPOINT:?set B2_ENDPOINT}
  B2_REGION: ${B2_REGION:?set B2_REGION}
  B2_BUCKET: ${B2_BUCKET:?set B2_BUCKET}
  B2_KEY_ID: ${B2_KEY_ID:?set B2_KEY_ID}
  B2_APP_KEY: ${B2_APP_KEY:?set B2_APP_KEY}
  PARSER_URL: http://${PARSER_BIND_ADDRESS:?set the WireGuard bind address}:8090/file_parse
  PARSER_TOKEN: ${PARSER_TOKEN:?set PARSER_TOKEN}
  PARSER_TIMEOUT: ${PARSER_TIMEOUT:-2400}
  EVO_PARSE_HARD_TIMEOUT: ${EVO_PARSE_HARD_TIMEOUT:-2300}
  PARSER_SLOT_TTL: ${PARSER_SLOT_TTL:-2700}
  EVO_PARSE_SHARED_DIR: /var/lib/evo-parse
  EVO_INGEST_TIMEOUT: ${EVO_INGEST_TIMEOUT:-3600}
  EVO_PARSE_SLOTS: ${EVO_PARSE_SLOTS:-8}
  EVO_PARSE_METHOD: ${EVO_PARSE_METHOD:-selective_rapidocr}
  EVO_OFFICE_PREVIEW_MAX_BYTES: ${EVO_OFFICE_PREVIEW_MAX_BYTES:-134217728}
  EVO_PARSE_ARTIFACT_MAX_BYTES: ${EVO_PARSE_ARTIFACT_MAX_BYTES:-268435456}
  EVO_PARSE_ARTIFACT_MAX_ENTRIES: ${EVO_PARSE_ARTIFACT_MAX_ENTRIES:-4096}
  EVO_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${EVO_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
  EVO_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${EVO_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
  EVO_PARSE_CONTENT_MAX_BYTES: ${EVO_PARSE_CONTENT_MAX_BYTES:-134217728}
  EVO_PARSE_CONTENT_MAX_BLOCKS: ${EVO_PARSE_CONTENT_MAX_BLOCKS:-250000}
  EVO_PARSE_IMAGE_MAX_BYTES: ${EVO_PARSE_IMAGE_MAX_BYTES:-33554432}
  EVO_PARSE_IMAGES_MAX_BYTES: ${EVO_PARSE_IMAGES_MAX_BYTES:-268435456}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

services:
  parse-spool-init:
    image: alpine:3.20
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/evo-parse/sources /var/lib/evo-parse/artifacts /var/lib/evo-parse/quarantine && chown -R 10001:10001 /var/lib/evo-parse && chmod 2770 /var/lib/evo-parse /var/lib/evo-parse/sources /var/lib/evo-parse/artifacts /var/lib/evo-parse/quarantine",
      ]
    volumes:
      - parse_spool:/var/lib/evo-parse
    restart: "no"

  parser:
    image: evo-parser-parser:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: parser-vm/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    environment:
      APP_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
      PARSER_BIND_ADDRESS: ${PARSER_BIND_ADDRESS:?set the WireGuard bind address}
      PARSER_TOKEN: ${PARSER_TOKEN:?set PARSER_TOKEN}
      EVO_MARKER_WORKERS: ${EVO_MARKER_WORKERS:-6}
      EVO_DIGITAL_CONCURRENCY: ${EVO_DIGITAL_CONCURRENCY:-4}
      EVO_OCR_CONCURRENCY: ${EVO_OCR_CONCURRENCY:-2}
      EVO_PARSE_HARD_TIMEOUT: ${EVO_PARSE_HARD_TIMEOUT:-2300}
      EVO_PARSE_SHARED_DIR: /var/lib/evo-parse
      EVO_OFFICE_CONVERT_TIMEOUT: ${EVO_OFFICE_CONVERT_TIMEOUT:-180}
      EVO_OFFICE_PREVIEW_MAX_BYTES: ${EVO_OFFICE_PREVIEW_MAX_BYTES:-134217728}
      EVO_PARSE_ARTIFACT_MAX_BYTES: ${EVO_PARSE_ARTIFACT_MAX_BYTES:-268435456}
      EVO_PARSE_ARTIFACT_MAX_ENTRIES: ${EVO_PARSE_ARTIFACT_MAX_ENTRIES:-4096}
      EVO_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${EVO_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
      EVO_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${EVO_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
      EVO_PARSE_CONTENT_MAX_BYTES: ${EVO_PARSE_CONTENT_MAX_BYTES:-134217728}
      EVO_PARSE_CONTENT_MAX_BLOCKS: ${EVO_PARSE_CONTENT_MAX_BLOCKS:-250000}
      EVO_PARSE_IMAGE_MAX_BYTES: ${EVO_PARSE_IMAGE_MAX_BYTES:-33554432}
      EVO_PARSE_IMAGES_MAX_BYTES: ${EVO_PARSE_IMAGES_MAX_BYTES:-268435456}
      FAST_LAYOUT_NUM_THREADS: ${EVO_FAST_LAYOUT_NUM_THREADS:-8}
    command:
      [
        "uvicorn",
        "app:app",
        "--app-dir",
        "/app/parser-vm",
        "--host",
        "${PARSER_BIND_ADDRESS:?set the WireGuard bind address}",
        "--port",
        "8090",
        "--workers",
        "1",
      ]
    volumes:
      - parser_models:/models
      - parse_spool:/var/lib/evo-parse
    mem_limit: 14g
    cpus: 8.0
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://${PARSER_BIND_ADDRESS:?set the WireGuard bind address}:8090/healthz",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15m
      retries: 8
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: evo-parser-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    environment:
      <<: *pipeline-env
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_WEBHOOK_ID: ${ELEVENLABS_WEBHOOK_ID:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      EVO_CAPTION_CONCURRENCY: ${EVO_CAPTION_CONCURRENCY:-8}
      EVO_CAPTION_MAX_EDGE: ${EVO_CAPTION_MAX_EDGE:-1280}
      EVO_CAPTION_VERSION: ${EVO_CAPTION_VERSION:-v2}
      EVO_IMAGE_MAX_PIXELS: ${EVO_IMAGE_MAX_PIXELS:-100000000}
      EVO_ELEVENLABS_TRANSCRIPT_VERSION: ${EVO_ELEVENLABS_TRANSCRIPT_VERSION:-scribe-v2-1}
      EVO_ELEVENLABS_CONCURRENCY_UNITS: ${EVO_ELEVENLABS_CONCURRENCY_UNITS:-12}
      EVO_AUDIO_MAX_DURATION_SECONDS: ${EVO_AUDIO_MAX_DURATION_SECONDS:-36000}
      EVO_TABULAR_TEXT_VERSION: ${EVO_TABULAR_TEXT_VERSION:-v1}
      EVO_CAPTION_CACHE_TTL_DAYS: ${EVO_CAPTION_CACHE_TTL_DAYS:-90}
      EVO_PARSE_ZIP_TTL_HOURS: ${EVO_PARSE_ZIP_TTL_HOURS:-6}
      EVO_PARSE_SOURCE_TTL_HOURS: ${EVO_PARSE_SOURCE_TTL_HOURS:-2}
    command: ["python", "-m", "pipeline.ingest.worker"]
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-8}
    depends_on:
      parse-spool-init:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - parse_spool:/var/lib/evo-parse

  host-sampler:
    image: evo-parser-pipeline:${RELEASE_SHA:?set the exact 40-character release SHA}
    network_mode: host
    read_only: true
    environment:
      <<: *pipeline-env
      EVO_HOST_PROC: /host/proc
      EVO_PARSE_HOST_ID: ${EVO_PARSE_HOST_ID:-netcup-parser-1}
      EVO_HOST_SAMPLE_ACTIVE_SECONDS: ${EVO_HOST_SAMPLE_ACTIVE_SECONDS:-5}
      EVO_HOST_SAMPLE_IDLE_SECONDS: ${EVO_HOST_SAMPLE_IDLE_SECONDS:-60}
      PARSER_HEALTH_URL: http://${PARSER_BIND_ADDRESS:?set the WireGuard bind address}:8090/healthz
    volumes:
      - /proc:/host/proc:ro
    command: ["python", "-m", "pipeline.parse.host_sampler"]
    depends_on:
      parser:
        condition: service_healthy
    restart: unless-stopped

volumes:
  parser_models:
    name: ${EVO_PARSER_MODELS_VOLUME:-evo-parser_parser_models}
  parse_spool:
    name: ${EVO_PROD_PARSE_SPOOL_VOLUME:-evo-parser_parse_spool}
