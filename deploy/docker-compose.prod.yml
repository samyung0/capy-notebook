# The UAT and production app stack. Not for local development.
#
# The deploy job sends this file and the rendered stack.env to the app host's
# deploy command (scripts/deploy/app-host-deploy.sh), which runs it as Compose
# project `capy` with the GHCR images CI built for RELEASE_SHA, by digest
# (CAPY_*_IMAGE, added by the deploy job). The host runs this file only when
# its sha256 matches the label CI put on that SHA's capy-server image, so edit
# it only through a commit; see openwiki/deployment-runbook.md §1.1, which
# also has root's commands for redeploying a kept release by hand.
#
# Differences from docker-compose.yml:
# - APP_ENV=production, no demo seed, AUTH_DISABLED off
# - /migrate runs once per deploy; the API has MIGRATE=false
# - prebuilt images, no build sections
# - the gateway and collaboration publish on 127.0.0.1 for cloudflared;
#   Postgres, Redis and the gateway also publish on the WireGuard address for
#   the ingest host
# - Postgres password comes from the environment
# - Ops deploys separately using docker-compose.ops.yml, on this stack's
#   `capy` network

x-observability: &observability
  APP_ENV: production
  # The host checks every image's revision label against this value.
  RELEASE_SHA: ${RELEASE_SHA:?set RELEASE_SHA}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  # The Sentry environment tag. Empty falls back to APP_ENV in code; UAT sets
  # it because its APP_ENV stays `production` to exercise production checks.
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}

# In-compose Postgres. Moving to a managed instance means rendering another
# DATABASE_URL and dropping the `db` service.
x-database-url: &database-url ${DATABASE_URL:?set the derived container database URL}

x-b2: &b2
  B2_ENDPOINT: ${B2_ENDPOINT:?set B2_ENDPOINT}
  B2_REGION: ${B2_REGION:?set B2_REGION}
  B2_BUCKET: ${B2_BUCKET:?set B2_BUCKET}
  B2_KEY_ID: ${B2_KEY_ID:?set B2_KEY_ID}
  B2_APP_KEY: ${B2_APP_KEY:?set B2_APP_KEY}
  B2_FORCE_PATH_STYLE: ${B2_FORCE_PATH_STYLE:-}
  B2_PRESIGN_TTL: ${B2_PRESIGN_TTL:-}
  B2_LINK_TTL: ${B2_LINK_TTL:-}

services:
  # Postgres and Redis are pinned by digest: a deploy pulls only the app
  # images, so upgrading either is an explicit commit (Epo 2026-10-23).
  db:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: capy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: capy
    volumes:
      - capy_pgdata:/var/lib/postgresql/data
    ports:
      - "${CAPY_PRIVATE_BIND_ADDRESS:?set CAPY_PRIVATE_BIND_ADDRESS}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capy -d capy"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Under memory pressure the kernel kills an Office engine child
    # (oom_score_adj 1000) long before Postgres or the gateway (Epo 2026-10-08).
    oom_score_adj: -500
    restart: unless-stopped

  capy-redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${CAPY_PRIVATE_BIND_ADDRESS:?set CAPY_PRIVATE_BIND_ADDRESS}:6379:6379"
    restart: unless-stopped

  migrate:
    image: ${CAPY_SERVER_IMAGE:?set CAPY_SERVER_IMAGE}
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    image: ${CAPY_SERVER_IMAGE:?set CAPY_SERVER_IMAGE}
    environment:
      <<: [*observability, *b2]
      DATABASE_URL: *database-url
      ADDR: ":8080"
      MIGRATE: "false"
      SENTRY_DSN: ${SENTRY_DSN_GATEWAY:-}
      REDIS_URL: redis://capy-redis:6379/0
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:?set COLLABORATION_SECRET}
      SHARE_LINK_SECRET: ${SHARE_LINK_SECRET:?set SHARE_LINK_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
      JEV_TYPESAFE_API_KEY: ${JEV_TYPESAFE_API_KEY:?set JEV_TYPESAFE_API_KEY}
      COLLABORATION_URL: ${COLLABORATION_URL:?set COLLABORATION_URL}
      COLLABORATION_INTERNAL_URL: http://collaboration:1234
      CAPY_PARSER: ${CAPY_PARSER:-opendataloader}
      PIPELINE_URL: http://retrieval:8001
      PIPELINE_SECRET: ${PIPELINE_SECRET:?set PIPELINE_SECRET}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:?set LLM_CREDENTIALS_KEY}
      APP_URL: ${APP_URL:?set APP_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      # Clerk session tokens are accepted only from these origins (their azp).
      COLLABORATION_ALLOWED_ORIGINS: ${COLLABORATION_ALLOWED_ORIGINS:-${APP_URL:?set APP_URL}}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-cloudflare}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_TOKEN: ${CLOUDFLARE_EMAIL_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      BANK_DATABASE_URL: ${BANK_DATABASE_URL:-}
      LIBRARY_DATABASE_URL: ${LIBRARY_DATABASE_URL:-}
      BANK_EDITOR_DATABASE_URL: ${BANK_EDITOR_DATABASE_URL:-}
      BANK_ASSETS_URL: ${BANK_ASSETS_URL:-}
      BANK_COMMENT_EMAIL: ${BANK_COMMENT_EMAIL:-}
      BANK_PUBLIC_B2_ENDPOINT: ${BANK_PUBLIC_B2_ENDPOINT:-}
      BANK_PUBLIC_B2_REGION: ${BANK_PUBLIC_B2_REGION:-}
      BANK_PUBLIC_B2_BUCKET: ${BANK_PUBLIC_B2_BUCKET:-}
      BANK_PUBLIC_B2_KEY_ID: ${BANK_PUBLIC_B2_KEY_ID:-}
      BANK_PUBLIC_B2_APP_KEY: ${BANK_PUBLIC_B2_APP_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?set CLERK_WEBHOOK_SECRET}
      AUTH_DISABLED: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      RATE_LIMIT_DISABLED: "false"
      RATE_LIMIT_AI_PER_HOUR: ${RATE_LIMIT_AI_PER_HOUR:-}
      CAPY_CAPTION_CACHE_TTL_DAYS: ${CAPY_CAPTION_CACHE_TTL_DAYS:-90}
      # The parser's page and OCR page caps, served in the upload policy; the
      # ingest host reads the same GitHub environment values.
      CAPY_PARSE_MAX_PAGES: ${CAPY_PARSE_MAX_PAGES:?set CAPY_PARSE_MAX_PAGES}
      CAPY_PARSE_OCR_PAGE_CAP: ${CAPY_PARSE_OCR_PAGE_CAP:?set CAPY_PARSE_OCR_PAGE_CAP}
    expose:
      - "8080"
    # cloudflared reaches it on loopback. The ingest host's import worker
    # calls /api/internal/import/* over WireGuard, the same private address
    # Postgres and Redis publish on.
    ports:
      - "127.0.0.1:8080:8080"
      - "${CAPY_PRIVATE_BIND_ADDRESS:?set CAPY_PRIVATE_BIND_ADDRESS}:8080:8080"
    # A probe a second while it boots, so collaboration (which waits for it)
    # starts about a second after the gateway is healthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
      start_interval: 1s
    depends_on:
      db:
        condition: service_healthy
      capy-redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # See db: the gateway outlives an Office engine child under memory pressure.
    oom_score_adj: -500
    restart: unless-stopped

  collaboration:
    image: ${CAPY_COLLABORATION_IMAGE:?set CAPY_COLLABORATION_IMAGE}
    environment:
      <<: *observability
      API_URL: http://server:8080
      COLLABORATION_ALLOWED_ORIGINS: ${COLLABORATION_ALLOWED_ORIGINS:-${APP_URL:?set APP_URL}}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:?set COLLABORATION_SECRET}
      DATABASE_URL: *database-url
      REDIS_URL: redis://capy-redis:6379/0
      PORT: "1234"
      # Office engine processes and their memory cap per environment
      # (scripts/env/config.py render, Epo 2026-10-07).
      COLLABORATION_ENGINE_SAVE_PROCESSES: ${COLLABORATION_ENGINE_SAVE_PROCESSES:?set COLLABORATION_ENGINE_SAVE_PROCESSES}
      COLLABORATION_ENGINE_BACKGROUND_PROCESSES: ${COLLABORATION_ENGINE_BACKGROUND_PROCESSES:?set COLLABORATION_ENGINE_BACKGROUND_PROCESSES}
      COLLABORATION_ENGINE_MEMORY_LIMIT_BYTES: ${COLLABORATION_ENGINE_MEMORY_LIMIT_BYTES:?set COLLABORATION_ENGINE_MEMORY_LIMIT_BYTES}
      # glibc keeps freed room memory spread over up to 8 arenas per core and
      # raises its mmap threshold as large blocks are freed; two arenas and
      # fixed 128 KiB thresholds return it after peers leave (~90 MiB kept
      # instead of 411-467). The engine processes inherit them.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_MMAP_THRESHOLD_: "131072"
      # The source rooms' disk store cap per environment (scripts/env/config.py
      # render, Epo 2026-10-17); its folder is the image's, on the volume below.
      COLLABORATION_SOURCE_DISK_BYTES: ${COLLABORATION_SOURCE_DISK_BYTES:?set COLLABORATION_SOURCE_DISK_BYTES}
      SENTRY_DSN: ${SENTRY_DSN_COLLABORATION:-}
      # Copied bank questions link their figures here (questions.ts).
      BANK_ASSETS_URL: ${BANK_ASSETS_URL:-}
      # UAT only (the renderer refuses it in production): holds a publication
      # while its file's name contains [hold-publication], for the journey.
      COLLABORATION_UAT_PUBLICATION_HOLD: ${COLLABORATION_UAT_PUBLICATION_HOLD:-}
    # Disk-backed, never tmpfs; created with the image folder's owner (the
    # service user) and mode 0700; the server wipes it at start.
    volumes:
      - capy_collaboration_sources:/var/lib/capy/sources
    expose:
      - "1234"
    # cloudflared reaches it on loopback.
    ports:
      - "127.0.0.1:1234:1234"
    # Every client socket, gateway call and database connection is a
    # descriptor; Docker's default soft limit of 1024 held the server near
    # 1,000 connections (prod Phase B). The server also raises its soft limit
    # to the hard one at startup, as Go and Node do.
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    # Its Office engine children read uploaded files (Epo 2026-10-20): no
    # capabilities and no privilege gain; the server (nobody) needs neither.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1234/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
      start_interval: 1s
    depends_on:
      db:
        condition: service_healthy
      capy-redis:
        condition: service_healthy
      server:
        condition: service_healthy
    # Production pins the service to cores 2-3 (COLLABORATION_CPUSET, set by
    # scripts/env/config.py render); UAT leaves it empty, which is unpinned.
    # The other services stay unpinned and may use all cores.
    cpuset: ${COLLABORATION_CPUSET:-}
    # Shutdown flushes every room's debounced save (up to 30 s behind for a
    # source room) before exiting.
    stop_grace_period: 60s
    restart: unless-stopped

  retrieval:
    image: ${CAPY_PIPELINE_IMAGE:?set CAPY_PIPELINE_IMAGE}
    environment:
      <<: [*observability, *b2]
      DATABASE_URL: *database-url
      SENTRY_DSN: ${SENTRY_DSN_RETRIEVAL:-}
      PARSER_URL: ${PARSER_URL:?set the private parser URL for Office captures}
      PARSER_TOKEN: ${PARSER_TOKEN:?set PARSER_TOKEN}
      PARSER_TIMEOUT: ${PARSER_TIMEOUT:-1320}
      GATEWAY_URL: http://server:8080
      PIPELINE_SECRET: ${PIPELINE_SECRET:?set PIPELINE_SECRET}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:?set LLM_CREDENTIALS_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      # Unset leaves curate mode's library tools unavailable.
      LIBRARY_DATABASE_URL: ${LIBRARY_DATABASE_URL:-}
      # Dedicated bucket holding the library's book PDFs, all five or none.
      # Unset leaves capture_knowledge_page unavailable.
      KNOWLEDGE_BASE_B2_ENDPOINT: ${KNOWLEDGE_BASE_B2_ENDPOINT:-}
      KNOWLEDGE_BASE_B2_REGION: ${KNOWLEDGE_BASE_B2_REGION:-}
      KNOWLEDGE_BASE_B2_BUCKET: ${KNOWLEDGE_BASE_B2_BUCKET:-}
      KNOWLEDGE_BASE_B2_KEY_ID: ${KNOWLEDGE_BASE_B2_KEY_ID:-}
      KNOWLEDGE_BASE_B2_APP_KEY: ${KNOWLEDGE_BASE_B2_APP_KEY:-}
      CAPY_INTERACTIVE_PROVIDER_TIMEOUT_S: ${CAPY_INTERACTIVE_PROVIDER_TIMEOUT_S:-15}
      CAPY_INTERACTIVE_STREAM_IDLE_S: ${CAPY_INTERACTIVE_STREAM_IDLE_S:-120}
      CAPY_INTERACTIVE_STREAM_MAX_S: ${CAPY_INTERACTIVE_STREAM_MAX_S:-600}
      # UAT only (the renderer refuses it in production, and the service will
      # not start with it unless SENTRY_ENVIRONMENT is uat): a chat message
      # carrying the [uat-scripted-tools] script runs it instead of the model.
      RETRIEVAL_UAT_SCRIPTED_TOOLS: ${RETRIEVAL_UAT_SCRIPTED_TOOLS:-}
    expose:
      - "8001"
    command:
      [
        "uvicorn",
        "pipeline.retrieve.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    healthcheck:
      # python:3.11-slim carries neither curl nor wget, so probe with urllib.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz').read()",
        ]
      interval: 10s
      timeout: 5s
      # uvicorn imports the whole pipeline package before it starts listening.
      start_period: 60s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  reconcile:
    profiles:
      - reconcile
    image: ${CAPY_SERVER_IMAGE:?set CAPY_SERVER_IMAGE}
    entrypoint: ["/app/reconcile"]
    environment:
      DATABASE_URL: *database-url
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

# Fixed names, so neither depends on the project name; Ops joins the network.
networks:
  default:
    name: capy

volumes:
  capy_pgdata:
    name: capy-pgdata
  capy_collaboration_sources:
    name: capy-collaboration-sources
