# Production stack for Coolify (or a VPS). Not for local development.
#
# CLI (from the repo root, after copying .env.prod.example → .env.prod):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Coolify: Git resource, build pack Docker Compose, file
# deploy/docker-compose.prod.yml — see openwiki/deployment-runbook.md §1.1.
#
# Differences from docker-compose.yml:
# - APP_ENV=production, no demo seed, AUTH_DISABLED off
# - /migrate runs once per deploy; the API has MIGRATE=false
# - no host port publishes (Coolify Traefik + the tunnel own the public path)
# - Postgres password comes from the environment
# - Ops deploys separately using docker-compose.ops.yml

x-observability: &observability
  APP_ENV: production
  RELEASE_SHA: ${SOURCE_COMMIT:-${RELEASE_SHA:-}}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  # The Sentry environment tag. Empty falls back to APP_ENV in code; UAT sets
  # it because its APP_ENV stays `production` to exercise production checks.
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}

# In-compose Postgres. Override DATABASE_URL in Coolify if you move to a
# managed instance, and drop or stop the `db` service in that case.
x-database-url: &database-url ${DATABASE_URL:?set the derived container database URL}

x-b2: &b2
  B2_ENDPOINT: ${B2_ENDPOINT:?set B2_ENDPOINT}
  B2_REGION: ${B2_REGION:?set B2_REGION}
  B2_BUCKET: ${B2_BUCKET:?set B2_BUCKET}
  B2_KEY_ID: ${B2_KEY_ID:?set B2_KEY_ID}
  B2_APP_KEY: ${B2_APP_KEY:?set B2_APP_KEY}
  B2_FORCE_PATH_STYLE: ${B2_FORCE_PATH_STYLE:-}
  B2_PRESIGN_TTL: ${B2_PRESIGN_TTL:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: capy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: capy
    volumes:
      - capy_pgdata:/var/lib/postgresql/data
    ports:
      - "${CAPY_PRIVATE_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capy -d capy"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${CAPY_PRIVATE_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    restart: unless-stopped

  migrate:
    build:
      context: ../server
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ../server
    environment:
      <<: [*observability, *b2]
      DATABASE_URL: *database-url
      ADDR: ":8080"
      MIGRATE: "false"
      SENTRY_DSN: ${SENTRY_DSN_GATEWAY:-}
      REDIS_URL: redis://redis:6379/0
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:?set COLLABORATION_SECRET}
      COLLABORATION_URL: ${COLLABORATION_URL:?set COLLABORATION_URL}
      COLLABORATION_INTERNAL_URL: http://collaboration:1234
      CAPY_PARSER: ${CAPY_PARSER:-mineru}
      CAPY_ENGINE: ${CAPY_ENGINE:-capy}
      PIPELINE_URL: http://retrieval:8001
      PIPELINE_SECRET: ${PIPELINE_SECRET:?set PIPELINE_SECRET}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:?set LLM_CREDENTIALS_KEY}
      APP_URL: ${APP_URL:?set APP_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?set CLERK_WEBHOOK_SECRET}
      AUTH_DISABLED: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      RATE_LIMIT_DISABLED: "false"
      RATE_LIMIT_AI_PER_HOUR: ${RATE_LIMIT_AI_PER_HOUR:-}
      CAPY_CAPTION_CACHE_TTL_DAYS: ${CAPY_CAPTION_CACHE_TTL_DAYS:-90}
    expose:
      - "8080"
    # The ingest host's import worker calls /api/internal/import/* over
    # WireGuard, the same private address Postgres and Redis publish on.
    ports:
      - "${CAPY_PRIVATE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  collaboration:
    build:
      context: ..
      dockerfile: collaboration/Dockerfile
    environment:
      <<: *observability
      API_URL: http://server:8080
      COLLABORATION_ALLOWED_ORIGINS: ${COLLABORATION_ALLOWED_ORIGINS:-${APP_URL:?set APP_URL}}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:?set COLLABORATION_SECRET}
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      PORT: "1234"
      SENTRY_DSN: ${SENTRY_DSN_COLLABORATION:-}
    expose:
      - "1234"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1234/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  retrieval:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment:
      <<: *observability
      DATABASE_URL: *database-url
      SENTRY_DSN: ${SENTRY_DSN_RETRIEVAL:-}
      GATEWAY_URL: http://server:8080
      PIPELINE_SECRET: ${PIPELINE_SECRET:?set PIPELINE_SECRET}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:?set LLM_CREDENTIALS_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      CAPY_MODEL_CONCURRENCY: ${CAPY_MODEL_CONCURRENCY:-}
      CAPY_INTERACTIVE_PROVIDER_TIMEOUT_S: ${CAPY_INTERACTIVE_PROVIDER_TIMEOUT_S:-15}
      CAPY_INTERACTIVE_STREAM_MAX_S: ${CAPY_INTERACTIVE_STREAM_MAX_S:-600}
    expose:
      - "8001"
    command:
      [
        "uvicorn",
        "pipeline.retrieve.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  reconcile:
    profiles:
      - reconcile
    build:
      context: ../server
    entrypoint: ["/app/reconcile"]
    environment:
      DATABASE_URL: *database-url
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  capy_pgdata:
