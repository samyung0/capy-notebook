# Dev stack for the Evo Notes backend.
#   docker compose -f deploy/docker-compose.yml up --build
#
# - db        : Postgres 16 + pgvector. The retrieval index lives in the same
#               schema the Go migrations own, so the stock pgvector image is
#               enough — no custom build, no Apache AGE.
# - redis     : pub/sub bus for live ingest progress (worker -> server -> SSE).
# - server    : Go gateway (the frontend's /api). Writes uploads to Backblaze
#               B2, subscribes to Redis and fans progress out over SSE.
# - worker    : Python ingest worker. Parses on Modal (GPU MinerU) or the MinerU
#               lite relay, chunks/embeds into rag_chunks, publishes progress.
# - retrieval : Python FastAPI chat/generate over the in-house retrieval index.
#
# Worker downloads B2 objects before parsing. Real ingest needs B2 credentials,
# API keys (DeepSeek/OpenRouter/Google/Whisper), and a deployed Modal parse URL.
# Set them in deploy/.env (see .env.example) or the shell environment.
#
# Only `server` (:8080) and `collaboration` (:1234) should be public. Retrieval
# (:8001), the worker, Postgres and Redis stay on the private network.

# Shared by every process that reports errors. LOG_FORMAT / LOG_LEVEL are
# omitted on purpose: an empty string from compose interpolation would override
# the code defaults (text in development, json otherwise).
x-observability: &observability
  APP_ENV: ${APP_ENV:-development}
  RELEASE_SHA: ${RELEASE_SHA:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo
      POSTGRES_DB: evo
    ports:
      # 5432 for the usual case; 5433 is an escape hatch for hosts that already
      # run a native Postgres on 5432 (which would otherwise shadow this one for
      # host-side tools like the pytest suite — see pipeline/tests/README.md).
      - "5432:5432"
      - "5433:5432"
    volumes:
      - evo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo -d evo"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  collaboration:
    build:
      context: ..
      dockerfile: collaboration/Dockerfile
    environment:
      <<: *observability
      API_URL: http://server:8080
      COLLABORATION_ALLOWED_ORIGINS: ${COLLABORATION_ALLOWED_ORIGINS:-${APP_URL:-http://localhost:5173}}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-dev-collaboration-secret}
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "1234"
      SENTRY_DSN: ${SENTRY_DSN_COLLABORATION:-}
    ports:
      - "1234:1234"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1234/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  server:
    build:
      context: ../server
    environment:
      <<: *observability
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      ADDR: ":8080"
      MIGRATE: "true"
      SENTRY_DSN: ${SENTRY_DSN_GATEWAY:-}
      # Backblaze B2 source-object storage.
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_FORCE_PATH_STYLE: ${B2_FORCE_PATH_STYLE:-}
      B2_PRESIGN_TTL: ${B2_PRESIGN_TTL:-}
      REDIS_URL: redis://redis:6379/0
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-dev-collaboration-secret}
      COLLABORATION_URL: ${COLLABORATION_URL:-ws://localhost:1234}
      COLLABORATION_INTERNAL_URL: http://collaboration:1234
      # Vestigial labels stored on the job payload; the parse route is chosen by
      # the file's parseMode, not by these.
      EVO_PARSER: ${EVO_PARSER:-mineru}
      EVO_ENGINE: ${EVO_ENGINE:-evo}
      PIPELINE_URL: http://retrieval:8001
      PIPELINE_SECRET: ${PIPELINE_SECRET:-dev-pipeline-secret}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      DEV_USER_ID: ${DEV_USER_ID:-u_1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      RATE_LIMIT_AI_PER_HOUR: ${RATE_LIMIT_AI_PER_HOUR:-}
      RATE_LIMIT_CONCURRENT_STREAMS: ${RATE_LIMIT_CONCURRENT_STREAMS:-}
      # Parse/caption cache TTLs. The worker sweeps on the same values; both
      # services run the identical statement, so they must agree.
      EVO_CAPTION_CACHE_TTL_DAYS: ${EVO_CAPTION_CACHE_TTL_DAYS:-90}
      EVO_PARSE_ZIP_TTL_HOURS: ${EVO_PARSE_ZIP_TTL_HOURS:-6}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../pipeline
    environment:
      <<: *observability
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      # Backblaze B2 source-object storage.
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      REDIS_URL: redis://redis:6379/0
      # Modal GPU MinerU parse service: one endpoint per parse mode.
      MODAL_PARSE_URL: ${MODAL_PARSE_URL:-}
      MODAL_FAST_PARSE_URL: ${MODAL_FAST_PARSE_URL:-}
      MODAL_PARSE_TOKEN: ${MODAL_PARSE_TOKEN:-}
      MODAL_PARSE_TIMEOUT: ${MODAL_PARSE_TIMEOUT:-900}
      MODAL_B2_ARTIFACTS: ${MODAL_B2_ARTIFACTS:-true}
      EVO_PARSE_METHOD: ${EVO_PARSE_METHOD:-auto}
      MAX_PARALLEL_PARSE_MODAL: ${MAX_PARALLEL_PARSE_MODAL:-2}
      # Embeddings (OpenRouter): credentials only. The model is pinned per
      # workspace from model_configs; EMBEDDING_DIM is the shipped width.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      # Text LLM (DeepSeek). The ingest model comes from each job's pin.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Figure captions (Gemini, OpenAI-compatible endpoint). Whether a file is
      # captioned at all is chosen per upload and carried on the job.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      EVO_CAPTION_CONCURRENCY: ${EVO_CAPTION_CONCURRENCY:-8}
      EVO_CAPTION_MAX_EDGE: ${EVO_CAPTION_MAX_EDGE:-1280}
      EVO_CAPTION_VERSION: ${EVO_CAPTION_VERSION:-v1}
      # Must match the gateway: whichever process sweeps first applies its own.
      EVO_CAPTION_CACHE_TTL_DAYS: ${EVO_CAPTION_CACHE_TTL_DAYS:-90}
      EVO_PARSE_ZIP_TTL_HOURS: ${EVO_PARSE_ZIP_TTL_HOURS:-6}
    command: ["python", "-m", "pipeline.ingest.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  retrieval:
    build:
      context: ../pipeline
    environment:
      <<: *observability
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN_RETRIEVAL:-}
      # Tools with side effects call back into the gateway rather than writing
      # materials directly, so the agent inherits Go's authz and quota checks.
      GATEWAY_URL: http://server:8080
      PIPELINE_SECRET: ${PIPELINE_SECRET:-dev-pipeline-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      EVO_QUERY_MODEL: ${EVO_QUERY_MODEL:-deepseek-v4-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-}
    ports:
      # Bound to localhost: this is a debug port. Do not publish :8001 on a
      # public interface — the gateway reaches retrieval over the docker network.
      - "127.0.0.1:8001:8001"
    command:
      [
        "uvicorn",
        "pipeline.retrieve.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    depends_on:
      db:
        condition: service_healthy

  reconcile:
    build:
      context: ../server
    entrypoint: ["/app/reconcile"]
    environment:
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - reconcile

volumes:
  evo_pgdata:
