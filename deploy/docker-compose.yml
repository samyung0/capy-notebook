# Dev stack for the Evo Notes backend.
#   docker compose -f deploy/docker-compose.yml up --build
#
# Production / Coolify: deploy/docker-compose.prod.yml
# (MIGRATE=false, /migrate one-shot, no host ports). See
# openwiki/deployment-runbook.md §1.1.
#
# - db        : Postgres 16 + pgvector. The retrieval index lives in the same
#               schema the Go migrations own, so the stock pgvector image is
#               enough — no custom build, no Apache AGE.
# - redis     : pub/sub bus for live ingest progress (worker -> server -> SSE).
# - server    : Go gateway (the frontend's /api). Writes uploads to Backblaze
#               B2, subscribes to Redis and fans progress out over SSE.
# - worker    : Legacy opt-in app-host worker for direct-route debugging only.
#               Normal local ingest runs on the Netcup non-production stack so
#               document parsing shares a real local volume with the parser.
# - retrieval : Python FastAPI chat/generate over the in-house retrieval index.
#
# Worker downloads B2 objects before parsing. Real ingest needs B2 credentials,
# API keys (DeepSeek/DeepInfra/Google/Whisper), and a parser service URL.
# Set them in deploy/.env (see .env.example) or the shell environment.
#
# Only `server` (:8080), `collaboration` (:1234), and the Access-protected
# `ops` service (:8082) have hostname routes. Retrieval (:8001), the worker,
# Postgres and Redis stay on the private network.

# Shared by every process that reports errors. LOG_FORMAT / LOG_LEVEL are
# omitted on purpose: an empty string from compose interpolation would override
# the code defaults (text in development, json otherwise).
x-observability: &observability
  APP_ENV: ${APP_ENV:-development}
  RELEASE_SHA: ${RELEASE_SHA:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  # The Sentry environment tag. Empty falls back to APP_ENV in code; UAT sets
  # it because its APP_ENV stays `production` to exercise production checks.
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo
      POSTGRES_DB: evo
    ports:
      # 5432 for the usual case; 5433 is an escape hatch for hosts that already
      # run a native Postgres on 5432 (which would otherwise shadow this one for
      # host-side tools like the pytest suite — see pipeline/tests/README.md).
      - "5432:5432"
      - "5433:5432"
    volumes:
      - evo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo -d evo"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  collaboration:
    build:
      context: ..
      dockerfile: collaboration/Dockerfile
    environment:
      <<: *observability
      API_URL: http://server:8080
      COLLABORATION_ALLOWED_ORIGINS: ${COLLABORATION_ALLOWED_ORIGINS:-${APP_URL:-http://localhost:5173}}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-dev-collaboration-secret}
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "1234"
      SENTRY_DSN: ${SENTRY_DSN_COLLABORATION:-}
    ports:
      - "1234:1234"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1234/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  server:
    build:
      context: ../server
    environment:
      <<: *observability
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      ADDR: ":8080"
      # Local stack: the API applies numbered files and the demo seed.
      # Production serving API should be false; run /migrate from this image first.
      MIGRATE: "true"
      SENTRY_DSN: ${SENTRY_DSN_GATEWAY:-}
      # Backblaze B2 source-object storage.
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_FORCE_PATH_STYLE: ${B2_FORCE_PATH_STYLE:-}
      B2_PRESIGN_TTL: ${B2_PRESIGN_TTL:-}
      REDIS_URL: redis://redis:6379/0
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-dev-collaboration-secret}
      COLLABORATION_URL: ${COLLABORATION_URL:-ws://localhost:1234}
      COLLABORATION_INTERNAL_URL: http://collaboration:1234
      # Vestigial labels stored on the job payload; the parse route is chosen by
      # the file's parseMode, not by these.
      EVO_PARSER: ${EVO_PARSER:-mineru}
      EVO_ENGINE: ${EVO_ENGINE:-evo}
      PIPELINE_URL: http://retrieval:8001
      PIPELINE_SECRET: ${PIPELINE_SECRET:-dev-pipeline-secret}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      DEV_USER_ID: ${DEV_USER_ID:-u_1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      RATE_LIMIT_AI_PER_HOUR: ${RATE_LIMIT_AI_PER_HOUR:-}
      # Durable caption/derived artifact cache TTL.
      EVO_CAPTION_CACHE_TTL_DAYS: ${EVO_CAPTION_CACHE_TTL_DAYS:-90}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ops:
    profiles:
      - ops
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN_OPS:-}
        VITE_APP_ENV: ${SENTRY_ENVIRONMENT:-development}
        VITE_RELEASE_SHA: ${RELEASE_SHA:-}
    environment:
      <<: *observability
      OPS_ADDR: ":8082"
      OPS_STATIC_DIR: /app/static
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:-}
      OPS_ADMIN_DATABASE_URL: ${OPS_ADMIN_DATABASE_URL:-}
      # Must match EVO_INGEST_ENVIRONMENT on the workers writing to this
      # database; the ingest pages filter on it. This stack is `local`.
      OPS_INGEST_PRIMARY_ENVIRONMENT: ${OPS_INGEST_PRIMARY_ENVIRONMENT:-local}
      OPS_INGEST_UAT_DATABASE_URL: ${OPS_INGEST_UAT_DATABASE_URL:-}
      OPS_INGEST_LOCAL_DATABASE_URL: ${OPS_INGEST_LOCAL_DATABASE_URL:-}
      OPS_CF_ACCESS_ISSUER: ${OPS_CF_ACCESS_ISSUER:-}
      OPS_CF_ACCESS_AUDIENCE: ${OPS_CF_ACCESS_AUDIENCE:-}
      OPS_CF_ACCESS_JWKS_URL: ${OPS_CF_ACCESS_JWKS_URL:-}
      OPS_ACCESS_DISABLED: ${OPS_ACCESS_DISABLED:-false}
      OPS_AUTH_DISABLED: ${OPS_AUTH_DISABLED:-false}
      OPS_UNSAFE_DEVELOPMENT: ${OPS_UNSAFE_DEVELOPMENT:-false}
      OPS_DEV_USER_ID: ${OPS_DEV_USER_ID:-u_1}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN_OPS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles:
      - app-host-ingest
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment: &app-ingest-env
      <<: *observability
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      # Backblaze B2 source-object storage.
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      REDIS_URL: redis://redis:6379/0
      # CPU MinerU pipeline service on the dedicated ingest host.
      PARSER_URL: ${PARSER_URL:-}
      PARSER_TOKEN: ${PARSER_TOKEN:-}
      PARSER_TIMEOUT: ${PARSER_TIMEOUT:-2400}
      EVO_PARSE_SLICE_TIMEOUT: ${EVO_PARSE_SLICE_TIMEOUT:-600}
      PARSER_SLOT_TTL: ${PARSER_SLOT_TTL:-2700}
      EVO_PARSE_SHARED_DIR: ${EVO_PARSE_SHARED_DIR:-/tmp/evo-parse-spool}
      EVO_PARSE_JOB_TIMEOUT: ${EVO_PARSE_JOB_TIMEOUT:-3600}
      EVO_INGEST_TIMEOUT: ${EVO_INGEST_TIMEOUT:-1200}
      # The local app-host worker may submit only one parse at a time.
      EVO_PARSE_SLOTS: "1"
      EVO_PARSE_METHOD: ${EVO_PARSE_METHOD:-auto}
      EVO_OFFICE_PREVIEW_MAX_BYTES: ${EVO_OFFICE_PREVIEW_MAX_BYTES:-134217728}
      EVO_PARSE_ARTIFACT_MAX_BYTES: ${EVO_PARSE_ARTIFACT_MAX_BYTES:-268435456}
      EVO_PARSE_ARTIFACT_MAX_ENTRIES: ${EVO_PARSE_ARTIFACT_MAX_ENTRIES:-4096}
      EVO_PARSE_ARTIFACT_MAX_ENTRY_BYTES: ${EVO_PARSE_ARTIFACT_MAX_ENTRY_BYTES:-134217728}
      EVO_PARSE_ARTIFACT_MAX_EXPANDED_BYTES: ${EVO_PARSE_ARTIFACT_MAX_EXPANDED_BYTES:-536870912}
      EVO_PARSE_CONTENT_MAX_BYTES: ${EVO_PARSE_CONTENT_MAX_BYTES:-134217728}
      EVO_PARSE_CONTENT_MAX_BLOCKS: ${EVO_PARSE_CONTENT_MAX_BLOCKS:-250000}
      EVO_PARSE_IMAGE_MAX_BYTES: ${EVO_PARSE_IMAGE_MAX_BYTES:-33554432}
      EVO_PARSE_IMAGES_MAX_BYTES: ${EVO_PARSE_IMAGES_MAX_BYTES:-268435456}
      # Platform keys match elitellm_providers.json. Model identity lives on
      # model_configs.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      EVO_CAPTION_CONCURRENCY: ${EVO_CAPTION_CONCURRENCY:-8}
      EVO_CAPTION_MAX_EDGE: ${EVO_CAPTION_MAX_EDGE:-1280}
      EVO_CAPTION_VERSION: ${EVO_CAPTION_VERSION:-v2}
      EVO_IMAGE_MAX_PIXELS: ${EVO_IMAGE_MAX_PIXELS:-100000000}
      EVO_ELEVENLABS_TRANSCRIPT_VERSION: ${EVO_ELEVENLABS_TRANSCRIPT_VERSION:-scribe-v2-1}
      EVO_ELEVENLABS_CONCURRENCY_UNITS: ${EVO_ELEVENLABS_CONCURRENCY_UNITS:-12}
      EVO_ELEVENLABS_SYNC_TIMEOUT_S: ${EVO_ELEVENLABS_SYNC_TIMEOUT_S:-43200}
      EVO_AUDIO_MAX_DURATION_SECONDS: ${EVO_AUDIO_MAX_DURATION_SECONDS:-36000}
      EVO_TABULAR_TEXT_VERSION: ${EVO_TABULAR_TEXT_VERSION:-v1}
      # Must match the gateway: whichever process sweeps first applies its own.
      EVO_CAPTION_CACHE_TTL_DAYS: ${EVO_CAPTION_CACHE_TTL_DAYS:-90}
      EVO_PARSE_ZIP_TTL_HOURS: ${EVO_PARSE_ZIP_TTL_HOURS:-6}
      EVO_PARSE_SOURCE_TTL_HOURS: ${EVO_PARSE_SOURCE_TTL_HOURS:-2}
    command: ["python", "-m", "pipeline.ingest.worker"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  parse-coordinator:
    profiles:
      - app-host-ingest
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment:
      <<: *app-ingest-env
      EVO_PARSE_COORDINATOR_CONCURRENCY: "1"
      EVO_DB_SYNC_POOL_MAX_SIZE: "2"
      EVO_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.parse_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  import-worker:
    profiles:
      - app-host-ingest
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment:
      <<: *app-ingest-env
      GATEWAY_URL: http://server:8080
      PIPELINE_SECRET: ${PIPELINE_SECRET:-dev-pipeline-secret}
      EVO_DB_SYNC_POOL_MAX_SIZE: "2"
      EVO_DB_ASYNC_POOL_MAX_SIZE: "2"
    command: ["python", "-m", "pipeline.ingest.import_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  retrieval:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment:
      <<: *observability
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN_RETRIEVAL:-}
      # Tools with side effects call back into the gateway rather than writing
      # materials directly, so the agent inherits Go's authz and quota checks.
      GATEWAY_URL: http://server:8080
      PIPELINE_SECRET: ${PIPELINE_SECRET:-dev-pipeline-secret}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
    ports:
      # Bound to localhost: this is a debug port. Do not publish :8001 on a
      # public interface — the gateway reaches retrieval over the docker network.
      - "127.0.0.1:8001:8001"
    command:
      [
        "uvicorn",
        "pipeline.retrieve.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    depends_on:
      db:
        condition: service_healthy

  reconcile:
    build:
      context: ../server
    entrypoint: ["/app/reconcile"]
    environment:
      DATABASE_URL: postgres://evo:evo@db:5432/evo?sslmode=disable
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - reconcile

volumes:
  evo_pgdata:
