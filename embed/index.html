<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Interactive snippet</title>
    <script>
    'use strict';
    // Frame for a note's interactive HTML block (deployment-runbook.md §2.3).
    // The note posts {type: 'render', html, theme} once; the snippet then
    // replaces this page, so its inline scripts and load events run as on a
    // normal page, and the frame reports its height as {type: 'resize',
    // height}. The CSP header in _headers blocks every request, and this page
    // makes none.
    addEventListener('message', function render(event) {
      const data = event.data;
      if (
        event.source !== parent ||
        data?.type !== 'render' ||
        typeof data.html !== 'string' ||
        typeof data.theme !== 'object' ||
        data.theme === null
      )
        return;
      removeEventListener('message', render);
      document.open();
      document.write('<!doctype html><head>');
      // Theme tokens come before the snippet, so its own :root rules win.
      const sheet = document.head.appendChild(
        document.createElement('style')
      ).sheet;
      const root = sheet.cssRules[sheet.insertRule(':root{}')].style;
      for (const [name, value] of Object.entries(data.theme))
        if (name.startsWith('--') && typeof value === 'string')
          root.setProperty(name, value);
      document.write(data.html);
      document.close();
      const html = document.documentElement;
      new ResizeObserver(() =>
        parent.postMessage(
          {
            height: Math.ceil(html.getBoundingClientRect().height),
            type: 'resize',
          },
          '*'
        )
      ).observe(html);
    });
    </script>
  </head>
  <body></body>
</html>
