[project]
name = "cmv-manimgx"
version = "0.1.0"
description = "Export ManimGX scenes to CMV films, the files Capy plays without running Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "manimgx==0.1.1",  # drawn films are played by this version's web player
    "numpy",
    "zstandard",
]

[project.scripts]
cmv-manimgx = "cmv_manimgx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmv_manimgx"]
