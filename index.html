<!doctype html>
<html data-mode="light" data-theme="classroom" lang="en">
  <head>
    <meta charset="UTF-8">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="light dark" name="color-scheme">
    <title>Evo Notes</title>

    <script>
    'use strict';
    (() => {
      try {
        const root = document.documentElement;
        const style = localStorage.getItem('evo.style');
        const theme = localStorage.getItem('evo.theme');

        root.dataset.style =
          style === 'classroom' || style === 'notion' ? style : 'classroom';
        root.dataset.theme =
          theme === 'light' || theme === 'dark'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        // Keep the HTML defaults if storage is unavailable.
      }
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
