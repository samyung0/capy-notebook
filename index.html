<!doctype html>
<html data-style="classroom" data-theme="latte" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="%VITE_RELEASE_SHA%" name="capy-release">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <meta
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
      name="viewport"
    >
    <meta content="light dark" name="color-scheme">
    <title>Capy Notebook</title>
    <script blocking="render" type="module">
    (() => {
      try {
        const STYLES = ['classroom', 'notion'];
        const THEMES = ['latte', 'frappe', 'mocha'];
        const DARKTHEMES = ['frappe', 'mocha'];
        const root = document.documentElement;
        const style = localStorage.getItem('capy.style');
        let theme = localStorage.getItem('capy.theme');
        if (theme === 'macchiato') {
          theme = 'frappe';
          localStorage.setItem('capy.theme', theme);
        }

        root.dataset.style = STYLES.includes(style) ? style : 'classroom';
        root.dataset.theme = THEMES.includes(theme)
          ? theme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'mocha'
            : 'latte';
        if (DARKTHEMES.includes(root.dataset.theme)) {
          root.classList.add('dark');
        }
        // The note font pick (src/features/notes/noteFont.ts).
        const noteFont = localStorage.getItem('capy.noteFont');
        if (noteFont === 'fustat' || noteFont === 'system') {
          root.dataset.noteFont = noteFont;
        }
      } catch {
        // ignore
      }
    })();
    </script>
    <!-- A failed load of the entry script or a script chunk it needs while the
         boot loader still shows (a fresh load during a deploy, whose old page
         names files the new release removed) replaces the loader with the
         app's reload message (messages/ error_chunk_title, error_chunk_body,
         error_action_reload), in the app's locale (localStorage, then the
         browser's languages). Classic and inline, so it runs before the entry
         and stays out of the bundle; the SPA's script policy allows it by
         hash (vite-image-policy.ts). -->
    <script>
    'use strict';
    addEventListener(
      'error',
      (event) => {
        const failed = event.target;
        const url =
          failed instanceof HTMLScriptElement && failed.type === 'module'
            ? failed.src
            : failed instanceof HTMLLinkElement &&
                failed.rel === 'modulepreload'
              ? failed.href
              : '';
        const loader = document.querySelector(
          '#root > .boot-loader[role="status"]'
        );
        if (!(url && loader && new URL(url).origin === location.origin)) {
          return;
        }
        let locale = '';
        try {
          locale = localStorage.getItem('PARAGLIDE_LOCALE') || '';
        } catch {
          // ignore
        }
        if (locale !== 'en' && locale !== 'zh') {
          locale =
            (navigator.languages || [])
              .map((tag) => tag.split('-')[0].toLowerCase())
              .find((tag) => tag === 'en' || tag === 'zh') || 'en';
        }
        const [title, body, action] =
          locale === 'zh'
            ? [
                '有可用更新',
                '请重新加载页面以使用最新版本的 Capy Notebook。',
                '重新加载',
              ]
            : [
                'An update is ready',
                'Reload the page to use the latest version of Capy Notebook.',
                'Reload',
              ];
        const message = document.createElement('div');
        const heading = document.createElement('h1');
        const text = document.createElement('p');
        const button = document.createElement('button');
        heading.textContent = title;
        text.textContent = body;
        button.textContent = action;
        button.type = 'button';
        button.addEventListener('click', () => location.reload());
        message.append(heading, text, button);
        loader.lang = locale;
        loader.setAttribute('role', 'alert');
        loader.removeAttribute('aria-label');
        loader.replaceChildren(message);
      },
      true
    );
    </script>
    <!-- Boot loader until React replaces #root: the Spinner's leapfrog
         (src/components/ui/feedback.css) at LoadingLarge's 28px, on the page
         colours of the style and theme set above. Own class names, because
         these rules are unlayered and would beat the app's. -->
    <style>
    .boot-loader {
      --bg: #f7f7f7;
      --fg: #222222;
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--fg);
      background: var(--bg);
    }
    [data-theme="frappe"] .boot-loader {
      --bg: #141a23;
      --fg: #eef1f5;
    }
    [data-theme="mocha"] .boot-loader {
      --bg: #0d1219;
      --fg: #e6e9ef;
    }
    [data-style="notion"] .boot-loader {
      --bg: #f7f7f5;
      --fg: #37352f;
    }
    [data-style="notion"][data-theme="frappe"] .boot-loader {
      --bg: #1d1d1f;
      --fg: #d8d7d5;
    }
    [data-style="notion"][data-theme="mocha"] .boot-loader {
      --bg: #171717;
      --fg: #d4d4d2;
    }
    .boot-loader > span {
      position: relative;
      width: 28px;
      height: 28px;
    }
    .boot-loader i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      animation: boot-leap 2.5s ease infinite;
    }
    .boot-loader i::before {
      width: 22%;
      aspect-ratio: 1;
      content: "";
      background: currentColor;
      border-radius: 50%;
    }
    .boot-loader i:nth-child(2) {
      animation-delay: calc(2.5s / -1.5);
    }
    .boot-loader i:nth-child(3) {
      animation-delay: calc(2.5s / -3);
    }
    /* The reload message the script above writes over the spinner. */
    .boot-loader > div {
      display: grid;
      gap: 6px;
      justify-items: center;
      max-width: 42rem;
      padding: 0 24px;
      font:
        500 16px / 1.5 system-ui,
        sans-serif;
      text-align: center;
    }
    .boot-loader h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
    }
    .boot-loader p {
      margin: 0;
    }
    .boot-loader button {
      padding: 6px 14px;
      margin-top: 26px;
      font: inherit;
      font-weight: 700;
      color: inherit;
      cursor: pointer;
      background: none;
      border: 1px solid;
      border-radius: 8px;
    }
    @keyframes boot-leap {
      0% {
        transform: translateX(0) rotate(0deg);
      }
      33.333% {
        transform: translateX(0) rotate(180deg);
      }
      66.666% {
        transform: translateX(-38%) rotate(180deg);
      }
      99.999% {
        transform: translateX(-78%) rotate(180deg);
      }
      100% {
        transform: translateX(0) rotate(0deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-loader i {
        animation: none;
      }
      .boot-loader i:nth-child(2) {
        transform: translateX(40%);
      }
      .boot-loader i:nth-child(3) {
        transform: translateX(80%);
      }
    }
    </style>
  </head>
  <body>
    <div id="root">
      <div aria-label="Loading" class="boot-loader" role="status">
        <span><i></i><i></i><i></i></span>
      </div>
    </div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
