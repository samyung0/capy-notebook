<!doctype html>
<html data-style="classroom" data-theme="latte" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="%VITE_RELEASE_SHA%" name="capy-release">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <meta
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
      name="viewport"
    >
    <meta content="light dark" name="color-scheme">
    <title>Capy Notebook</title>
    <!-- The chosen style and theme from the first paint, so the boot loader
         and its reload message use them. Classic and inline: Vite would
         bundle a module script into the entry, which runs only after the
         bundle loads; the SPA's script policy allows it by hash
         (vite-image-policy.ts). -->
    <script>
    'use strict';
    (() => {
      try {
        const STYLES = ['classroom', 'notion'];
        const THEMES = ['latte', 'frappe', 'mocha'];
        const DARKTHEMES = ['frappe', 'mocha'];
        const root = document.documentElement;
        const style = localStorage.getItem('capy.style');
        let theme = localStorage.getItem('capy.theme');
        if (theme === 'macchiato') {
          theme = 'frappe';
          localStorage.setItem('capy.theme', theme);
        }

        root.dataset.style = STYLES.includes(style) ? style : 'classroom';
        root.dataset.theme = THEMES.includes(theme)
          ? theme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'mocha'
            : 'latte';
        if (DARKTHEMES.includes(root.dataset.theme)) {
          root.classList.add('dark');
        }
        // The note font pick (src/features/notes/noteFont.ts).
        const noteFont = localStorage.getItem('capy.noteFont');
        if (noteFont === 'fustat' || noteFont === 'system') {
          root.dataset.noteFont = noteFont;
        }
      } catch {
        // ignore
      }
    })();
    </script>
    <!-- A failed load of the entry script, a script chunk it needs or a
         stylesheet while the boot loader still shows (a fresh load during a
         deploy, whose old page names files the new release removed) replaces
         the loader with the app's reload message (messages/ error_chunk_title,
         error_chunk_body, error_action_reload), in the app's locale
         (localStorage, then the browser's languages); the entry then leaves
         it there and never boots (src/main.tsx). Classic and inline, so it
         runs before the entry and stays out of the bundle; the SPA's script
         policy allows it by hash (vite-image-policy.ts). -->
    <script>
    'use strict';
    addEventListener(
      'error',
      function onError(event) {
        const failed = event.target;
        const url =
          failed instanceof HTMLScriptElement && failed.type === 'module'
            ? failed.src
            : failed instanceof HTMLLinkElement &&
                (failed.rel === 'modulepreload' || failed.rel === 'stylesheet')
              ? failed.href
              : '';
        if (!(url && new URL(url).origin === location.origin)) {
          return;
        }
        // A file in <head> can fail before the parser reaches the loader: try
        // again once the body is parsed. The document turns interactive ahead
        // of the entry, which also waits for the head's stylesheets.
        if (document.readyState === 'loading') {
          document.addEventListener('readystatechange', () => onError(event), {
            once: true,
          });
          return;
        }
        const loader = document.querySelector(
          '#root > .boot-loader[role="status"]'
        );
        if (!loader) {
          return;
        }
        let locale = '';
        try {
          locale = localStorage.getItem('PARAGLIDE_LOCALE') || '';
        } catch {
          // ignore
        }
        if (locale !== 'en' && locale !== 'zh') {
          locale =
            (navigator.languages || [])
              .map((tag) => tag.split('-')[0].toLowerCase())
              .find((tag) => tag === 'en' || tag === 'zh') || 'en';
        }
        const [title, body, action] =
          locale === 'zh'
            ? [
                '有可用更新',
                '请重新加载页面以使用最新版本的 Capy Notebook。',
                '重新加载',
              ]
            : [
                'An update is ready',
                'Reload the page to use the latest version of Capy Notebook.',
                'Reload',
              ];
        // ErrorState's page variant (src/components/app/ErrorState.tsx): the
        // error icon tile, title and body, then ErrorAction's Reload with the
        // refresh icon. The icons are Hugeicons' Alert02 and RefreshCcw.
        const svg = (paths) =>
          '<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">' +
          paths.map((d) => '<path d="' + d + '"/>').join('') +
          '</svg>';
        const message = document.createElement('div');
        const tile = document.createElement('span');
        const copy = document.createElement('div');
        const heading = document.createElement('h1');
        const text = document.createElement('p');
        const button = document.createElement('button');
        tile.innerHTML = svg([
          'M13.9248 21H10.0752C5.44476 21 3.12955 21 2.27636 19.4939C1.42317 17.9879 2.60736 15.9914 4.97574 11.9985L6.90057 8.75333C9.17559 4.91778 10.3131 3 12 3C13.6869 3 14.8244 4.91777 17.0994 8.75332L19.0243 11.9985C21.3926 15.9914 22.5768 17.9879 21.7236 19.4939C20.8704 21 18.5552 21 13.9248 21Z',
          'M12 9V13',
          'M12.125 16.75H12M12.25 16.75C12.25 16.8881 12.1381 17 12 17C11.8619 17 11.75 16.8881 11.75 16.75C11.75 16.6119 11.8619 16.5 12 16.5C12.1381 16.5 12.25 16.6119 12.25 16.75Z',
        ]);
        heading.textContent = title;
        text.textContent = body;
        button.textContent = action;
        button.insertAdjacentHTML(
          'beforeend',
          svg([
            'M20.9373 13C20.9736 12.6717 20.9922 12.338 20.9922 12C20.9922 7.02944 16.9628 3 11.9922 3C9.16492 3 6.64214 4.30367 4.99219 6.34267M3.04712 11C3.01082 11.3283 2.99219 11.662 2.99219 12C2.99219 16.9706 7.02162 21 11.9922 21C14.8195 21 17.3422 19.6963 18.9922 17.6573',
            'M7.99219 7H6.99219C5.57797 7 4.87087 7 4.43153 6.56066C3.99219 6.12132 3.99219 5.41421 3.99219 4V3',
            'M15.9922 17H16.9922C18.4064 17 19.1135 17 19.5528 17.4393C19.9922 17.8787 19.9922 18.5858 19.9922 20V21',
          ])
        );
        button.type = 'button';
        button.addEventListener('click', () => location.reload());
        copy.append(heading, text);
        message.append(tile, copy, button);
        loader.lang = locale;
        loader.setAttribute('role', 'alert');
        loader.removeAttribute('aria-label');
        loader.replaceChildren(message);
      },
      true
    );
    </script>
    <!-- Boot loader until React replaces #root: the Spinner's leapfrog
         (src/components/ui/feedback.css) at LoadingLarge's 28px, on the page
         colours of the style and theme set above. Own class names, because
         these rules are unlayered and would beat the app's. -->
    <style>
    .boot-loader {
      --bg: #f7f7f7;
      --fg: #222222;
      --error-bg: #fdeaec;
      --error-fg: #b8475a;
      --hover-bg: #f7f8f8;
      --tile-radius: 24px;
      --button-radius: 12px;
      --title-size: clamp(
        1.1875rem,
        calc(1.1875rem + 3 * (100vw - 360px) / 408),
        1.375rem
      );
      --title-weight: 800;
      --title-line-height: 1.45;
      --subtitle-size: 1rem;
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-family:
        "Fustat Variable", "Fustat", system-ui, -apple-system, "Segoe UI",
        sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    [data-theme="frappe"] .boot-loader {
      --bg: #141a23;
      --fg: #eef1f5;
      --error-bg: #433a4a;
      --error-fg: #f38ba8;
      --hover-bg: #2e3b4f;
    }
    [data-theme="mocha"] .boot-loader {
      --bg: #0d1219;
      --fg: #e6e9ef;
      --error-bg: #3c303d;
      --error-fg: #f38ba8;
      --hover-bg: #232c3a;
    }
    [data-style="notion"] .boot-loader {
      --bg: #f7f7f5;
      --fg: #37352f;
      --error-bg: #fbe4e4;
      --error-fg: #d44c47;
      --hover-bg: #f7f7f6;
      --tile-radius: 10px;
      --button-radius: 6px;
      --title-size: 1.25rem;
      --title-weight: 600;
      --title-line-height: 1.35;
      --subtitle-size: 0.875rem;
      font-family:
        ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
        sans-serif;
    }
    [data-style="notion"][data-theme="frappe"] .boot-loader {
      --bg: #1d1d1f;
      --fg: #d8d7d5;
      --error-bg: #301f1e;
      --error-fg: #df7773;
      --hover-bg: #2a2a2e;
    }
    [data-style="notion"][data-theme="mocha"] .boot-loader {
      --bg: #171717;
      --fg: #d4d4d2;
      --error-bg: #2e1c1b;
      --error-fg: #df7773;
      --hover-bg: #252525;
    }
    @media (max-width: 767px) {
      [data-style="notion"] .boot-loader {
        --title-size: 1.125rem;
        --subtitle-size: 0.8125rem;
      }
    }
    .boot-loader > span {
      position: relative;
      width: 28px;
      height: 28px;
    }
    .boot-loader i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      animation: boot-leap 2.5s ease infinite;
    }
    .boot-loader i::before {
      width: 22%;
      aspect-ratio: 1;
      content: "";
      background: currentColor;
      border-radius: 50%;
    }
    .boot-loader i:nth-child(2) {
      animation-delay: calc(2.5s / -1.5);
    }
    .boot-loader i:nth-child(3) {
      animation-delay: calc(2.5s / -3);
    }
    /* The reload message the script above writes over the spinner, in
               ErrorState's page variant (src/components/app/ErrorState.tsx). */
    .boot-loader > div {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      max-width: 42rem;
      padding: 0 24px;
      text-align: center;
    }
    .boot-loader > div > span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      color: var(--error-fg);
      background: var(--error-bg);
      border-radius: var(--tile-radius);
    }
    .boot-loader > div > div {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .boot-loader h1 {
      margin: 4px 0 0;
      font-size: var(--title-size);
      font-weight: var(--title-weight);
      line-height: var(--title-line-height);
    }
    .boot-loader p {
      margin: 0;
      font-size: var(--subtitle-size);
      font-weight: 500;
      line-height: 1.45;
    }
    .boot-loader button {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      height: 40px;
      padding: 0 20px;
      margin-top: 16px;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      line-height: 1;
      color: inherit;
      cursor: pointer;
      background: none;
      border: none;
      border-radius: var(--button-radius);
      transition: background-color 150ms ease-out;
    }
    .boot-loader button:hover {
      background: color-mix(in srgb, var(--hover-bg) 80%, transparent);
    }
    .boot-loader button svg {
      width: 18px;
      height: 18px;
    }
    .boot-loader > div > span svg {
      width: 28px;
      height: 28px;
    }
    @media (min-width: 640px) {
      .boot-loader button {
        height: 44px;
      }
    }
    @keyframes boot-leap {
      0% {
        transform: translateX(0) rotate(0deg);
      }
      33.333% {
        transform: translateX(0) rotate(180deg);
      }
      66.666% {
        transform: translateX(-38%) rotate(180deg);
      }
      99.999% {
        transform: translateX(-78%) rotate(180deg);
      }
      100% {
        transform: translateX(0) rotate(0deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-loader i {
        animation: none;
      }
      .boot-loader i:nth-child(2) {
        transform: translateX(40%);
      }
      .boot-loader i:nth-child(3) {
        transform: translateX(80%);
      }
    }
    </style>
  </head>
  <body>
    <div id="root">
      <div aria-label="Loading" class="boot-loader" role="status">
        <span><i></i><i></i><i></i></span>
      </div>
    </div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
