<!doctype html>
<html data-theme="latte" data-style="classroom" lang="en">
  <head>
    <meta charset="UTF-8">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="light dark" name="color-scheme">
    <title>Evo Notes</title>

    <script type="module" blocking="render">
    'use strict';
    (() => {
      try {
        const STYLES = ['classroom', 'notion'];
        const THEMES = ['latte', 'mocha'];
        const DARKTHEMES = ['mocha'];
        const root = document.documentElement;
        const style = localStorage.getItem('evo.style');
        const theme = localStorage.getItem('evo.theme');

        root.dataset.style =
          STYLES.includes(style) ? style : 'classroom';
        root.dataset.theme =
          THEMES.includes(theme)
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'mocha'
              : 'latte';
        if (DARKTHEMES.includes(theme)) {
          root.classList.add('dark');
        }
      } catch {
        // ignore
      }
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
