      type: object
    UpdateQuizContentReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateQuizContentReq.json
          format: uri
          readOnly: true
          type: string
        expectedRevision:
          format: int64
          minimum: 1
          type: integer
        questions:
          items:
            additionalProperties: {}
            type: object
          type: array
      required:
        - expectedRevision
      type: object
    UpdateQuizMetadataReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateQuizMetadataReq.json
          format: uri
          readOnly: true
          type: string
        chapters:
          items:
            type: string
          type: array
        name:
          maxLength: 120
          minLength: 1
          type: string
      type: object
    UpdateStandaloneSharingReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateStandaloneSharingReq.json
          format: uri
          readOnly: true
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
          description: Visibility for a standalone material
      required:
        - privacy
      type: object
    UpdateTaskReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateTaskReq.json
          format: uri
          readOnly: true
          type: string
        done:
          type: boolean
        meta:
          maxLength: 500
          type: string
        title:
          maxLength: 80
          minLength: 1
          type: string
      type: object
    UpdateWorkspaceMemberReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateWorkspaceMemberReq.json
          format: uri
          readOnly: true
          type: string
        role:
          $ref: "#/components/schemas/AssignableRole"
      required:
        - role
      type: object
    UpdateWorkspaceReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateWorkspaceReq.json
          format: uri
          readOnly: true
          type: string
        autoProcess:
          type: boolean
        clearCover:
          description: true removes the cover; refused together with cover
          type: boolean
        cover:
          $ref: "#/components/schemas/Cover"
          description: Replaces the card's cover art
        description:
          description: Optional workspace description; empty clears it
          maxLength: 500
          type: string
        iconId:
          minLength: 1
          pattern: ^$|^((sprouts|notionists)-(0[1-9]|1[0-2])|critters-(0[1-9]|1[0-6])|avataaars-(0[1-9]|1[0-9]|2[0-4])|waves-(0[1-9]|1[01]))$
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        tags:
          description: Tags; at most 5
          items:
            $ref: "#/components/schemas/TagInput"
          maxItems: 5
          type: array
      type: object
    UpdateWorkspaceSharingReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateWorkspaceSharingReq.json
          format: uri
          readOnly: true
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        shareRole:
          $ref: "#/components/schemas/ShareRole"
      type: object
    UpsertLLMCredentialReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpsertLLMCredentialReq.json
          format: uri
          readOnly: true
          type: string
        apiKey:
          maxLength: 512
          type: string
        providerSlug:
          type: string
      required:
        - providerSlug
        - apiKey
      type: object
    UsageBucket:
      additionalProperties: false
      properties:
        creditMicros:
          format: int64
          type: integer
        events:
          format: int64
          type: integer
        key:
          type: string
      required:
        - key
        - events
        - creditMicros
      type: object
    UsageEventPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UsageEventPage.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/UsageEventView"
          type: array
        next:
          type: string
      required:
        - items
      type: object
    UsageEventView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        creditMicros:
          format: int64
          type: integer
        inputTokens:
          format: int64
          type: integer
        kind:
          type: string
        modelSlug:
          type: string
        outputTokens:
          format: int64
          type: integer
        providerSlug:
          type: string
        surface:
          type: string
        unit:
          type: string
        units:
          format: int64
          type: integer
      required:
        - createdAt
        - kind
        - surface
        - providerSlug
        - modelSlug
        - inputTokens
        - outputTokens
        - units
        - unit
        - creditMicros
      type: object
    UsageReport:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UsageReport.json
          format: uri
          readOnly: true
          type: string
        bySurface:
          items:
            $ref: "#/components/schemas/UsageBucket"
          type: array
      required:
        - bySurface
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        account:
          $ref: "#/components/schemas/AccountStatus"
        avatarIconId:
          type: string
        avatarUrl:
          type: string
        chatModel:
          $ref: "#/components/schemas/Ref"
        classLabel:
          type: string
        editorModel:
          $ref: "#/components/schemas/Ref"
        email:
          type: string
        id:
          type: string
        locale:
          type: string
        name:
          type: string
        planTier:
          $ref: "#/components/schemas/PlanTier"
        streak:
          format: int64
          type: integer
        studyPreferences:
          $ref: "#/components/schemas/StudyPreferences"
        studyProgress:
          type: boolean
        subscriptionStatus:
          $ref: "#/components/schemas/SubscriptionStatus"
      required:
        - account
        - id
        - name
        - email
        - streak
        - locale
        - studyProgress
        - studyPreferences
        - chatModel
        - editorModel
        - planTier
        - subscriptionStatus
      type: object
    UserColor:
      enum:
        - green
        - purple
        - blue
        - amber
        - coral
        - graphite
        - transparent
      type: string
    UserModelSlot:
      enum:
        - chat
        - editor
      type: string
    Workspace:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Workspace.json
          format: uri
          readOnly: true
          type: string
        autoProcess:
          type: boolean
        canClone:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/AccessCapabilities"
        chapterCount:
          format: int64
          type: integer
        cover:
          $ref: "#/components/schemas/Cover"
          description: The card's cover art; absent means none
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        fileCount:
          format: int64
          type: integer
        filesLimit:
          format: int64
          type: integer
        iconId:
          type: string
        id:
          type: string
        isOwner:
          type: boolean
        lastAccessedAt:
          format: date-time
          type: string
        name:
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        sharePath:
          type: string
        shareRole:
          $ref: "#/components/schemas/ShareRole"
        storageOwnerState:
          $ref: "#/components/schemas/AccountState"
        storageOwnerUsage:
          $ref: "#/components/schemas/StorageUsageLevel"
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
      required:
        - autoProcess
        - description
        - id
        - name
        - iconId
        - privacy
        - shareRole
        - sharePath
        - tags
        - chapterCount
        - fileCount
        - filesLimit
        - createdAt
        - lastAccessedAt
        - isOwner
        - capabilities
        - canClone
      type: object
    WorkspaceCollaborator:
      additionalProperties: false
      properties:
        avatarUrl:
          type: string
        name:
          type: string
        userId:
          type: string
      required:
        - userId
        - name
      type: object
    WorkspaceMember:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/WorkspaceMember.json
          format: uri
          readOnly: true
          type: string
        avatarUrl:
          type: string
        createdAt:
          format: date-time
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        userId:
          type: string
        workspaceId:
          type: string
      required:
        - workspaceId
        - userId
        - name
        - role
        - createdAt
      type: object
    WorkspaceRole:
      enum:
        - owner
        - editor
        - viewer
      type: string
    WorkspaceStats:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/WorkspaceStats.json
          format: uri
          readOnly: true
          type: string
        attempts:
          format: int64
          type: integer
        avgScore:
          format: int64
          type: integer
        chapters:
          format: int64
          type: integer
        fileChanges:
          items:
            $ref: "#/components/schemas/FileChange"
          type: array
        files:
          format: int64
          type: integer
        indexed:
          format: int64
          type: integer
        notIndexable:
          format: int64
          type: integer
        notIndexed:
          format: int64
          type: integer
        pendingNotes:
          format: int64
          type: integer
        quizzes:
          format: int64
          type: integer
      required:
        - indexed
        - notIndexed
        - notIndexable
        - fileChanges
        - pendingNotes
        - chapters
        - files
        - quizzes
        - attempts
        - avgScore
      type: object
    WorkspaceSummary:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/WorkspaceSummary.json
          format: uri
          readOnly: true
          type: string
        author:
          type: string
        authorAvatarUrl:
          type: string
        chapters:
          items:
            $ref: "#/components/schemas/WorkspaceSummaryChapter"
          type: array
        description:
          type: string
        files:
          description: Unfiled files
          items:
            $ref: "#/components/schemas/WorkspaceSummaryFile"
          type: array
        iconId:
          type: string
        name:
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        tags:
          items:
            type: string
          type: array
      required:
        - name
        - iconId
        - author
        - description
        - privacy
        - tags
        - chapters
        - files
      type: object
    WorkspaceSummaryChapter:
      additionalProperties: false
      properties:
        files:
          items:
            $ref: "#/components/schemas/WorkspaceSummaryFile"
          type: array
        name:
          type: string
      required:
        - name
        - files
      type: object
    WorkspaceSummaryFile:
      additionalProperties: false
      properties:
        addedAt:
          format: date-time
          type: string
        name:
          type: string
        sizeBytes:
          format: int64
          type: integer
      required:
        - name
        - sizeBytes
        - addedAt
      type: object
info:
  title: Capy Notebook API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/account/deletion:
    get:
      operationId: getDeletionPreflight
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionPreflight"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What account deletion would destroy, and what blocks it
      tags:
        - Account
    post:
      operationId: requestAccountDeletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAccountDeletionReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Schedule account deletion
      tags:
        - Account
  /api/attempts:
    get:
      operationId: listAttempts
      parameters:
        - explode: false
          in: query
          name: sort
          schema:
            default: date
            enum:
              - date
              - score
            type: string
        - explode: false
          in: query
          name: dir
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Comma-separated workspace ids; the quiz's current workspace
          explode: false
          in: query
          name: workspaceId
          schema:
            description: Comma-separated workspace ids; the quiz's current workspace
            type: string
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 30
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List attempts
      tags:
        - Quizzes
  /api/attempts/{id}:
    get:
      operationId: getAttempt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an attempt's result breakdown
      tags:
        - Quizzes
  /api/bank/assets:
    post:
      operationId: uploadBankAsset
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
              required:
                - file
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAssetOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload a public question figure
      tags:
        - Question bank
  /api/bank/copy:
    post:
      operationId: copyBankQuestions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankCopyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankCopyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Copy bank questions into a workspace quiz
      tags:
        - Question bank
  /api/bank/progress:
    get:
      operationId: bankProgress
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProgressOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Topics the learner has answered questions in
      tags:
        - Question bank
  /api/bank/questions:
    get:
      operationId: bankQuestionBatch
      parameters:
        - description: Comma-separated question ids, returned in this order
          explode: false
          in: query
          name: ids
          required: true
          schema:
            description: Comma-separated question ids, returned in this order
            items:
              type: string
            maxItems: 50
            minItems: 1
            nullable: true
            type: array
            uniqueItems: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankBatchBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read bank questions by id
      tags:
        - Question bank
  /api/bank/questions/{id}:
    get:
      operationId: bankQuestion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a bank question without answers
      tags:
        - Question bank
    put:
      operationId: saveBankQuestion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankSaveInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a bank question
      tags:
        - Question bank
  /api/bank/questions/{id}/check:
    post:
      operationId: checkBankQuestion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckBankQuestionReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradedQuestion"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Grade and record one question's answers
      tags:
        - Question bank
  /api/bank/questions/{id}/comments:
    post:
      operationId: commentBankQuestion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankCommentInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Email a question comment
      tags:
        - Question bank
  /api/bank/questions/{id}/edit:
    get:
      operationId: bankQuestionForEdit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a bank question with its answers to edit it
      tags:
        - Question bank
  /api/bank/questions/{id}/review:
    put:
      operationId: reviewBankQuestion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankReviewInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set the review marker
      tags:
        - Question bank
  /api/bank/syllabus:
    get:
      operationId: bankSyllabus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Syllabus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read the exam syllabus
      tags:
        - Question bank
  /api/bank/topics/{topicId}/marks:
    get:
      operationId: bankTopicMarks
      parameters:
        - in: path
          name: topicId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankMarksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Latest scores for a topic's questions
      tags:
        - Question bank
  /api/bank/topics/{topicId}/questions:
    get:
      operationId: bankQuestions
      parameters:
        - in: path
          name: topicId
          required: true
          schema:
            type: string
        - description: Comma-separated answer types; a question matches if any of its parts has one
          explode: false
          in: query
          name: type
          schema:
            description: Comma-separated answer types; a question matches if any of its parts has one
            type: string
        - description: "Comma-separated latest results: correct, wrong, partial, notDone"
          explode: false
          in: query
          name: status
          schema:
            description: "Comma-separated latest results: correct, wrong, partial, notDone"
            type: string
        - description: Case-insensitive text in the question preview
          explode: false
          in: query
          name: q
          schema:
            description: Case-insensitive text in the question preview
            maxLength: 200
            type: string
        - description: Only questions without a review marker
          explode: false
          in: query
          name: unreviewed
          schema:
            description: Only questions without a review marker
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from the previous page's nextCursor or prevCursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from the previous page's nextCursor or prevCursor
            type: string
        - description: "A question id: the page holding it, when no cursor is given"
          explode: false
          in: query
          name: around
          schema:
            description: "A question id: the page holding it, when no cursor is given"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List topic questions
      tags:
        - Question bank
  /api/bank/topics/{topicId}/summary:
    get:
      operationId: bankTopicSummary
      parameters:
        - in: path
          name: topicId
          required: true
