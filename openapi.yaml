components:
  schemas:
    AccessCapabilities:
      additionalProperties: false
      properties:
        canComment:
          type: boolean
        canEdit:
          type: boolean
        canManageMembers:
          type: boolean
        canView:
          type: boolean
      required:
        - canView
        - canEdit
        - canComment
        - canManageMembers
      type: object
    AccessTokenResp:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AccessTokenResp.json
          format: uri
          readOnly: true
          type: string
        accessToken:
          type: string
      required:
        - accessToken
      type: object
    AccountState:
      enum:
        - active
        - over_quota_grace
        - over_quota_frozen
        - deletion_pending
        - suspended
        - deleted
      type: string
    AccountStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AccountStatus.json
          format: uri
          readOnly: true
          type: string
        deletionRequestedAt:
          format: date-time
          type: string
        graceEndsAt:
          format: date-time
          type: string
        planTier:
          $ref: "#/components/schemas/PlanTier"
        purgeAfter:
          format: date-time
          type: string
        state:
          $ref: "#/components/schemas/AccountState"
        storageLimitBytes:
          format: int64
          type: integer
        storageUsedBytes:
          format: int64
          type: integer
        suspendedReason:
          type: string
        userId:
          type: string
      required:
        - userId
        - state
        - planTier
        - storageUsedBytes
        - storageLimitBytes
      type: object
    ActivityBlock:
      additionalProperties: false
      properties:
        callId:
          type: string
        detail:
          type: string
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        status:
          type: string
        text:
          type: string
      required:
        - id
        - kind
      type: object
    AddChapterReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AddChapterReq.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Chapter name
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
      type: object
    AssignableRole:
      enum:
        - editor
        - commenter
        - viewer
      type: string
    Attempt:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Attempt.json
          format: uri
          readOnly: true
          type: string
        chapters:
          items:
            type: string
          type: array
        correct:
          format: double
          type: number
        id:
          type: string
        materialId:
          nullable: true
          type: string
        pct:
          format: int64
          type: integer
        quizName:
          type: string
        takenAt:
          format: date-time
          type: string
        total:
          format: double
          type: number
        workspaceName:
          type: string
      required:
        - id
        - materialId
        - quizName
        - workspaceName
        - chapters
        - correct
        - total
        - pct
        - takenAt
      type: object
    AttemptDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AttemptDetail.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          type: object
        chapters:
          items:
            type: string
          type: array
        correct:
          format: double
          type: number
        id:
          type: string
        materialId:
          nullable: true
          type: string
        pct:
          format: int64
          type: integer
        questions:
          items:
            additionalProperties: {}
            type: object
          type: array
        quizName:
          type: string
        takenAt:
          format: date-time
          type: string
        total:
          format: double
          type: number
        workspaceName:
          type: string
      required:
        - answers
        - questions
        - id
        - materialId
        - quizName
        - workspaceName
        - chapters
        - correct
        - total
        - pct
        - takenAt
      type: object
    BillingCheckoutReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BillingCheckoutReq.json
          format: uri
          readOnly: true
          type: string
        planTier:
          enum:
            - pro
          type: string
      required:
        - planTier
      type: object
    BillingInfo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BillingInfo.json
          format: uri
          readOnly: true
          type: string
        cancelAtPeriodEnd:
          type: boolean
        creditsLimitMicros:
          format: int64
          type: integer
        creditsPeriodStart:
          format: date-time
          type: string
        creditsReservedMicros:
          format: int64
          type: integer
        creditsUsedMicros:
          format: int64
          type: integer
        planTier:
          $ref: "#/components/schemas/PlanTier"
        renewalAt:
          format: date-time
          type: string
        storageLimitBytes:
          format: int64
          type: integer
        storageReservedBytes:
          format: int64
          type: integer
        storageUsedBytes:
          format: int64
          type: integer
        subscriptionStatus:
          $ref: "#/components/schemas/SubscriptionStatus"
      required:
        - planTier
        - subscriptionStatus
        - cancelAtPeriodEnd
        - storageUsedBytes
        - storageReservedBytes
        - storageLimitBytes
        - creditsUsedMicros
        - creditsReservedMicros
        - creditsLimitMicros
        - creditsPeriodStart
      type: object
    Canvas:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Canvas.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        scene: {}
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - updatedAt
      type: object
    Chapter:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Chapter.json
          format: uri
          readOnly: true
          type: string
        fileIds:
          items:
            type: string
          type: array
        id:
          type: string
        name:
          type: string
        order:
          format: int64
          type: integer
        workspaceId:
          type: string
      required:
        - id
        - workspaceId
        - name
        - order
        - fileIds
      type: object
    Citation:
      additionalProperties: false
      properties:
        chunkId:
          type: string
        fileId:
          type: string
        fileName:
          type: string
        pageEnd:
          format: int64
          type: integer
        pageStart:
          format: int64
          type: integer
        regions:
          items:
            $ref: "#/components/schemas/Region"
          nullable: true
          type: array
        snippet:
          type: string
      required:
        - fileId
        - fileName
        - snippet
      type: object
    CloneWorkspaceResp:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CloneWorkspaceResp.json
          format: uri
          readOnly: true
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
      required:
        - workspace
      type: object
    CognitiveLevel:
      enum:
        - recall
        - application
        - analysis
      type: string
    CollaborationTokenResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CollaborationTokenResponse.json
          format: uri
          readOnly: true
          type: string
        access:
          enum:
            - write
            - comment
            - shrink
          type: string
        expiresAt:
          format: int64
          type: integer
        room:
          type: string
        token:
          type: string
        url:
          type: string
      required:
        - token
        - room
        - url
        - access
        - expiresAt
      type: object
    Comment:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Comment.json
          format: uri
          readOnly: true
          type: string
        authorAvatarUrl:
          type: string
        authorName:
          type: string
        contentRich: {}
        createdAt:
          format: date-time
          type: string
        discussionId:
          type: string
        id:
          type: string
        isDeleted:
          type: boolean
        isEdited:
          type: boolean
        parentCommentId:
          type: string
        replies:
          items:
            $ref: "#/components/schemas/Comment"
          type: array
        updatedAt:
          format: date-time
          type: string
        userId:
          type: string
      required:
        - id
        - discussionId
        - userId
        - authorName
        - contentRich
        - isEdited
        - isDeleted
        - createdAt
        - updatedAt
        - replies
      type: object
    ContentOrderItem:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          type: string
        type:
          enum:
            - file
            - material
          type: string
      required:
        - id
        - type
      type: object
    Conversation:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Conversation.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
        workspaceId:
          type: string
      required:
        - id
        - workspaceId
        - title
        - createdAt
        - updatedAt
      type: object
    CreateAttemptReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateAttemptReq.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          description: User answers keyed by question id
          type: object
        correct:
          format: double
          minimum: 0
          type: number
        questions:
          description: Question snapshot taken at submit time
          items:
            additionalProperties: {}
            type: object
          nullable: true
          type: array
        total:
          exclusiveMinimum: true
          format: double
          minimum: 0
          type: number
        wrong:
          description: Questions answered incorrectly
          items:
            additionalProperties: {}
            type: object
          nullable: true
          type: array
      required:
        - correct
        - total
      type: object
    CreateCanvasReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateCanvasReq.json
          format: uri
          readOnly: true
          type: string
        name:
          maxLength: 200
          type: string
      type: object
    CreateCardReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateCardReq.json
          format: uri
          readOnly: true
          type: string
        back:
          maxLength: 4000
          minLength: 1
          type: string
        front:
          maxLength: 4000
          minLength: 1
          type: string
      required:
        - front
        - back
      type: object
    CreateCommentReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateCommentReq.json
          format: uri
          readOnly: true
          type: string
        contentRich:
          items:
            additionalProperties: {}
            type: object
          minItems: 1
          nullable: true
          type: array
        parentCommentId:
          type: string
      required:
        - contentRich
      type: object
    CreateConversationReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateConversationReq.json
          format: uri
          readOnly: true
          type: string
        title:
          description: Optional thread title
          maxLength: 200
          type: string
      type: object
    CreateDiscussionReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateDiscussionReq.json
          format: uri
          readOnly: true
          type: string
        anchorEnd:
          format: base64
          maxLength: 4096
          type: string
        anchorQuote:
          maxLength: 1000
          type: string
        anchorStart:
          format: base64
          maxLength: 4096
          type: string
        anchorVersion:
          format: int64
          minimum: 1
          type: integer
        blockId:
          type: string
        contentRich:
          items:
            additionalProperties: {}
            type: object
          minItems: 1
          nullable: true
          type: array
      required:
        - anchorVersion
        - contentRich
      type: object
    CreateEventReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateEventReq.json
          format: uri
          readOnly: true
          type: string
        end:
          format: date-time
          type: string
        labelIds:
          items:
            type: string
          nullable: true
          type: array
        location:
          maxLength: 200
          type: string
        note:
          maxLength: 2000
          type: string
        start:
          format: date-time
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - start
        - end
      type: object
    CreateFileReplacementUploadReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateFileReplacementUploadReq.json
          format: uri
          readOnly: true
          type: string
        contentType:
          type: string
        expectedRevision:
          format: int64
          minimum: 1
          type: integer
        sizeBytes:
          format: int64
          minimum: 0
          type: integer
      required:
        - expectedRevision
        - sizeBytes
      type: object
    CreateFlashcardSetReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateFlashcardSetReq.json
          format: uri
          readOnly: true
          type: string
        color:
          $ref: "#/components/schemas/UserColor"
          default: green
        name:
          maxLength: 200
          type: string
        workspaceId:
          type: string
      type: object
    CreateMaterialReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateMaterialReq.json
          format: uri
          readOnly: true
          type: string
        content:
          $ref: "#/components/schemas/Envelope"
          description: Versioned Plate document
        kind:
          $ref: "#/components/schemas/MaterialKind"
          description: Material kind
        scopeChapters:
          items:
            type: string
          nullable: true
          type: array
        scopeFileNames:
          items:
            type: string
          nullable: true
          type: array
        title:
          maxLength: 200
          type: string
      required:
        - kind
      type: object
    CreateQuizReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateQuizReq.json
          format: uri
          readOnly: true
          type: string
        chapters:
          items:
            type: string
          nullable: true
          type: array
        name:
          maxLength: 200
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        questions:
          items:
            additionalProperties: {}
            type: object
          nullable: true
          type: array
        timeLimitMin:
          format: int64
          maximum: 180
          minimum: 1
          type: integer
        workspaceId:
          type: string
      type: object
    CreateSourceUploadReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateSourceUploadReq.json
          format: uri
          readOnly: true
          type: string
        captionImages:
          type: boolean
        chapterId:
          type: string
        chapterName:
          type: string
        contentType:
          type: string
        kind:
          type: string
        name:
          type: string
        parseMode:
          type: string
        sizeBytes:
          format: int64
          type: integer
      required:
        - name
        - captionImages
        - sizeBytes
      type: object
    CreateWorkspaceInviteReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateWorkspaceInviteReq.json
          format: uri
          readOnly: true
          type: string
        identifier:
          description: Exact user ID or email address
          maxLength: 320
          minLength: 1
          type: string
        role:
          $ref: "#/components/schemas/AssignableRole"
      required:
        - identifier
        - role
      type: object
    CreateWorkspaceReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateWorkspaceReq.json
          format: uri
          readOnly: true
          type: string
        color:
          $ref: "#/components/schemas/UserColor"
          default: graphite
          description: User color
        name:
          description: Workspace name
          maxLength: 100
          minLength: 1
          type: string
        tags:
          description: Tags; at most 5; reuse existing by id or create new by value
          items:
            $ref: "#/components/schemas/TagInput"
          maxItems: 5
          nullable: true
          type: array
      required:
        - name
      type: object
    DeletionPreflight:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/DeletionPreflight.json
          format: uri
          readOnly: true
          type: string
        canDelete:
          type: boolean
        graceDays:
          format: int64
          type: integer
        lifecycleGeneration:
          format: int64
          type: integer
        storageUsedBytes:
          format: int64
          type: integer
        subscription:
          $ref: "#/components/schemas/SubscriptionBlocker"
        workspacesNeedingTransfer:
          items:
            $ref: "#/components/schemas/Workspace"
          nullable: true
          type: array
        workspacesToDestroy:
          items:
            $ref: "#/components/schemas/Workspace"
          nullable: true
          type: array
      required:
        - canDelete
        - lifecycleGeneration
        - workspacesNeedingTransfer
        - workspacesToDestroy
        - storageUsedBytes
        - graceDays
      type: object
    Discussion:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Discussion.json
          format: uri
          readOnly: true
          type: string
        anchorEnd:
          format: base64
          type: string
        anchorQuote:
          type: string
        anchorStart:
          format: base64
          type: string
        anchorVersion:
          format: int64
          type: integer
        authorAvatarUrl:
          type: string
        authorName:
          type: string
        blockId:
          type: string
        comments:
          items:
            $ref: "#/components/schemas/Comment"
          type: array
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        isDeleted:
          type: boolean
        isResolved:
          type: boolean
        materialId:
          type: string
        updatedAt:
          format: date-time
          type: string
        userId:
          type: string
      required:
        - id
        - materialId
        - anchorVersion
        - anchorQuote
        - userId
        - authorName
        - isResolved
        - isDeleted
        - createdAt
        - updatedAt
        - comments
      type: object
    Envelope:
      additionalProperties: false
      properties:
        schemaVersion:
          format: int64
          type: integer
        value:
          items:
            additionalProperties: {}
            type: object
          nullable: true
          type: array
      required:
        - schemaVersion
        - value
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Event.json
          format: uri
          readOnly: true
          type: string
        end:
          format: date-time
          type: string
        id:
          type: string
        labelIds:
          items:
            type: string
          type: array
        location:
          type: string
        note:
          type: string
        start:
          format: date-time
          type: string
        title:
          type: string
      required:
        - id
        - title
        - start
        - end
        - labelIds
      type: object
    File:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/File.json
          format: uri
          readOnly: true
          type: string
        addedAt:
          format: date-time
          type: string
        chapterId:
          nullable: true
          type: string
        content:
          type: string
        id:
          type: string
        indexed:
          type: boolean
        kind:
          $ref: "#/components/schemas/FileKind"
        name:
          type: string
        position:
          format: int64
          type: integer
        previewUrl:
          type: string
        revision:
          format: int64
          type: integer
        sizeBytes:
          format: int64
          type: integer
        status:
          $ref: "#/components/schemas/FileStatus"
        url:
          type: string
        workspaceId:
          type: string
      required:
        - id
        - workspaceId
        - chapterId
        - position
        - name
        - kind
        - sizeBytes
        - addedAt
        - indexed
        - revision
      type: object
    FileKind:
      enum:
        - pdf
        - doc
        - md
        - image
        - txt
        - sheet
        - slides
        - audio
        - json
        - unknown
      type: string
    FileStatus:
      enum:
        - pending
        - processing
        - ready
        - failed
      type: string
    Flashcard:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Flashcard.json
          format: uri
          readOnly: true
          type: string
        back:
          type: string
        front:
          type: string
        id:
          type: string
        known:
          type: boolean
        materialId:
          type: string
        srs:
          $ref: "#/components/schemas/SrsState"
      required:
