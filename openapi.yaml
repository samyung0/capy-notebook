info:
  title: Evo Notes API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/account/deletion:
    get:
      operationId: getDeletionPreflight
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionPreflight"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What account deletion would destroy, and what blocks it
      tags:
        - Account
    post:
      operationId: requestAccountDeletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAccountDeletionReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Schedule account deletion
      tags:
        - Account
  /api/account/status:
    get:
      operationId: getAccountStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Resolved account lifecycle state
      tags:
        - Account
  /api/attempts:
    get:
      operationId: listAttempts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Attempt"
                type: array
          description: OK
        default:
          content:
