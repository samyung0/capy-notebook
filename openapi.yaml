components:
  schemas:
    AccessCapabilities:
      additionalProperties: false
      properties:
        canEdit:
          type: boolean
        canEditContent:
          type: boolean
        canManageMembers:
          type: boolean
        canView:
          type: boolean
      required:
        - canView
        - canEdit
        - canEditContent
        - canManageMembers
      type: object
    AccessTokenResp:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AccessTokenResp.json
          format: uri
          readOnly: true
          type: string
        accessToken:
          type: string
      required:
        - accessToken
      type: object
    AccountState:
      enum:
        - active
        - over_quota_grace
        - over_quota_frozen
        - deletion_pending
        - suspended
        - deleted
      type: string
    AccountStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AccountStatus.json
          format: uri
          readOnly: true
          type: string
        deletionRequestedAt:
          format: date-time
          type: string
        graceEndsAt:
          format: date-time
          type: string
        planTier:
          $ref: "#/components/schemas/PlanTier"
        purgeAfter:
          format: date-time
          type: string
        state:
          $ref: "#/components/schemas/AccountState"
        storageLimitBytes:
          format: int64
          type: integer
        storageUsage:
          $ref: "#/components/schemas/StorageUsageLevel"
        storageUsedBytes:
          format: int64
          type: integer
        suspendedReason:
          type: string
        userId:
          type: string
      required:
        - userId
        - state
        - planTier
        - storageUsedBytes
        - storageLimitBytes
        - storageUsage
      type: object
    ActivityBlock:
      additionalProperties: false
      properties:
        callId:
          type: string
        capture:
          $ref: "#/components/schemas/ActivityCapture"
        detail:
          type: string
        effects:
          items:
            $ref: "#/components/schemas/ResourceEffect"
          nullable: true
          type: array
        error:
          $ref: "#/components/schemas/ToolError"
        id:
          type: string
        kind:
          enum:
            - narration
            - tool
          type: string
        name:
          type: string
        outcome:
          enum:
            - succeeded
            - refused
            - failed
            - cancelled
            - outcome_unknown
          type: string
        text:
          type: string
      required:
        - id
        - kind
      type: object
    ActivityCapture:
      additionalProperties: false
      properties:
        bbox:
          items:
            format: int64
            type: integer
          nullable: true
          type: array
        bytes:
          format: int64
          type: integer
        page:
          format: int64
          type: integer
      required:
        - page
        - bbox
        - bytes
      type: object
    AddChapterReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AddChapterReq.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Chapter name
          maxLength: 60
          minLength: 1
          type: string
      required:
        - name
      type: object
    AdoptedMaterialChild:
      additionalProperties: false
      properties:
        id:
          type: string
        sourceId:
          type: string
      required:
        - sourceId
        - id
      type: object
    AgentOperation:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AgentOperation.json
          format: uri
          readOnly: true
          type: string
        callId:
          type: string
        effect:
          $ref: "#/components/schemas/ResourceEffect"
        error:
          $ref: "#/components/schemas/ToolError"
        kind:
          type: string
        operationId:
          type: string
        outcome:
          type: string
        toolVersion:
          format: int64
          type: integer
        workspaceId:
          type: string
      required:
        - operationId
        - kind
        - toolVersion
        - outcome
      type: object
    AnonymousAsset:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AnonymousAsset.json
          format: uri
          readOnly: true
          type: string
        contentType:
          type: string
        expiresAt:
          format: date-time
          type: string
        url:
          type: string
      required:
        - url
        - contentType
        - expiresAt
      type: object
    AnonymousEmbed:
      additionalProperties: false
      properties:
        cards:
          items:
            $ref: "#/components/schemas/Card"
          type: array
        id:
          type: string
        kind:
          enum:
            - quiz
            - flashcards
          type: string
        questions: {}
      required:
        - id
        - kind
      type: object
    AnonymousFlashcards:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AnonymousFlashcards.json
          format: uri
          readOnly: true
          type: string
        author:
          $ref: "#/components/schemas/MaterialAuthor"
        cards:
          items:
            $ref: "#/components/schemas/Card"
          type: array
        color:
          $ref: "#/components/schemas/UserColor"
        id:
          type: string
        name:
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        provenance:
          $ref: "#/components/schemas/Provenance"
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - privacy
        - color
        - cards
        - updatedAt
        - author
      type: object
    AnonymousNote:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AnonymousNote.json
          format: uri
          readOnly: true
          type: string
        author:
          $ref: "#/components/schemas/MaterialAuthor"
        content: {}
        embeds:
          items:
            $ref: "#/components/schemas/AnonymousEmbed"
          type: array
        id:
          type: string
        name:
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        provenance:
          $ref: "#/components/schemas/Provenance"
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - privacy
        - content
        - updatedAt
        - author
        - embeds
      type: object
    AnonymousQuiz:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AnonymousQuiz.json
          format: uri
          readOnly: true
          type: string
        author:
          $ref: "#/components/schemas/MaterialAuthor"
        id:
          type: string
        name:
          type: string
        privacy:
          $ref: "#/components/schemas/Privacy"
        provenance:
          $ref: "#/components/schemas/Provenance"
        questions: {}
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - privacy
        - questions
        - updatedAt
        - author
      type: object
    AssignableRole:
      enum:
        - editor
        - viewer
      type: string
    Attempt:
      additionalProperties: false
      properties:
        chapters:
          items:
            type: string
          type: array
        correct:
          format: double
          type: number
        id:
          type: string
        materialId:
          nullable: true
          type: string
        pct:
          format: int64
          type: integer
        quizName:
          type: string
        takenAt:
          format: date-time
          type: string
        total:
          format: double
          type: number
        workspaceId:
          nullable: true
          type: string
        workspaceName:
          type: string
      required:
        - id
        - materialId
        - workspaceId
        - quizName
        - workspaceName
        - chapters
        - correct
        - total
        - pct
        - takenAt
      type: object
    AttemptDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AttemptDetail.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          type: object
        chapters:
          items:
            type: string
          type: array
        correct:
          format: double
          type: number
        id:
          type: string
        materialId:
          nullable: true
          type: string
        pct:
          format: int64
          type: integer
        questions:
          items:
            additionalProperties: {}
            type: object
          type: array
        quizName:
          type: string
        takenAt:
          format: date-time
          type: string
        total:
          format: double
          type: number
        workspaceId:
          nullable: true
          type: string
        workspaceName:
          type: string
      required:
        - answers
        - questions
        - id
        - materialId
        - workspaceId
        - quizName
        - workspaceName
        - chapters
        - correct
        - total
        - pct
        - takenAt
      type: object
    AttemptsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AttemptsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Attempt"
          type: array
        more:
          type: boolean
      required:
        - items
        - more
      type: object
    BankAssetOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankAssetOutputBody.json
          format: uri
          readOnly: true
          type: string
        url:
          type: string
      required:
        - url
      type: object
    BankBatchBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankBatchBody.json
          format: uri
          readOnly: true
          type: string
        questions:
          items:
            $ref: "#/components/schemas/Detail"
          nullable: true
          type: array
      required:
        - questions
      type: object
    BankCommentInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankCommentInputBody.json
          format: uri
          readOnly: true
          type: string
        text:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - text
      type: object
    BankCopyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankCopyInputBody.json
          format: uri
          readOnly: true
          type: string
        chapterId:
          description: Where a new quiz is filed; goes with quizName
          type: string
        chapterName:
          description: Files a new quiz in the chapter of this name (any case), created when missing; goes with quizName, exclusive with chapterId
          maxLength: 60
          type: string
        questionIds:
          description: Bank questions to copy, in this order
          items:
            type: string
          maxItems: 20
          minItems: 1
          type: array
          uniqueItems: true
        quizId:
          description: An existing quiz in the workspace to append to; exclusive with quizName
          type: string
        quizName:
          description: Name of a new quiz; exclusive with quizId
          maxLength: 120
          type: string
        workspaceId:
          minLength: 1
          type: string
      required:
        - questionIds
        - workspaceId
      type: object
    BankCopyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankCopyOutputBody.json
          format: uri
          readOnly: true
          type: string
        quizId:
          type: string
        workspaceId:
          type: string
      required:
        - workspaceId
        - quizId
      type: object
    BankMarksOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankMarksOutputBody.json
          format: uri
          readOnly: true
          type: string
        marks:
          additionalProperties:
            format: double
            type: number
          description: "Answered current questions by id: the latest answer's score, 0 to 1"
          type: object
      required:
        - marks
      type: object
    BankProgressOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankProgressOutputBody.json
          format: uri
          readOnly: true
          type: string
        topics:
          description: Topics with at least one answered current question, the most recently answered first
          items:
            $ref: "#/components/schemas/TopicProgress"
          type: array
      required:
        - topics
      type: object
    BankReviewInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankReviewInputBody.json
          format: uri
          readOnly: true
          type: string
        reviewed:
          type: boolean
      required:
        - reviewed
      type: object
    BankSaveInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankSaveInputBody.json
          format: uri
          readOnly: true
          type: string
        question:
          additionalProperties: {}
          type: object
        updatedAt:
          format: date-time
          type: string
      required:
        - question
        - updatedAt
      type: object
    BankSummaryOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BankSummaryOutputBody.json
          format: uri
          readOnly: true
          type: string
        questions:
          description: The topic's current questions in topic order, with the learner's latest results
          items:
            $ref: "#/components/schemas/BankSummaryQuestion"
          type: array
      required:
        - questions
      type: object
    BankSummaryQuestion:
      additionalProperties: false
      properties:
        answerTypes:
          description: The distinct answer types of the question's parts, in part order
          items:
            type: string
          type: array
        id:
          type: string
        marks:
          format: int64
          type: integer
        position:
          format: int64
          type: integer
        preview:
          type: string
        score:
          description: The latest answer's score for the current content, 0 to 1; null when not answered
          format: double
          nullable: true
          type: number
      required:
        - id
        - position
        - preview
        - marks
        - answerTypes
        - score
      type: object
    BillingCheckoutReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BillingCheckoutReq.json
          format: uri
          readOnly: true
          type: string
        planTier:
          enum:
            - pro
          type: string
      required:
        - planTier
      type: object
    BillingInfo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/BillingInfo.json
          format: uri
          readOnly: true
          type: string
        cancelAtPeriodEnd:
          type: boolean
        creditsLimitMicros:
          format: int64
          type: integer
        creditsPeriodStart:
          format: date-time
          type: string
        creditsReservedMicros:
          format: int64
          type: integer
        creditsUsedMicros:
          format: int64
          type: integer
        planTier:
          $ref: "#/components/schemas/PlanTier"
        renewalAt:
          format: date-time
          type: string
        storageLimitBytes:
          format: int64
          type: integer
        storageReservedBytes:
          format: int64
          type: integer
        storageUsedBytes:
          format: int64
          type: integer
        subscriptionStatus:
          $ref: "#/components/schemas/SubscriptionStatus"
      required:
        - planTier
        - subscriptionStatus
        - cancelAtPeriodEnd
        - storageUsedBytes
        - storageReservedBytes
        - storageLimitBytes
        - creditsUsedMicros
        - creditsReservedMicros
        - creditsLimitMicros
        - creditsPeriodStart
      type: object
    Canvas:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Canvas.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        scene: {}
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - updatedAt
      type: object
    Card:
      additionalProperties: false
      properties:
        back:
          type: string
        front:
          type: string
        id:
          type: string
        image:
          $ref: "#/components/schemas/CardImage"
      required:
        - id
        - front
        - back
      type: object
    CardContent:
      additionalProperties: false
      properties:
        back:
          type: string
        front:
          type: string
      required:
        - front
        - back
      type: object
    CardImage:
      additionalProperties: false
      properties:
        assetId:
          type: string
      required:
        - assetId
      type: object
    Chapter:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Chapter.json
          format: uri
          readOnly: true
          type: string
        fileIds:
          items:
            type: string
          type: array
        id:
          type: string
        name:
          type: string
        order:
          format: int64
          type: integer
        workspaceId:
          type: string
      required:
        - id
        - workspaceId
        - name
        - order
        - fileIds
      type: object
    CheckBankQuestionReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CheckBankQuestionReq.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          description: The learner's answers by part id
          type: object
      required:
        - answers
      type: object
    CheckReviewItemReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CheckReviewItemReq.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          description: The learner's answers by part id
          type: object
        itemId:
          minLength: 1
          type: string
        materialId:
          minLength: 1
          type: string
        session:
          $ref: "#/components/schemas/ReviewSessionRef"
          description: The review session the answer belongs to; the first answer records it
      required:
        - materialId
        - itemId
        - answers
      type: object
    Citation:
      additionalProperties: false
      properties:
        chunkId:
          type: string
        fileId:
          type: string
        fileName:
          type: string
        kind:
          type: string
        materialId:
          type: string
        "n":
          format: int64
          type: integer
        pageEnd:
          format: int64
          type: integer
        pageStart:
          format: int64
          type: integer
        regions:
          items:
            $ref: "#/components/schemas/Region"
          nullable: true
          type: array
        snippet:
          type: string
      required:
        - fileId
        - fileName
        - snippet
      type: object
    CloneWorkspaceResp:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CloneWorkspaceResp.json
          format: uri
          readOnly: true
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
      required:
        - workspace
      type: object
    CognitiveLevel:
      enum:
        - recall
        - application
        - analysis
      type: string
    CollaborationTokenResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CollaborationTokenResponse.json
          format: uri
          readOnly: true
          type: string
        access:
          enum:
            - write
            - read
          type: string
        expiresAt:
          format: int64
          type: integer
        room:
          type: string
        token:
          type: string
        url:
          type: string
      required:
        - token
        - room
        - url
        - access
        - expiresAt
      type: object
    Comment:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Comment.json
          format: uri
          readOnly: true
          type: string
        authorAvatarUrl:
          type: string
        authorName:
          type: string
        contentRich: {}
        createdAt:
          format: date-time
          type: string
        discussionId:
          type: string
        id:
          type: string
        isDeleted:
          type: boolean
        isEdited:
          type: boolean
        updatedAt:
          format: date-time
          type: string
        userId:
          type: string
      required:
        - id
        - discussionId
        - userId
        - authorName
        - contentRich
        - isEdited
        - isDeleted
        - createdAt
        - updatedAt
      type: object
    ComputationCheckReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ComputationCheckReq.json
          format: uri
          readOnly: true
          type: string
        partId:
          type: string
        question:
          additionalProperties: {}
          type: object
      required:
        - question
        - partId
      type: object
    ComputationCheckResp:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ComputationCheckResp.json
          format: uri
          readOnly: true
          type: string
        computational:
          type: boolean
        probability:
          format: double
          type: number
      required:
        - computational
        - probability
      type: object
    ContentOrderItem:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          type: string
        type:
          enum:
            - file
            - material
          type: string
      required:
        - id
        - type
      type: object
    Conversation:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Conversation.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
        workspaceId:
          type: string
      required:
        - id
        - workspaceId
        - title
        - createdAt
        - updatedAt
      type: object
    Cover:
      additionalProperties: false
      properties:
        color:
          pattern: ^#[0-9a-f]{6}$
          type: string
        kind:
          description: The symbols, icons or paper of a symbols, doodles or paper cover
          enum:
            - math
            - latin
            - kana
          type: string
        line:
          description: A paper cover's handwritten line
          maxLength: 40
          type: string
        pattern:
          description: The GeoPattern generator of a geo cover, or the Hero Patterns pattern of a hero cover
          type: string
        seed:
          description: Varies the generated art (Shuffle); empty uses the owner's id
          maxLength: 16
          pattern: ^[a-z0-9]*$
          type: string
        style:
          enum:
            - symbols
            - doodles
            - shelf
            - paper
            - type
            - geo
            - hero
          type: string
      required:
        - style
        - color
      type: object
    CreateAttemptReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateAttemptReq.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          description: The learner's answers by part id
          type: object
      required:
        - answers
      type: object
    CreateCanvasReq:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateCanvasReq.json
          format: uri
          readOnly: true
