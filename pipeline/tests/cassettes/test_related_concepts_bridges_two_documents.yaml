        \"Photosynthesis: light energy conversion, chlorophyll absorption of red/blue
        light, Calvin cycle carbon fixation in stroma, and roles of ATP/NADPH from
        light reactions powering the cycle.\", \"summary\": \"Photosynthesis is the
        process by which light energy is transformed into chemical energy stored in
        glucose. Chlorophyll, the primary pigment, absorbs light most efficiently
        in the red and blue wavelengths, while reflecting green light, which is why
        plants appear green. The overall process occurs in two main stages within
        chloroplasts. The light reactions, which take place in the thylakoid membranes,
