        \"Mitochondria are the organelles responsible for cellular respiration, where
        glucose is oxidized and the released energy is converted into ATP through
        oxidative phosphorylation. This ATP serves as the primary energy currency
        for most cellular activities, including active transport and protein synthesis.
        Chloroplasts, found in plant cells, also generate ATP, but through photosynthesis
