packages:
  - .
  - collaboration-rs/crates/notes/markdown
  - emails/editor
  - ops

injectWorkspacePackages: true

allowBuilds:
  # Its postinstall only sends install telemetry; nothing to build.
  "@openuidev/lang-core": false
  # Pulled in by @sentry/vite-plugin. Its postinstall fetches the platform
  # sentry-cli binary, which is what performs the source map upload.
  "@sentry/cli": true
  canvas: true
  # Pulled in by posthog-js. Its postinstall only prints a funding notice, so
  # there is nothing to run.
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
  workerd: true

# Capy patch: provider 3.4.4 sends back every awareness change it applies
# from the server, so each change returns N-1 times. Fixed upstream in
# hocuspocus PR #1129 (4.5); drop once @platejs/yjs allows ^4. Only
# @platejs/yjs's peer dependency installs it now (the editor uses the capy-sync
# room provider).
patchedDependencies:
  "@hocuspocus/provider@3.4.4": patches/@hocuspocus__provider@3.4.4.patch
  # Capy patch: Yjs has no option to skip its after-transaction formatting
  # cleanup; a doc built with `meta: { formattingCleanup: false }` skips it.
  # Office host docs do, since yrs keeps the cleanup off there
  # (human/frontend/office-files.md, 2026-10-09).
  "yjs@13.6.31": patches/yjs@13.6.31.patch
