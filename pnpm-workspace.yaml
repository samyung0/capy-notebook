packages:
  - .
  - collaboration
  - emails/editor
  - ops

injectWorkspacePackages: true

allowBuilds:
  # Its postinstall only sends install telemetry; nothing to build.
  "@openuidev/lang-core": false
  # Pulled in by @sentry/vite-plugin. Its postinstall fetches the platform
  # sentry-cli binary, which is what performs the source map upload.
  "@sentry/cli": true
  canvas: true
  # Pulled in by posthog-js. Its postinstall only prints a funding notice, so
  # there is nothing to run.
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
  workerd: true

# Capy patch: Hocuspocus builds a scratch Y.Doc (a webcrypto UUID) for every
# awareness message, for beforeHandleAwareness hooks we do not set. Offer
# upstream; drop once a release skips it.
patchedDependencies:
  "@hocuspocus/server@4.5.0": patches/@hocuspocus__server@4.5.0.patch
