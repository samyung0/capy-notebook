packages:
  - .
  - collaboration-rs/crates/notes/markdown
  - ops

injectWorkspacePackages: true

allowBuilds:
  # Pulled in by @sentry/vite-plugin. Its postinstall fetches the platform
  # sentry-cli binary, which is what performs the source map upload.
  "@sentry/cli": true
  canvas: true
  # Pulled in by posthog-js. Its postinstall only prints a funding notice, so
  # there is nothing to run.
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
  workerd: true

# Capy patch: provider 3.4.4 sends back every awareness change it applies
# from the server, so each change returns N-1 times. Fixed upstream in
# hocuspocus PR #1129 (4.5); drop once @platejs/yjs allows ^4. Only
# @platejs/yjs's peer dependency installs it now (the editor uses the capy-sync
# room provider).
patchedDependencies:
  "@hocuspocus/provider@3.4.4": patches/@hocuspocus__provider@3.4.4.patch
  # Capy patch (live-items, Epo 2026-10-10): a `mermaid` element's `source` is
  # a nested Y.Text, read as its string in Slate (Mermaid shape A); a chart's,
  # plot's or graph's `block` is a Y.Map edited entry by entry (Epo 2026-10-17).
  # A position that falls on an inline element (an inline equation, a link)
  # resolves to the text beside it, so a co-editor's caret there is drawn.
  # History maps the selection onto the room only once the editor is bound
  # to it (before that it holds the note's last projection).
  "@slate-yjs/core@1.0.2": patches/@slate-yjs__core@1.0.2.patch
  # Capy patch: Yjs has no option to skip its after-transaction formatting
  # cleanup; a doc built with `meta: { formattingCleanup: false }` skips it.
  # Office host docs do, since yrs keeps the cleanup off there
  # (human/frontend/office-files.md, 2026-10-09). Undo's redo keeps the right
  # neighbour a restored copy's trace finds only when it lies after the left,
  # else takes the item after the left, within a bounded walk, as the fork's
  # yrs does (openwiki plate-editor, Epo 2026-10-24).
  "yjs@13.6.31": patches/yjs@13.6.31.patch

# Security overrides, only where no parent release carries the fix:
# - geopattern 1.2.3 (its last release) pins extend ~1.2.1, which allows
#   prototype pollution; it only does shallow `extend({}, ...)` merges, which
#   3.0.2 (already in the tree) does the same way.
# - xmlbuilder2 3.x (its last 3.x is 3.1.1, and @platejs/docx-io needs ^3.1.1)
#   pins js-yaml 3.14.1, which has merge-key DoS and prototype-pollution
#   fixes in 3.15.2; docx-io never converts YAML.
# - argparse 1.x (under mammoth and js-yaml 3) pulls in sprintf-js, whose
#   precision DoS (GHSA-hp3w-g68c-fv3c) has no fixed release; argparse 2 has
#   no sprintf-js. Both packages load argparse only in their command-line tools
#   (bin/mammoth, bin/js-yaml.js), which nothing here runs and which argparse 2
#   no longer serves; their libraries never import it.
# - fast-uri below 3.1.9 (URI parsing advisories under ajv via @hookform/resolvers):
#   ajv's range allows 3.1.9, but the lockfile kept 3.1.8 on update.
# - KaTeX below 0.18.2 (settings prototype pollution, GHSA-238p-pmpm-9mq7)
#   stays under mermaid 11 (^0.16.47; mermaid 12 moves to 0.18) and
#   micromark-extension-math 3.1.0 (^0.16.0, its last release) via remark-math.
#   Both call only katex.renderToString, which 0.19 keeps (Epo 2026-10-22).
# - seroval below 1.6.11 (five advisories, GHSA-97r2-qh9m-474h and others,
#   under @tanstack/react-router via router-core): router-core's ^1.6.2 allows
#   1.6.12, but the lockfile kept 1.6.3 on update.
overrides:
  "geopattern>extend": 3.0.2
  "xmlbuilder2>js-yaml": 3.15.2
  "argparse@<2": 2.0.1
  "katex@<0.18.2": 0.19.0
  "dompurify@<3.4.17": 3.4.17
  "fast-uri@<3.1.9": 3.1.9
  "seroval@<1.6.11": 1.6.12

# `pnpm audit --prod` (CI job audit_pnpm) fails on any advisory not listed
# here. Each entry says why it waits.
auditConfig:
  ignoreGhsas: []
