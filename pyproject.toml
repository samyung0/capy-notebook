[project]
name = "evo-pipeline"
version = "0.4.0"
description = "Evo Notes ingest + retrieval pipeline (in-house chunk store, summary tree and concept index)"
requires-python = ">=3.10"
dependencies = [
  # Everything retrieval-related is ours now; the schema is owned by the Go
  # migrations, so psycopg over the shared Postgres is the whole storage layer.
  "psycopg[binary,pool]>=3.1",
  # Model providers (OpenAI-compatible: OpenRouter / DeepSeek / Gemini).
  "openai>=1.30",
  # Modal parse client + Redis progress + retrieval API.
  "requests>=2.31",
  "redis>=5.0",
  # Backblaze B2 source-object downloads in the ingest worker.
  "boto3>=1.34",
  "Pillow>=10.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",  # FastAPI UploadFile (/transcribe) form parsing
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "python-dotenv>=1.0",
  # Error reporting. Optional at runtime — pipeline/obs.py degrades to logging
  # when SENTRY_DSN is unset, which is the normal state in dev and e2e.
  "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
# vcrpy records the expensive LLM/embedding/VLM/Modal HTTP calls to YAML
# cassettes so the suite replays them for free (see pipeline/tests/README.md).
# testcontainers starts fresh Postgres/Redis containers for cassette tests.
# pytest-asyncio drives the async ingest/retrieval entry points.
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.15.0",
  "vcrpy>=6.0",
]

[project.scripts]
evo-worker = "pipeline.ingest.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]
include = ["pipeline*"]

[tool.ruff.lint.isort]
# Keep first-party grouping stable whether Ruff is invoked from the repo root
# (Cursor/IDE) or from pipeline/ (local CLI). Without this, `pipeline` is treated
# as third-party at the root and I001 flips the blank line before local imports.
known-first-party = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs Docker (fresh Postgres+Redis), but makes no model calls",
  "cassette: integration test that replays recorded HTTP via a VCR cassette (starts fresh Docker Postgres+Redis)",
]

[tool.ty.environment]
# setuptools installs `pipeline` from ./pipeline/pipeline/ (see packages.find above).
# ty's default first-party roots (repo root + ./src) mis-nest relative imports such
# as `from ..config import cfg`, so point ty at the same root setuptools uses.
root = ["./pipeline"]
python = ".venv"
