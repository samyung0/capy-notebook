<!doctype html>
<html data-style="capy" data-theme="latte" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="%VITE_RELEASE_SHA%" name="capy-release">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <!-- The capy and fisheye styles' latin Fustat, fetched with the document instead
         of after the CSS is parsed, so text usually paints in it at once. -->
    <link
      as="font"
      crossorigin
      href="/node_modules/@fontsource-variable/fustat/files/fustat-latin-wght-normal.woff2"
      rel="preload"
      type="font/woff2"
    >
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="light dark" name="color-scheme">
    <!-- The chosen style and theme from the first paint. Classic and
         inline: Vite would bundle a module script into the page's entry,
         which runs only after it loads; the site Worker allows it by hash
         (workers/site/handler.ts). -->
    <script>
    'use strict';
    (() => {
      try {
        const STYLES = ['capy', 'fisheye', 'notion'];
        const THEMES = ['latte', 'frappe', 'mocha'];
        const DARKTHEMES = ['frappe', 'mocha'];
        const root = document.documentElement;
        const style = localStorage.getItem('capy.style');
        let theme = localStorage.getItem('capy.theme');
        if (theme === 'macchiato') {
          theme = 'frappe';
          localStorage.setItem('capy.theme', theme);
        }

        root.dataset.style = STYLES.includes(style) ? style : 'capy';
        root.dataset.theme = THEMES.includes(theme)
          ? theme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'mocha'
            : 'latte';
        if (DARKTHEMES.includes(root.dataset.theme)) {
          root.classList.add('dark');
        }
        // The note font pick (src/features/notes/noteFont.ts).
        const noteFont = localStorage.getItem('capy.noteFont');
        if (noteFont === 'fustat' || noteFont === 'system') {
          root.dataset.noteFont = noteFont;
        }
        // The page frame's resolved paint (src/theme/pageFrame.ts), so it
        // shows with the first frame; shared pages read nothing else.
        const frame = JSON.parse(
          localStorage.getItem('capy.pageFrameCss') || 'null'
        );
        if (frame && typeof frame === 'object') {
          for (const [name, value] of Object.entries(frame)) {
            if (name.startsWith('--page-frame-') && typeof value === 'string') {
              root.style.setProperty(name, value);
            }
          }
          root.dataset.pageFrame = '';
        }
      } catch {
        // ignore
      }
    })();
    </script>
    <!--capy-share-head-->
  </head>
  <body>
    <!--capy-share-body-->
    <script src="/src/share/main.tsx" type="module"></script>
  </body>
</html>
